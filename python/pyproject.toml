[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canvasxpress-dashboards"
version = "0.1.1"
description = "Linked, multi-panel CanvasXpress dashboards in Python: Jupyter, Dash, Streamlit, Flask. Render a dashboards spec, or build a whole dashboard from a DataFrame."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Isaac Neuhaus" }]
keywords = ["canvasxpress", "dashboard", "visualization", "jupyter", "dash", "streamlit"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Framework :: Jupyter",
  "Topic :: Scientific/Engineering :: Visualization",
]
# No hard dependencies: a spec is JSON and the renderer is bundled. pandas is only needed to turn a
# DataFrame into a dashboard (a dict of columns or a list of records works without it).
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.3"]
test = ["pytest>=7", "pandas>=1.3"]

[project.urls]
Homepage = "https://www.canvasxpress.org"
Source = "https://github.com/neuhausi/canvasxpress-dashboards"

[tool.hatch.build.targets.wheel]
packages = ["src/canvasxpress_dashboards"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
