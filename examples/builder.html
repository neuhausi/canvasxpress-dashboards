<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/favicon.png" />
  <title>CanvasXpress Dashboards — no-code builder</title>

  <!--CX-LIB-START · scripts/build.mjs swaps this whole block for the served app
       shell (CDN CanvasXpress + same-origin bundle). During development you can
       point these URLs at a local CanvasXpress build; keep the START/END markers
       so the build transform still finds the block. -->
  <link href="https://www.canvasxpress.org/dist/canvasXpress.css" rel="stylesheet" />
  <script src="https://www.canvasxpress.org/dist/canvasXpress.min.js"></script>
  <!-- Cache-bust the local bundle so edits show up on a plain reload (dev convenience).
       Load it app-root-relative (NOT ../dist/): under a reverse-proxy subpath like
       /dashboards/ the "../dist/" form climbs OUT of the mount to the site-root /dist/
       (a stale copy); the bare name resolves to serve.py's same-origin bundle route on
       both the dev server (/) and the subpath (/dashboards/). -->
  <script>document.write('<script src="canvasxpress-dashboards.umd.js?v=' + Date.now() + '"><\/script>');</script>
  <!--CX-LIB-END-->

  <style>
    :root { --rail-bg: #ffffff; --rail-border: #e6e9ee; --muted: #6b7280; --accent: #087ad1; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f2f4f7; color: #222; }

    .app { display: flex; min-height: 100vh; }

    /* Left icon nav rail (Databox-style) */
    .rail { flex: 0 0 220px; width: 220px; background: var(--rail-bg);
      border-right: 1px solid var(--rail-border); display: flex; flex-direction: column;
      padding: 14px 10px; position: sticky; top: 0; height: 100vh; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 16px; text-decoration: none; color: inherit; }
    .brand img { width: 32px; height: 32px; }
    .brand span { font-weight: 700; font-size: 18px; letter-spacing: -0.01em; }
    .rail nav { display: flex; flex-direction: column; gap: 2px; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 10px; border-radius: 8px;
      color: #444; font-size:16px; cursor: pointer; text-decoration: none; }
    .nav-item .ic { width: 24px; text-align: center; font-size: 21px; }
    .nav-item:hover { background: #f4f6f8; }
    .nav-item.active { background: #eaf3fb; color: var(--accent); font-weight: 600; }
    .rail-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px 8px;
      border-top: 1px solid var(--rail-border); color: var(--muted); font-size:16px; }
    .rail-foot .avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--accent);
      color: #fff; display: flex; align-items: center; justify-content: center; font-size:14px; font-weight: 700; }

    /* Main content */
    .content { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
    /* min-height fits the Builder's two-row toolbar, so the strip is the
       same height on every view (Builder / Dashboards / Settings). */
    .topstrip { display: flex; align-items: center; gap: 12px; padding: 10px 20px; min-height: 102px;
      border-bottom: 1px solid var(--rail-border); background: #fff; }
    .toolbar-host { width: 100%; }
    .view-title { margin: 0; font-size:16px; font-weight: 600; }
    .view { padding: 16px 20px 32px; }
    /* Home is document-like content — cap it to the same width the examples use
       (1400px) and centre it, so the hero and how-to images don't balloon on a
       large screen. Other views (Builder canvas, etc.) stay full width. */
    .home { max-width: 1400px; margin: 0 auto; }

    /* Home view */
    .hero { background: linear-gradient(120deg, #eaf3fb, #f4f7fb); border-radius: 12px;
      padding: 28px; margin-bottom: 20px; position: relative; }
    .hero-gh { position: absolute; top: 20px; right: 20px; color: var(--muted);
      opacity: .75; transition: opacity .15s, color .15s; }
    .hero-gh:hover { opacity: 1; color: var(--accent); }
    .hero-gh svg { width: 26px; height: 26px; display: block; fill: currentColor; }
    .hero h1 { margin: 0 0 6px; font-size: 26px; }
    .hero p { margin: 0 0 16px; color: var(--muted); font-size:16px; }
    .cta { padding: 10px 18px; background: var(--accent); color: #fff; border: none;
      border-radius: 8px; font-size:16px; font-weight: 600; cursor: pointer; }
    .cta:hover { background: #065fa3; }
    /* Editorial layout: a 6-col grid with cards of varied widths. */
    /* align-items: stretch makes every card in a row take the tallest card's
       height, so each row lines up cleanly regardless of how the text wraps. */
    .notices { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; align-items: stretch; }
    .notice.n-sm { grid-column: span 2; }
    .notice.n-md { grid-column: span 3; }
    .notice.n-lg { grid-column: span 4; }
    .notice.n-feature { grid-column: span 6; }
    @media (max-width: 900px) { .notices { grid-template-columns: 1fr; } .notices .notice { grid-column: auto; } }
    .howto { display: flex; gap: 8px; align-items: stretch; margin: 0 0 22px; }
    .howto-step { flex: 1; min-width: 0; background: var(--rail-bg); border: 1px solid var(--rail-border);
      border-radius: 12px; padding: 14px; cursor: pointer; transition: box-shadow .15s, transform .15s; }
    .howto-step:hover { box-shadow: 0 6px 20px rgba(16,40,70,.10); transform: translateY(-1px); }
    .howto-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .howto-n { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff;
      font-size:16px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; }
    .howto-step h4 { margin: 0; font-size:16px; }
    .howto-step img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; object-position: top;
      border: 1px solid var(--rail-border); border-radius: 8px; background: #fff; }
    .howto-step p { margin: 10px 0 0; font-size:16px; color: var(--muted); line-height: 1.5; }
    .howto-arrow { align-self: center; font-size: 20px; color: var(--muted); flex: none; }
    @media (max-width: 1000px) { .howto { flex-direction: column; } .howto-arrow { transform: rotate(90deg); align-self: flex-start; margin-left: 24px; } }
    .notice { display: flex; gap: 12px; background: #fff; border: 1px solid var(--rail-border);
      border-radius: 10px; padding: 16px; }
    .notice .ni { font-size: 22px; line-height: 1; }
    .notice h3 { margin: 0 0 4px; font-size:16px; }
    .notice p { margin: 0; color: var(--muted); font-size:16px; line-height: 1.5; }
    /* Connector tags inside the "Live data" card — compact, monochrome, with icon. */
    .conn-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .conn-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px;
      font-weight: 500; letter-spacing: .1px; padding: 3px 9px; border: 1px solid var(--rail-border);
      border-radius: 6px; background: transparent; color: var(--muted); white-space: nowrap; }
    .conn-chip .ci { font-size: 19px; line-height: 1; }
    .placeholder { padding: 60px 20px; text-align: center; color: var(--muted); }

    /* Settings view */
    .settings { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
    /* An outer panel (like the Dashboards list) holding one card per
       category. */
    .settings-form { flex: 0 0 320px; min-width: 0; box-sizing: border-box;
      background: #fff; border: 1px solid var(--rail-border); border-radius: 10px;
      padding: 10px; display: flex; flex-direction: column; gap: 12px; }
    .settings-form h3 { margin: 0 0 4px; font-size:16px; }
    /* Category cards get a slightly darker border than the inputs inside
       them, so the grouping reads at a glance. */
    .settings-card { background: #fff; border: 1px solid #c9cfd8; border-radius: 10px;
      padding: 12px; display: flex; flex-direction: column; gap: 12px; }
    .settings-cat { margin: 0; font-size: 15px; font-weight: 700; }
    .settings-form label { display: flex; flex-direction: column; gap: 4px; font-size:14px;
      font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
    .settings-form input, .settings-form select { padding: 6px 8px; border: 1px solid var(--rail-border);
      border-radius: 6px; font: inherit; font-weight: 400; text-transform: none; color: inherit; background: #fff; }
    .settings-form input[type=color] { padding: 2px; height: 34px; }
    .settings-form .settings-field { display: flex; flex-direction: column; gap: 4px; }
    .settings-form .settings-lbl { font-size: 14px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .03em; color: var(--muted); }
    .settings-form .settings-inline { display: flex; align-items: center; gap: 10px; }
    .settings-form .settings-inline select { flex: 1 1 auto; min-width: 0; }
    .settings-form label.settings-check { flex-direction: row; align-items: center; gap: 6px;
      text-transform: none; letter-spacing: 0; font-weight: 400; color: inherit; white-space: nowrap; }
    .settings-form label.settings-check input[type=checkbox] { width: auto; padding: 0; }
    .settings-form input:disabled { opacity: .5; cursor: not-allowed; }
    .settings-preview { flex: 1 1 380px; min-width: 320px; }
    .settings-preview #s-preview { border: 1px dashed var(--rail-border); border-radius: 10px; padding: 0 12px 12px; }
    @media (prefers-color-scheme: dark) {
      .settings-form, .settings-card { background: #16181d; }
      .settings-card { border-color: #3a414c; }
      .settings-form input, .settings-form select { background: #1d2027; }
    }

    /* Data view: dataset list + CanvasXpress table preview */
    .data-view { display: flex; gap: 16px; align-items: stretch; }
    .data-list { flex: 0 0 260px; width: 260px; box-sizing: border-box; align-self: flex-start; background: #fff;
      border: 1px solid var(--rail-border); border-radius: 10px; overflow: hidden; }
    /* Cards: breathing room on all sides instead of edge-to-edge rows. */
    .data-item { padding: 10px 12px; margin: 10px; border: 1px solid var(--rail-border);
      border-radius: 8px; cursor: pointer; }
    .data-item + .data-item { margin-top: 0; }
    .data-item:hover { background: #f4f6f8; }
    .data-item.active { background: #eaf3fb; border-color: var(--accent); }
    .data-item-title { font-weight: 600; font-size:16px; }
    .data-item-meta { color: var(--muted); font-size:14px; margin-top: 2px; }
    .data-preview { flex: 1 1 auto; min-width: 320px; background: #fff;
      border: 1px solid var(--rail-border); border-radius: 10px; padding: 12px; }
    .data-preview-title { font-weight: 600; margin-bottom: 10px; color: #333; }
    #data-canvas-host { height: calc(100vh - 220px); min-height: 460px; overflow: hidden; }
    .data-preview.drop-active { outline: 2px dashed var(--accent); outline-offset: -6px;
      background: rgba(8,122,209,0.05); }
    .data-dropzone { border: 2px dashed var(--rail-border); border-radius: 10px;
      padding: 18px 14px; margin-top: 12px; text-align: center; color: var(--muted);
      font-size:16px; line-height: 1.5; background: transparent; }
    .data-dropzone .dz-icon { font-size: 22px; display: block; margin-bottom: 6px; }
    .data-dropzone strong { color: inherit; }
    .data-dropzone.drop-active { border-color: var(--accent); color: var(--accent);
      background: rgba(8,122,209,0.06); }
    @media (prefers-color-scheme: dark) {
      .data-list, .data-preview { background: #16181d; }
      .data-item:hover { background: #1d2027; }
      .data-item.active { background: #12283a; }
      .data-preview-title { color: #e6e8ec; }
    }

    @media (prefers-color-scheme: dark) {
      :root { --rail-bg: #16181d; --rail-border: #2c313a; --muted: #8a9099; }
      body { background: #0e1013; color: #e6e8ec; }
      .topstrip { background: #16181d; }
      .nav-item { color: #c9ccd1; }
      .nav-item:hover { background: #1d2027; }
      .nav-item.active { background: #12283a; }
      .hero { background: linear-gradient(120deg, #12283a, #1a1d24); }
      .notice { background: #16181d; }
    }
      .access-icon { font-size: 14px; cursor: help; vertical-align: middle; margin-left: 2px; }
      .admin-tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--rail-border); margin: 0 0 16px; }
    .admin-tab { padding: 8px 14px; border: none; border-bottom: 2px solid transparent; margin-bottom: -1px;
      background: none; color: var(--muted); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
    .admin-tab:hover { color: inherit; }
    .admin-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  </style>
</head>
<body>
  <div class="app">
    <aside class="rail">
      <a class="brand" href="/" title="CanvasXpress home">
        <img src="https://www.canvasxpress.org/favicon.png" alt="CanvasXpress" />
        <span>CanvasXpress</span>
      </a>
      <nav>
        <a class="nav-item active" data-view="Home"><span class="ic">🏠</span> Home</a>
        <a class="nav-item" data-view="Builder"><span class="ic">🧩</span> Builder</a>
        <a class="nav-item" data-view="Dashboards"><span class="ic">📊</span> Dashboards</a>
        <a class="nav-item" data-view="Data"><span class="ic">🗂️</span> Data</a>
        <a class="nav-item" data-view="Schedules"><span class="ic">⏰</span> Schedules</a>
        <a class="nav-item" data-view="Settings"><span class="ic">⚙️</span> Settings</a>
        <a class="nav-item" data-view="Admin" id="nav-admin" style="display:none"><span class="ic">🛡️</span> Admin</a>
        <a class="nav-item" data-view="Logs" id="nav-logs" style="display:none"><span class="ic">🧾</span> Logs</a>
        <a class="nav-item" href="/examples/index.html" id="nav-examples"><span class="ic">🧭</span> Examples</a>
      </nav>
      <div class="rail-foot" id="rail-foot">
        <span class="avatar" id="rail-avatar">?</span>
        <span id="rail-user" style="flex:1">Signed out</span>
        <a id="rail-auth" href="#" style="font-size:14px;color:var(--muted);text-decoration:none">Sign in</a>
      </div>
    </aside>

    <main class="content">
      <div class="topstrip">
        <div id="toolbar" class="toolbar-host"></div>
      </div>
      <div id="view" class="view"></div>
    </main>
  </div>

  <script>
    // A persistence client is optional: if the cxd_server isn't running on this
    // origin, Save will just report an error and everything else still works.
    //
    // The API base defaults to this page's own origin. If you serve builder.html
    // from a DIFFERENT origin than cxd_server (e.g. VS Code Live Server, or
    // `python -m http.server`, or file://), point it at the server explicitly
    // with `?api=` — e.g. builder.html?api=http://localhost:8000 — otherwise
    // /api/* requests hit the static server and 404.
    // Default the API base to the path prefix the app is mounted under, so the
    // same page works at / (dev server) and behind a reverse-proxy subpath
    // like /dashboards/ (e.g. canvasxpress.org).
    var API_BASE = new URLSearchParams(location.search).get('api') ||
      location.pathname.replace(/\/(examples\/)?[^/]*$/, '');
    // Static markup can't embed API_BASE — fix up absolute links here.
    document.getElementById('nav-examples').href = API_BASE + '/examples/index.html';
    var client = CanvasXpressDashboards.createDashboardClient({ baseUrl: API_BASE });

    var CXD = CanvasXpressDashboards;

    // The working dashboard, shared across views (Builder edits it, Settings
    // tweaks its presentation). It starts EMPTY — no panels and no data
    // sources: the Assistant's "Datasets to use" checklist is the single
    // roster, and ticking a dataset there (or binding one via the Data view)
    // declares it as a spec source for panels to bind to.
    var currentSpec = CXD.blankSpec('my-dashboard', 'My Dashboard');

    // --- app shell: left-rail views drive the toolbar + canvas ---
    var toolbarEl = document.getElementById('toolbar');
    var viewEl = document.getElementById('view');
    var navItems = [].slice.call(document.querySelectorAll('.nav-item'));
    var currentBuilder = null;
    var currentPreview = null;

    function teardown() {
      if (currentBuilder) {
        // Capture the builder's latest spec (folds in live ⚙-customizer edits)
        // before destroying it, so other views see the current state.
        try { currentSpec = currentBuilder.getSpec(); } catch (e) {}
        try { currentBuilder.destroy(); } catch (e) {}
        currentBuilder = null;
      }
      if (currentPreview) { try { currentPreview.then(function (h) { if (h && h.destroy) h.destroy(); }); } catch (e) {} currentPreview = null; }
      destroyDataPreview();
      toolbarEl.innerHTML = '';
      toolbarEl.className = 'toolbar-host';   // strip any builder toolbar classes
      viewEl.innerHTML = '';
    }

    function notice(icon, title, bodyHtml, cls) {
      return '<div class="notice' + (cls ? ' ' + cls : '') + '"><div class="ni">' + icon +
             '</div><div><h3>' + title + '</h3><p>' + bodyHtml + '</p></div></div>';
    }

    function showHome() {
      teardown();
      toolbarEl.innerHTML = '<h2 class="view-title">Home</h2>';
      function step(n, img, title, body) {
        return '<div class="howto-step" data-goto="Builder">' +
          '<div class="howto-head"><span class="howto-n">' + n + '</span><h4>' + title + '</h4></div>' +
          '<img src="' + API_BASE + '/examples/assets/' + img + '?v=4" alt="' + title + '"/>' +
          '<p>' + body + '</p></div>';
      }
      // The connectors available through canvasxpress-connectors, as compact
      // monochrome tags with an icon. Keep in sync with cx_connectors/sources/*.
      var connectors = [
        ['🗄️', 'SQL databases'],
        ['🧱', 'Databricks'],
        ['❄️', 'Snowflake'],
        ['🔷', 'BigQuery'],
        ['📗', 'Google Sheets'],
        ['☁️', 'Salesforce'],
        ['🛎️', 'ServiceNow'],
        ['📈', 'Google Analytics'],
        ['💹', 'Finance feeds']
      ];
      var connChips = '<div class="conn-chips">' + connectors.map(function (c) {
        return '<span class="conn-chip"><span class="ci">' + c[0] + '</span>' + c[1] + '</span>';
      }).join('') + '</div>';

      viewEl.innerHTML =
        '<div class="home">' +
        '<div class="hero">' +
          '<a class="hero-gh" href="https://github.com/neuhausi/canvasxpress-dashboards" target="_blank" rel="noopener" title="View on GitHub" aria-label="View on GitHub">' +
            '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>' +
          '</a>' +
          '<h1>Welcome to CanvasXpress Dashboards</h1>' +
          '<p>Pick your data, say what you want, get a live dashboard — then refine it by hand or by chat, and share it.</p>' +
          '<button class="cta" id="home-create">+ Create a dashboard</button>' +
        '</div>' +
        '<div class="howto">' +
          step(1, 'home-step1-datasets.png', 'Pick your datasets',
               'Search and tick the data to use — here, the bench cohort’s survival table.') +
          '<div class="howto-arrow">➜</div>' +
          step(2, 'home-step2-chat.png', 'Describe what you want',
               '“Make a Kaplan–Meier plot — time and event, split by cluster.” It knows your columns.') +
          '<div class="howto-arrow">➜</div>' +
          step(3, 'home-step3-dashboard.png', 'Get a live dashboard',
               'The KM curves land on the canvas — coordinated, editable (⚙), saveable, shareable.') +
        '</div>' +
        '<div class="notices">' +
          notice('🎨', 'Edit every panel', 'Every panel opens the native CanvasXpress customizer — click the ⚙ to change chart type, colors, grouping and axes. Drag panels to reorder or resize them, and every change is saved with the dashboard. Prefer to describe it? Ask the chat assistant and it applies the tweak for you. Swap a panel’s dataset on the fly and the chart updates in place — no reload.', 'n-md') +
          notice('🔌', 'Connect your data', 'Bind panels to your own sources through <b>canvasxpress-connectors</b> — SQL warehouses, spreadsheets, business apps and finance feeds:' + connChips, 'n-md') +
          notice('📡', 'Real-time streams', 'A panel can follow a stream as it happens: pick a 📡 stream in the panel’s <b>Data</b> list, set how many samples to keep and how often to update, and the chart slides forward with each new reading — no reload, one redraw per frame however fast data arrives. The browser never holds a credential, and every subscription is recorded in the audit log. <a href="' + API_BASE + '/examples/live-ops.html">See it in Live Ops</a> · <a href="https://github.com/neuhausi/canvasxpress-dashboards/blob/main/docs/live-streaming.md" target="_blank" rel="noopener">How it works</a>.', 'n-feature') +
          notice('🧩', 'Blend and link sources', 'Join two sources on a key, link related ones so selecting a patient marks their lab visits everywhere, and filter the whole board from one <b>Filters</b> panel with saved schemes. <a href="' + API_BASE + '/examples/cohort-explorer.html">See it in the Cohort Explorer</a>.', 'n-md') +
          notice('🧪', 'R and Python functions', 'A data source can be a short R or Python snippet over your other sources — rank genes against survival, fit a model — and its result feeds panels like any dataset. Runs on the server in a sandbox, when an admin enables it.', 'n-md') +
          notice('🛡️', 'Governance', 'Roles decide who can build, upload and share. Share a dashboard or dataset with people and groups, to view or to edit. Row- and column-level security decides who sees which rows and columns — site A sees site A; only clinicians see names — in the app, in shared dashboards and on share links. Lineage shows which dashboards read which data. <a href="https://github.com/neuhausi/canvasxpress-dashboards/blob/main/docs/governance.md" target="_blank" rel="noopener">How it works</a>.', 'n-lg') +
          notice('🧾', 'Audit log', 'Who did what, when: sign-ins, changes, shares, share-link views and function runs. Tamper-evident, filterable and exportable from the Admin view.', 'n-sm') +
          notice('⏰', 'Scheduling', 'Refresh datasets from a URL or a database every night, get an email when a value crosses a threshold, and send dashboards to people every Monday — with a PNG snapshot of what each of them may see. Set it up in <b>Schedules</b>.', 'n-md') +
          notice('🔗', 'Sharing', 'Share with people and groups from the Dashboards view (<b>People</b>), or publish a read-only link — a live, always-current dashboard, straight into an email.', 'n-md') +

    // Make a container a drop target: dropping a valid CanvasXpress input
    // (CSV / TSV / CanvasXpress JSON) imports it into the store and previews it.
    function setupDropZone(pane) {
      if (!pane) return;
      function stop(e) { e.preventDefault(); e.stopPropagation(); }
      // Capture phase so we intercept before any CanvasXpress canvas handler.
      pane.addEventListener('dragenter', function (e) { stop(e); pane.classList.add('drop-active'); }, true);
      pane.addEventListener('dragover', function (e) {
        stop(e); if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy'; pane.classList.add('drop-active');
      }, true);
      pane.addEventListener('dragleave', function (e) {
        stop(e); if (!pane.contains(e.relatedTarget)) pane.classList.remove('drop-active');
      }, true);
      pane.addEventListener('drop', function (e) {
        stop(e); pane.classList.remove('drop-active');
        var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (!f) return;
        // Prefer CanvasXpress's own loader (it reads CSV/TSV/JSON/PNG/… and
        // updates the live table). Without a table instance yet, PNGs need one
        // bootstrapped (only CanvasXpress can decode its own PNGs); plain
        // text/JSON files upload directly.
        if (dataPreviewInstance && typeof dataPreviewInstance.loadFile === 'function') {
          loadDroppedFileViaCanvasXpress(e.dataTransfer, f);
        } else if (/\.png$/i.test(f.name || '')) {
          bootstrapPreviewInstance(function () {
            loadDroppedFileViaCanvasXpress(e.dataTransfer, f);
          });
        } else {
          importDataFile(f);
        }
      }, true);
    }

    // Create a minimal hidden table instance so CanvasXpress's loadFile can
    // decode a dropped file (needed for CanvasXpress PNGs, which embed their
    // data/config in metadata only CanvasXpress can read).
    function bootstrapPreviewInstance(cb) {
      var host = document.getElementById('data-canvas-host');
      if (!host || !window.CanvasXpress) return;
      host.innerHTML = '';
      var canvas = document.createElement('canvas');
      canvas.id = 'data-preview-bootstrap-' + Date.now();
      var width = Math.max(320, host.clientWidth || 640);
      canvas.setAttribute('width', width);
      canvas.setAttribute('height', 460);
      canvas.style.width = width + 'px';
      canvas.style.height = '460px';
      host.appendChild(canvas);
      dataPreviewInstance = new window.CanvasXpress(canvas.id,
        { y: { vars: ['-'], smps: ['-'], data: [[0]] } },
        { view: 'table', resizable: false }, {});
      cb();
    }

    // Hand a dropped file to CanvasXpress: it parses + updates the visible table,
    // then its callback gives us the loaded data, which we persist to the store
    // and re-preview cleanly from there.
    function loadDroppedFileViaCanvasXpress(dataTransfer, file) {
      var titleEl = document.getElementById('data-title');
      if (titleEl) titleEl.textContent = 'Reading “' + (file.name || 'file') + '” …';
      var title = (file.name || 'dataset').replace(/\.[^.]+$/, '');
      // Read the file's own config first (a CanvasXpress JSON is {data, config});
      // a File stays valid across the async read, so it's passed to loadFile below.
      readFileConfig(file, function (fileConfig) {
        // loadFile(event, isFlag, callback, providedFile, asTable): asTable forces
        // a table view; the callback receives the new instance.
        dataPreviewInstance.loadFile(dataTransfer, false, function (newInstance) {
          dataPreviewInstance = newInstance;   // track for cleanup on the next preview
          var data = newInstance && newInstance.data;
          if (!data || !data.y) {
            if (titleEl) titleEl.textContent = 'That file isn’t a dataset CanvasXpress can load.';
            return;
          }
          // Associate any graph config the file carried (a CanvasXpress JSON's
          // graphType/etc.) so panels bound to this dataset adopt it as their
          // first state. Prefer the file's config; else the parsed instance's.
          var config = fileConfig ||
            cleanConfig(typeof newInstance.getConfig === 'function' ? newInstance.getConfig() : null);
          var opts = { format: 'cx', title: title };
          if (config && Object.keys(config).length) opts.config = config;
          client.uploadDataset({ y: data.y, x: data.x }, opts).then(function (summary) {
            loadDataList(summary && summary.id);   // list + select + clean re-render
          }, function (err) {
            window.alert('Loaded into the table but couldn’t store it: ' + (err && err.message || err));
          });
        }, file, true);
      });
    }

    // Read a dropped CanvasXpress JSON's own `config` ({data, config}); non-JSON
    // files resolve to null (their config, if any, comes from the parsed instance).
    function readFileConfig(file, doneCb) {
      var name = (file.name || '').toLowerCase();
      var looksJson = /\.(json|cx)$/.test(name) || (file.type || '').indexOf('json') >= 0;
      if (!looksJson || typeof FileReader === 'undefined') { doneCb(null); return; }
      var reader = new FileReader();
      reader.onload = function () {
        var cfg = null;
        try {
          var obj = JSON.parse(reader.result);
          if (obj && obj.config && typeof obj.config === 'object') cfg = cleanConfig(obj.config);
        } catch (e) { cfg = null; }
        doneCb(cfg);
      };
      reader.onerror = function () { doneCb(null); };
      reader.readAsText(file);
    }

    // Drop config values carrying CanvasXpress's internal "__FACTOR__" sentinel
    // (derived grouping state that breaks a re-render with fresh data).
    function cleanConfig(config) {
      if (!config || typeof config !== 'object') return null;
      var out = {};
      Object.keys(config).forEach(function (k) {
        try {
          if (JSON.stringify(config[k]).indexOf('__FACTOR__') < 0) out[k] = config[k];
        } catch (e) { /* skip unserializable */ }
      });
      return out;
    }

    // Convert tab-delimited text to CSV (quoting cells with commas/quotes).
    function tsvToCsv(text) {
      return text.split(/\r?\n/).map(function (line) {
        return line.split('\t').map(function (c) {
          return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c;
        }).join(',');
      }).join('\n');
    }

    // Import a dropped file into the store, detecting the format from its
    // extension (falling back to content sniffing), then refresh + preview it.
    function importDataFile(file) {
      var name = (file.name || '').toLowerCase();
      var title = (file.name || 'dataset').replace(/\.[^.]+$/, '');
      var titleEl = document.getElementById('data-title');
      if (titleEl) titleEl.textContent = 'Importing “' + (file.name || 'dataset') + '” …';
      function done(summary) { loadDataList(); if (summary && summary.id) previewDataset(summary); }
      function failMsg(e) {
        window.alert('Import failed: ' + (e && e.message || e));
        if (titleEl) titleEl.textContent = 'Select a dataset to preview it — or drop a file here to import.';
      }

      if (/\.png$/.test(name)) {
        return failMsg(new Error('PNG import isn’t supported here yet — use CSV, TSV, or CanvasXpress JSON.'));
      }
      if (/\.csv$/.test(name)) {
        return client.uploadDataset(file, { format: 'csv', title: title }).then(done, failMsg);
      }
      if (/\.(tsv|tab)$/.test(name)) {
        return file.text().then(function (t) {
          return client.uploadDataset(tsvToCsv(t), { format: 'csv', title: title });
        }).then(done, failMsg);
      }
      if (/\.(json|cx)$/.test(name)) {
        return client.uploadDataset(file, { format: 'json', title: title }).then(done, failMsg);
      }
      // Unknown/no extension → sniff the content.
      file.text().then(function (t) {
        var s = t.replace(/^\uFEFF/, '').trim();
        if (s.charAt(0) === '{' || s.charAt(0) === '[') {
          return client.uploadDataset(t, { format: 'json', title: title });
        }
        var firstLine = s.split(/\r?\n/)[0] || '';
        if (firstLine.indexOf('\t') >= 0 && firstLine.indexOf(',') < 0) {
          return client.uploadDataset(tsvToCsv(t), { format: 'csv', title: title });
        }
        return client.uploadDataset(t, { format: 'csv', title: title });
      }).then(done, failMsg);
    }

        currentPermissions = (r && r.permissions) || [];
        directoryCache = null;
        renderUserChip();
        return currentUser;
      }, function () { currentUser = null; isAdmin = false; renderUserChip(); return null; });
    }

      client.logout().catch(function () {}).then(function (r) {

      // ---- Audit log (read-only; the server records, the admin browses) -----
      var auditNext = null;
      var auditStatus = document.getElementById('audit-status');
      function auditFilters() {
        return {
          actor: document.getElementById('audit-actor').value.trim(),
          action: document.getElementById('audit-action').value,
          outcome: document.getElementById('audit-outcome').value
        };
      }
      function auditCell(text, extra) {
        return '<td style="padding:5px 8px;border-top:1px solid var(--border,#e2e5ea);' + (extra || '') + '">' + text + '</td>';
      }
      function renderAudit(page, append) {
        var body = document.getElementById('audit-rows');
        if (!body) return;
        if (!append) body.innerHTML = '';
        if (!page.enabled) {
          body.innerHTML = '<tr><td colspan="6" style="padding:8px">Auditing is turned off on this server (CXD_AUDIT=off).</td></tr>';
        } else if (!page.events.length && !append) {
          body.innerHTML = '<tr><td colspan="6" style="padding:8px">No matching events.</td></tr>';
        }
        page.events.forEach(function (e) {
          var colour = e.outcome === 'denied' ? '#b26a00' : e.outcome === 'error' ? '#d64545' : 'inherit';
          var detail = e.detail ? esc(JSON.stringify(e.detail)) : '';
          var tr = document.createElement('tr');
          tr.innerHTML =
            auditCell(esc((e.ts || '').replace('T', ' ').replace(/\+00:00$/, '')), 'white-space:nowrap') +
            auditCell(esc(e.actor || '—')) +
            auditCell(esc(e.action)) +
            auditCell(esc(e.target || '') + (e.owner && e.owner !== e.actor ? ' <span style="color:var(--muted)">(' + esc(e.owner) + ')</span>' : '')) +
            auditCell(esc(e.outcome) + (e.status >= 400 ? ' ' + e.status : ''), 'color:' + colour) +
            auditCell('<code style="font-size:12px;word-break:break-all">' + detail + '</code>');
          body.appendChild(tr);
        });
        auditNext = page.next;
        document.getElementById('audit-more').style.display = auditNext ? '' : 'none';
        document.getElementById('audit-export').href = client.auditExportUrl(auditFilters(), 'csv');
      }
      function loadAudit(append) {
        var filters = auditFilters();
        if (append && auditNext) filters.before = auditNext;
        auditStatus.style.color = 'inherit';
        auditStatus.textContent = '';
        return client.auditLog(filters).then(function (page) {
          var select = document.getElementById('audit-action');
          if (select.options.length === 1 && page.actions) {
            var groups = {};
            page.actions.forEach(function (a) { groups[a.split('.')[0] + '.'] = true; });
            Object.keys(groups).sort().forEach(function (g) {
              var o = document.createElement('option'); o.value = g; o.textContent = g + '*'; select.appendChild(o);
            });
            page.actions.forEach(function (a) {
              var o = document.createElement('option'); o.value = a; o.textContent = a; select.appendChild(o);

          }
          renderAudit(page, append);

      document.getElementById('audit-verify').onclick = function () {
        auditStatus.style.color = 'inherit';
        auditStatus.textContent = 'Verifying…';

          auditStatus.textContent = r.ok
            ? 'Chain intact: ' + r.checked + ' events verified' + (r.checked ? ' (#' + r.first_seq + '–#' + r.last_seq + ').' : '.')
            : 'Chain BROKEN at event #' + r.broken_at + ': an entry was edited or deleted.';

      // ---- Default examples (app-owned) maintenance -------------------------
      // These call the API directly (owner=app) so the admin can unlock/delete
      // the shared examples; the server enforces admin-only for these writes.
      var EX_OWNER = 'app';
      var exErr = document.getElementById('admin-ex-err');
      function exFail(err) { exErr.textContent = (err && err.message) || String(err); }
      function apiJSON(method, path, body) {
        var init = { method: method, credentials: 'include', headers: {} };
        if (body !== undefined) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(body); }
        return fetch(API_BASE + path, init).then(function (res) {
          return res.text().then(function (t) {
            var p = t ? JSON.parse(t) : null;
            if (!res.ok) throw new Error((p && p.detail) || ('HTTP ' + res.status));
            return p;
          });
        });
      }
      function exRow(host, item, kind) {
        var row = document.createElement('div');
        row.className = 'data-item';
        row.style.cssText = 'display:flex;align-items:center;gap:10px';
        var lockTag = item.locked ? ' <span title="protected" style="font-size:13px">🔒</span>' : '';
        row.innerHTML =
          '<div style="flex:1">' +
            '<div class="data-item-title">' + esc(item.title || item.id) + lockTag + '</div>' +
            '<div class="data-item-meta">' + esc(item.id) + (item.store ? ' · ' + esc(item.store) : '') + '</div>' +
          '</div>';
        var params = 'owner=' + encodeURIComponent(EX_OWNER) + (item.store ? '&store=' + encodeURIComponent(item.store) : '');
        var lockBtn = document.createElement('button');
        lockBtn.textContent = item.locked ? 'Unlock' : 'Lock';
        lockBtn.style.cssText = 'font-size:14px;padding:4px 8px;cursor:pointer';
        lockBtn.onclick = function () {
          exErr.textContent = '';
          apiJSON('POST', '/api/' + kind + '/' + encodeURIComponent(item.id) + '/lock?' + params,
                  { locked: !item.locked }).then(loadExamples, exFail);
        };
        row.appendChild(lockBtn);
        var del = document.createElement('button');
        del.textContent = 'Delete';
        del.style.cssText = 'font-size:14px;padding:4px 8px;cursor:pointer;color:#d64545';
        del.onclick = function () {
          if (!window.confirm('Delete example ' + kind.slice(0, -1) + ' "' + (item.title || item.id) + '"? This removes it for everyone.')) return;
          exErr.textContent = '';
          apiJSON('DELETE', '/api/' + kind + '/' + encodeURIComponent(item.id) + '?' + params).then(loadExamples, exFail);
        };
        row.appendChild(del);
        host.appendChild(row);
      }
      function fillExamples(hostId, items, kind) {
        var host = document.getElementById(hostId);
        if (!host) return;
        var mine = (items || []).filter(function (it) { return it.owner === EX_OWNER || it.example; });
        if (!mine.length) { host.innerHTML = '<div class="placeholder">No example ' + kind + '.</div>'; return; }
        host.innerHTML = '';
        mine.forEach(function (it) { exRow(host, it, kind); });
      }
      function loadExamples() {
        exErr.style.color = '#d64545';
        apiJSON('GET', '/api/dashboards').then(function (r) {
          fillExamples('admin-ex-dash', r.dashboards, 'dashboards');
        }, exFail);
        apiJSON('GET', '/api/datasets').then(function (r) {

      loadGovernance();
      loadExamples();

    // List the datasets and auto-select one so a table is always visible: the
    // requested `selectId`, else the previously-selected dataset, else the first.
    // Filter a card list (Data / Dashboards) by its items' data-search text —
    // same behavior as the Builder's dataset search box.
    function wireListSearch(inputId, listId) {
      var input = document.getElementById(inputId);
      var listEl = document.getElementById(listId);
      if (!input || !listEl) return;
      input.oninput = function () {
        var q = input.value.trim().toLowerCase();
        listEl.querySelectorAll('.data-item').forEach(function (row) {
          var hay = row.getAttribute('data-search') || '';
          row.style.display = (!q || hay.indexOf(q) !== -1) ? '' : 'none';
        });
      };
      if (input.value) input.oninput();   // re-apply after a list reload
    }

    // --- Database sources: the canvasxpress-connectors BYO app mounted at
    // /connectors, with a BRIDGED session — the user signs in once (to this
    // app); we fetch a derived credential and log into the connectors app
    // behind the scenes. Connection strings are stored server-side, encrypted.
    var connectorsBridge = null;   // Promise: resolves once cxc_session is set

    function ensureConnectorsSession() {
      if (connectorsBridge) return connectorsBridge;
      connectorsBridge = fetch(API_BASE + '/api/connectors/credentials', { credentials: 'include' })
        .then(function (r) { if (!r.ok) throw new Error('bridge: HTTP ' + r.status); return r.json(); })
        .then(function (cred) {
          return fetch(API_BASE + '/connectors/auth/login', {
            method: 'POST', credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(cred)
          });
        })
        .then(function (r) { if (!r.ok) throw new Error('login: HTTP ' + r.status); });
      connectorsBridge.catch(function () { connectorsBridge = null; });  // retry next time
      return connectorsBridge;
    }

    function connectorsApi(path, opts) {
      return ensureConnectorsSession().then(function () {
        return fetch(API_BASE + '/connectors' + path, Object.assign({ credentials: 'include' }, opts || {}));
      }).then(function (r) {
        return r.json().then(function (body) {
          if (!r.ok) throw new Error(body && body.detail || ('HTTP ' + r.status));
          return body;
        });
      });
    }

    function loadDbSources() {
      var listEl = document.getElementById('db-source-list');
      if (!listEl) return;
      // The bridged meta endpoint carries updated_at + a credential-free
      // location; fall back to the plain names list if it's unavailable.
      ensureConnectorsSession().then(function () {
        return fetch(API_BASE + '/api/connectors/sources-meta', { credentials: 'include' })
          .then(function (r) { return r.json().then(function (body) { if (!r.ok) throw new Error(body.detail || r.status); return body; }); });
      }).catch(function () { return connectorsApi('/api/sources').then(function (res) {
          return { sources: (res.sources || []).map(function (n) { return { name: n }; }) }; });
      }).then(function (res) {
        if (document.getElementById('db-source-list') !== listEl) return;
        var sources = res.sources || [];
        listEl.innerHTML = '';
        if (!sources.length) {
          listEl.innerHTML = '<div class="placeholder" style="padding:4px 0">No sources yet — click “+ Database”.</div>';
          return;
        }
        sources.forEach(function (src) {
          var name = src.name;
          var row = document.createElement('div');
          row.style.cssText = 'display:flex;align-items:flex-start;gap:6px;padding:6px 8px;' +
            'border:1px solid var(--rail-border);border-radius:8px;cursor:pointer';
          // Same presentation as the dataset cards: bold title, muted meta
          // line underneath (rows×cols · location · date).
          var bits = [];
          if (src.location) bits.push(esc(src.location));
          if (src.updated_at) bits.push(esc(String(src.updated_at).slice(0, 10)));
          var label = document.createElement('span');
          label.style.cssText = 'flex:1;min-width:0;overflow:hidden';
          label.innerHTML =
            '<div class="data-item-title">🗄 ' + esc(name) + '</div>' +
            '<div class="data-item-meta"><span data-dims="1" data-sep="' + (bits.length ? ' · ' : '') + '"></span>' + bits.join(' · ') + '</div>';
          fillDbSourceDims(name, label.querySelector('[data-dims]'));
          var edit = document.createElement('button');
          edit.textContent = '✎';
          edit.title = 'Edit source';
          edit.style.cssText = 'border:none;background:transparent;color:var(--muted);font-size:15px;cursor:pointer;padding:0 2px';
          edit.onclick = function (ev) { ev.stopPropagation(); editDbSource(name); };
          var del = document.createElement('button');
          del.textContent = '×';
          del.title = 'Delete source';
          del.style.cssText = 'border:none;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;padding:0 2px';
          del.onclick = function (ev) {
            ev.stopPropagation();
            if (!window.confirm('Delete database source “' + name + '”?')) return;
            connectorsApi('/api/sources/' + encodeURIComponent(name), { method: 'DELETE' })
              .then(loadDbSources, function (e) { window.alert('Delete failed: ' + e.message); });
          };
          row.appendChild(label);
          row.appendChild(edit);
          row.appendChild(del);
          row.onclick = function () { previewConnectorSource(name); };
          listEl.appendChild(row);
        });
      }, function (err) {
        listEl.innerHTML = '<div class="placeholder" style="padding:4px 0">Database sources unavailable.<br><small>' + esc(err.message) + '</small></div>';
      });
    }

    // Add/edit a database source in a FLOATING dialog (same overlay pattern
    // as "+ Data"), so the form never pushes the source list around.
    function openDbSourceDialog(prefill) {
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;' +
        'align-items:center;justify-content:center;z-index:20000';
      var modal = document.createElement('div');
      modal.style.cssText = 'background:var(--rail-bg,#fff);color:inherit;border-radius:12px;' +
        'padding:20px;width:560px;max-width:92vw;box-shadow:0 12px 48px rgba(0,0,0,.3);' +
        'display:flex;flex-direction:column;gap:10px';
      var FIELD = 'width:100%;box-sizing:border-box;padding:8px;font:inherit;font-size:14px;' +
        'border:1px solid var(--rail-border);border-radius:6px';
      modal.innerHTML =
        '<h3 style="margin:0;font-size:17px">' + (prefill ? 'Edit database source' : 'Add database source') + '</h3>' +
        '<label style="font-size:13px;font-weight:600;text-transform:uppercase;color:var(--muted)">Name' +
          '<input id="db-src-name" placeholder="e.g. my-sales" style="' + FIELD + ';margin-top:4px"></label>' +
        '<label style="font-size:13px;font-weight:600;text-transform:uppercase;color:var(--muted)">Connection URL' +
          '<input id="db-src-url" placeholder="sqlite:///path.db · postgresql+psycopg://user:pw@host/db" style="' + FIELD + ';margin-top:4px"></label>' +
        '<label style="font-size:13px;font-weight:600;text-transform:uppercase;color:var(--muted)">Read-only SQL' +
          '<textarea id="db-src-sql" rows="5" placeholder="SELECT …" style="' + FIELD + ';margin-top:4px;font-family:monospace;font-size:13px;resize:vertical"></textarea></label>' +
        '<div id="db-src-err" style="color:#c0392b;font-size:13px;min-height:16px"></div>' +
        '<div style="display:flex;justify-content:flex-end;gap:8px">' +
          '<button class="cta" id="db-src-cancel" style="padding:6px 14px;background:transparent;border:1px solid var(--rail-border);color:inherit">Cancel</button>' +
          '<button class="cta" id="db-src-save" style="padding:6px 14px">' + (prefill ? 'Save' : 'Add') + '</button>' +
        '</div>';
      overlay.appendChild(modal);
      document.body.appendChild(overlay);
      if (prefill) {
        modal.querySelector('#db-src-name').value = prefill.name || '';
        modal.querySelector('#db-src-url').value = prefill.conn_url || '';
        modal.querySelector('#db-src-sql').value = prefill.sql || '';
      }
      function close() { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }
      overlay.addEventListener('click', function (ev) { if (ev.target === overlay) close(); });
      modal.querySelector('#db-src-cancel').onclick = close;
      modal.querySelector('#db-src-save').onclick = function () {
        var errEl = modal.querySelector('#db-src-err');
        errEl.textContent = '';
        var body = {
          name: modal.querySelector('#db-src-name').value.trim(),
          conn_url: modal.querySelector('#db-src-url').value.trim(),
          sql: modal.querySelector('#db-src-sql').value.trim()
        };
        connectorsApi('/api/sources', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        }).then(function () {
          close();
          delete dbSourceDims[body.name];
          loadDbSources();
          previewConnectorSource(body.name);
        }, function (e) { errEl.textContent = e.message; });
      };
      modal.querySelector('#db-src-name').focus();
    }

    // Edit = fetch the source (owner-only endpoint) and open the dialog
    // prefilled; saving upserts by name (renaming creates a new source).
    function editDbSource(name) {
      fetch(API_BASE + '/api/connectors/source?name=' + encodeURIComponent(name), { credentials: 'include' })
        .then(function (r) { return r.json().then(function (b) { if (!r.ok) throw new Error(b.detail || r.status); return b; }); })
        .then(openDbSourceDialog,
          function (e) { window.alert('Could not load source: ' + e.message); });
    }

    // Dimensions badge for a database source (rows×cols, like the dataset
    // cards). Requires running the query, so results are cached per session.
    var dbSourceDims = {};
    function fillDbSourceDims(name, el) {
      function show(text) {
        // No isConnected guard: the cached path runs synchronously while the
        // row is still being built (attached a moment later) — writing to a
        // momentarily-detached span is harmless, skipping it loses the size.
        if (!el) return;
        el.textContent = text && el.getAttribute('data-paren') ? '(' + text + ')' : text;
      }
      if (dbSourceDims[name]) { show(dbSourceDims[name] + (el && el.getAttribute('data-sep') || '')); return; }
      // (data-paren rows carry no data-sep, so the suffix logic stays inert.)
      connectorsApi('/api/data?source=' + encodeURIComponent(name)).then(function (data) {
        var rows, cols;
        if (Array.isArray(data)) {
          rows = Math.max(0, data.length - 1);
          cols = data[0] ? data[0].length : 0;
        } else {
          var y = data && data.y || {};
          rows = (y.smps || []).length;
          cols = 1 + (y.vars || []).length + Object.keys(data && data.x || {}).length;
        }
        dbSourceDims[name] = Math.max(rows, cols) + '×' + Math.min(rows, cols);
        show(dbSourceDims[name] + (el && el.getAttribute('data-sep') || ''));
      }, function () { show(''); });
    }

    // Drag the splitter between the FILE SOURCES and DATABASE SOURCES cards
    // to trade height between them (the file list scrolls internally).
    function wireDataSplitter() {
      var splitter = document.getElementById('data-splitter');
      var filesCard = document.getElementById('file-sources');
      if (!splitter || !filesCard) return;
      splitter.onpointerdown = function (ev) {
        ev.preventDefault();
        var db = document.getElementById('db-sources');
        var startY = ev.clientY;
        var startH = filesCard.getBoundingClientRect().height;
        // Same clamp AND minimums as the Builder's chat splitter: growth
        // budget = the other card's spare height at drag start; both cards
        // keep >= 250px, and the viewport-pinned column can never overflow.
        var maxH = startH + (db ? db.getBoundingClientRect().height : 0) - 250;
        function move(e) {
          filesCard.style.height = Math.max(250, Math.min(maxH, startH + (e.clientY - startY))) + 'px';
        }
        function up() {
          document.removeEventListener('pointermove', move);
          document.removeEventListener('pointerup', up);
        }
        document.addEventListener('pointermove', move);
        document.addEventListener('pointerup', up);
      };
    }

    function loadDataList(selectId) {

      client.listDatasets().then(function (datasets) {

            }, 'border:none;background:transparent;padding:0 2px');

    // Turn a fetch failure into an actionable hint. A 404 on the LIST endpoint
    // means /api/datasets isn't on the server we hit (wrong origin, or a stale
    // server started before the dataset routes existed); 401 means not logged in;
    // no status usually means the server is down / blocked by CORS.
    function datasetErrorHint(err) {
      var status = err && err.status;
      if (status === 404) {
        return 'No /api/datasets on ' + (API_BASE || location.origin) + '. ' +
          'Serve builder.html from cxd_server, pass ?api=<server-url>, or restart a stale server.';
      }
      if (status === 401) return 'Not logged in — sign in to the cxd_server first.';
      if (status == null) return 'Couldn’t reach the cxd_server — is it running (and CORS-allowed)?';
      return 'Couldn’t load datasets (HTTP ' + status + ').';
    }

    function previewDataset(d) {
      var titleEl = document.getElementById('data-title');
      var host = document.getElementById('data-canvas-host');
      if (!host) return;
      if (titleEl) titleEl.textContent = (d.title || d.id) + (d.store ? '  ·  ' + d.store : '');
      destroyDataPreview();
      host.innerHTML = '<div class="placeholder">Loading…</div>';
      client.getDataset(d.id, { store: d.store, owner: d.shared ? d.owner : undefined }).then(function (data) {
        host.innerHTML = '';
        requestAnimationFrame(function () {
          if (document.getElementById('data-title') == null) return;  // navigated away
          // Per-render measurement was returning different values (so each table
          // rendered at a different size). Measure the pane ONCE and reuse that
          // width for every dataset, so all previews are identically sized.
          var measured = host.clientWidth || 0;
          if (measured > 320) previewWidth = measured;   // cache the first good width
          var width = Math.max(320, previewWidth || measured || 640);
          var height = Math.max(460, host.clientHeight || 0);
          var canvas = document.createElement('canvas');
          canvas.id = 'data-preview-' + String(d.id).replace(/[^A-Za-z0-9_-]/g, '_');
          // Buffer + display box both pinned to the shared width (buffer defaults
          // to 500×500 otherwise).
          canvas.setAttribute('width', width);
          canvas.setAttribute('height', height);
          canvas.style.width = width + 'px';
          canvas.style.height = height + 'px';
          host.appendChild(canvas);
          // view:'table' renders the data as a scrollable grid — same as the
          // dashboard's "table" control; resizable:false pins it to the canvas.
          // When a dataset is stored wider than tall, transpose the table so
          // the larger dimension always runs down the rows (tall beats wide).
          // Tabular 2D arrays are already row-oriented; only pre-shaped
          // {y} objects may need the display transpose.
          var wideways = false;
          if (!Array.isArray(data)) {
            var y = data && data.y ? data.y : {};
            wideways = (y.vars || []).length > (y.smps || []).length;
          }
          dataPreviewInstance = new window.CanvasXpress(canvas.id, data,
            { view: 'table', title: d.title || d.id, resizable: false,
              transposeData: wideways }, {});
        });
      }, function (err) {
        host.innerHTML = '<div class="placeholder">Couldn’t load “' + esc(d.id) + '”.' +
          '<br><small>' + esc(err && err.message || err) + '</small></div>';
      });
    }

    function esc(v) {
      return String(v == null ? '' : v).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }

    // ---- governance: sharing with people/groups and dataset security ----------
    // The server enforces every rule; these panels only edit grants and policies.
    var directoryCache = null;
    function loadDirectory() {
      if (!directoryCache) {
        directoryCache = client.directory().catch(function () { directoryCache = null; return { users: [], groups: [] }; });
      }
      return directoryCache;
    }
    function hasPerm(permission) { return isAdmin || currentPermissions.indexOf(permission) !== -1; }
    function principalLabel(p) {
      if (p === '*') return 'Everyone signed in';
      if (p === 'anonymous') return 'Share-link viewers (not signed in)';
      if (p.indexOf('group:') === 0) return '👥 ' + p.slice(6);
      if (p.indexOf('user:') === 0) return '👤 ' + p.slice(5);
      return p;
    }
    // A <select> of principals: users, groups, everyone (and optionally anonymous).
    function principalSelect(dir, opts) {
      opts = opts || {};
      var sel = document.createElement('select');
      sel.style.cssText = 'font-size:14px;padding:3px 4px;max-width:220px';
      var add = function (value, label) {
        var o = document.createElement('option'); o.value = value; o.textContent = label; sel.appendChild(o);
      };
      if (opts.placeholder) add('', opts.placeholder);
      (dir.groups || []).forEach(function (g) { add('group:' + g, principalLabel('group:' + g)); });
      (dir.users || []).forEach(function (u) {
        if (u !== opts.exclude) add('user:' + u, principalLabel('user:' + u));
      });
      add('*', principalLabel('*'));
      if (opts.anonymous) add('anonymous', principalLabel('anonymous'));
      if (opts.value != null) sel.value = opts.value;
      return sel;
    }
    function smallButton(text, onclick, extra) {
      var b = document.createElement('button');
      b.textContent = text;
      b.style.cssText = 'font-size:14px;padding:3px 10px;cursor:pointer;' + (extra || '');
      b.onclick = function (e) { e.stopPropagation(); onclick(e); };

    // A simple modal; returns its body element. Esc or the ✕ closes it.
    function openModal(title, onClose) {
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:2147483647;display:flex;align-items:flex-start;justify-content:center;padding-top:8vh';
      var card = document.createElement('div');
      card.style.cssText = 'background:var(--rail-bg,#fff);color:inherit;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.25);width:min(720px,92vw);max-height:80vh;display:flex;flex-direction:column';
      var head = document.createElement('div');
      head.style.cssText = 'display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--rail-border)';
      head.innerHTML = '<div style="font-weight:700;font-size:17px;flex:1">' + esc(title) + '</div>';
      var body = document.createElement('div');
      body.style.cssText = 'padding:14px 16px;overflow:auto;font-size:15px';
      function close() {
        document.removeEventListener('keydown', onKey);
        if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
        if (onClose) onClose();
      }
      function onKey(e) { if (e.key === 'Escape') close(); }
      head.appendChild(smallButton('✕', close, 'border:none;background:transparent;font-size:18px'));
      card.appendChild(head); card.appendChild(body); overlay.appendChild(card);
      overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
      document.addEventListener('keydown', onKey);
      document.body.appendChild(overlay);
      body.close = close;
      return body;
    }

    // "People" panel: who a dashboard/dataset is shared with, and at what level.
    // res = {kind: 'dashboard'|'dataset', id, title, store?, owner?}
    function showPeople(res, onChanged) {
      var body = openModal('Share “' + (res.title || res.id) + '” with people and groups', onChanged);
      var opts = { store: res.store, owner: res.owner !== currentUser ? res.owner : undefined };
      var levels = res.kind === 'dataset' ? ['view'] : ['view', 'edit'];
      function levelSelect(value) {

        });

        return sel;

          '<p style="margin:0 0 10px;color:var(--muted);font-size:14px">' +
          (res.kind === 'dashboard'

            : 'People you share with see it under Data, subject to its security policy.') + '</p>';
        var err = document.createElement('div');
        err.style.cssText = 'color:#d64545;min-height:18px;font-size:14px';
        var list = document.createElement('div');
        function apply(principal, level) {
          err.textContent = '';
          client.setGrant(res.kind, res.id, principal, level, opts).then(function (g) { draw(g, dir); },
            function (e) { err.textContent = e.message; });
        }
        if (!grants.length) list.innerHTML = '<div class="placeholder" style="padding:6px 0">Only you (and admins) can open it.</div>';
        grants.forEach(function (g) {

          row.innerHTML = '<div style="flex:1">' + esc(principalLabel(g.principal)) + '</div>';

          row.appendChild(smallButton('Remove', function () { apply(g.principal, null); }));
          list.appendChild(row);
        });
        var addRow = document.createElement('div');

        }, 'background:var(--accent);color:#fff;border:none;border-radius:6px'));

      }
      body.textContent = 'Loading…';
      Promise.all([client.grants(res.kind, res.id, opts), loadDirectory()]).then(function (r) { draw(r[0], r[1]); },
        function (e) { body.textContent = 'Could not load sharing: ' + e.message; });

    // The column names a dataset exposes (2D table header, or CX vars + annotations).
    function datasetColumns(data) {
      if (Array.isArray(data) && Array.isArray(data[0])) return data[0].map(String);
      var cols = [];
      if (data && data.y && data.y.vars) cols = cols.concat(data.y.vars);
      if (data && data.x) cols = cols.concat(Object.keys(data.x));
      if (data && data.z) cols = cols.concat(Object.keys(data.z));
      return cols;
    }

    // The schedule editor (a modal). sc = an existing schedule, or {kind, config?} for a new one.

      // ---- when (preset → cron) ----

      var parts = cron.split(' ');

      else if (/^\d+ \d+ \* \* 1-5$/.test(cron)) presetValue = 'weekdays';

      var preset = select(WHEN_PRESETS, presetValue);

      var day = select([['1', 'Monday'], ['2', 'Tuesday'], ['3', 'Wednesday'], ['4', 'Thursday'], ['5', 'Friday'], ['6', 'Saturday'], ['0', 'Sunday']],

    var FEATURED_DASHBOARD_POSITIONS = { 'cohort-explorer': 2, 'dose-response-lab': 4, 'sandbox': 5 };

    /**
     * Move the featured dashboards to their fixed list positions.
     * @param {object[]} rows - Dashboard summaries in server order.
     * @param {object} positions - id -> 1-based position.
     * @returns {object[]} The reordered rows (a new array).
     */
    function placeFeatured(rows, positions) {
      var rest = rows.filter(function (d) { return !Object.prototype.hasOwnProperty.call(positions, d.id); });
      var pinned = rows.filter(function (d) { return Object.prototype.hasOwnProperty.call(positions, d.id); })
        .sort(function (a, b) { return positions[a.id] - positions[b.id]; });
      pinned.forEach(function (d) {
        rest.splice(Math.min(positions[d.id] - 1, rest.length), 0, d);
      });
      return rest;
