<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CanvasXpress Dashboards — no-code builder</title>

  <!--CX-LIB-START · scripts/build.mjs swaps this whole block for the served app
       shell (CDN CanvasXpress + same-origin bundle). During development you can
       point these URLs at a local CanvasXpress build; keep the START/END markers
       so the build transform still finds the block. -->
  <link href="https://www.canvasxpress.org/dist/canvasXpress.css" rel="stylesheet" />
  <script src="https://www.canvasxpress.org/dist/canvasXpress.min.js"></script>
  <!-- Cache-bust the local bundle so edits show up on a plain reload (dev convenience). -->
  <script>document.write('<script src="../dist/canvasxpress-dashboards.umd.js?v=' + Date.now() + '"><\/script>');</script>
  <!--CX-LIB-END-->

  <style>
    :root { --rail-bg: #ffffff; --rail-border: #e6e9ee; --muted: #6b7280; --accent: #087ad1; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f2f4f7; color: #222; }

    .app { display: flex; min-height: 100vh; }

    /* Left icon nav rail (Databox-style) */
    .rail { flex: 0 0 220px; width: 220px; background: var(--rail-bg);
      border-right: 1px solid var(--rail-border); display: flex; flex-direction: column;
      padding: 14px 10px; position: sticky; top: 0; height: 100vh; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 16px; }
    .brand img { width: 28px; height: 28px; }
    .brand span { font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
    .rail nav { display: flex; flex-direction: column; gap: 2px; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 8px;
      color: #444; font-size: 14px; cursor: pointer; text-decoration: none; }
    .nav-item .ic { width: 20px; text-align: center; font-size: 16px; }
    .nav-item:hover { background: #f4f6f8; }
    .nav-item.active { background: #eaf3fb; color: var(--accent); font-weight: 600; }
    .rail-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px 8px;
      border-top: 1px solid var(--rail-border); color: var(--muted); font-size: 13px; }
    .rail-foot .avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--accent);
      color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }

    /* Main content */
    .content { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
    .topstrip { display: flex; align-items: center; gap: 12px; padding: 10px 20px; min-height: 56px;
      border-bottom: 1px solid var(--rail-border); background: #fff; }
    .toolbar-host { width: 100%; }
    .view-title { margin: 0; font-size: 16px; font-weight: 600; }
    .view { padding: 16px 20px 32px; }

    /* Home view */
    .hero { background: linear-gradient(120deg, #eaf3fb, #f4f7fb); border-radius: 12px;
      padding: 28px; margin-bottom: 20px; }
    .hero h1 { margin: 0 0 6px; font-size: 22px; }
    .hero p { margin: 0 0 16px; color: var(--muted); }
    .cta { padding: 10px 18px; background: var(--accent); color: #fff; border: none;
      border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .cta:hover { background: #065fa3; }
    .notices { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
    .notice { display: flex; gap: 12px; background: #fff; border: 1px solid var(--rail-border);
      border-radius: 10px; padding: 16px; }
    .notice .ni { font-size: 22px; line-height: 1; }
    .notice h3 { margin: 0 0 4px; font-size: 14px; }
    .notice p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.4; }
    .placeholder { padding: 60px 20px; text-align: center; color: var(--muted); }

    /* Settings view */
    .settings { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
    .settings-form { flex: 0 0 300px; background: #fff; border: 1px solid var(--rail-border);
      border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .settings-form h3 { margin: 0 0 4px; font-size: 15px; }
    .settings-form label { display: flex; flex-direction: column; gap: 4px; font-size: 11px;
      font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
    .settings-form input, .settings-form select { padding: 6px 8px; border: 1px solid var(--rail-border);
      border-radius: 6px; font: inherit; font-weight: 400; text-transform: none; color: inherit; background: #fff; }
    .settings-form input[type=color] { padding: 2px; height: 34px; }
    .settings-preview { flex: 1 1 380px; min-width: 320px; }
    .settings-preview #s-preview { border: 1px dashed var(--rail-border); border-radius: 10px; padding: 10px; }
    @media (prefers-color-scheme: dark) {
      .settings-form { background: #16181d; }
      .settings-form input, .settings-form select { background: #1d2027; }
    }

    /* Data view: dataset list + CanvasXpress table preview */
    .data-view { display: flex; gap: 16px; align-items: stretch; }
    .data-list { flex: 0 0 260px; width: 260px; align-self: flex-start; background: #fff;
      border: 1px solid var(--rail-border); border-radius: 10px; overflow: hidden; }
    .data-item { padding: 10px 12px; border-bottom: 1px solid var(--rail-border); cursor: pointer; }
    .data-item:last-child { border-bottom: none; }
    .data-item:hover { background: #f4f6f8; }
    .data-item.active { background: #eaf3fb; box-shadow: inset 3px 0 0 var(--accent); }
    .data-item-title { font-weight: 600; font-size: 14px; }
    .data-item-meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .data-preview { flex: 1 1 auto; min-width: 320px; background: #fff;
      border: 1px solid var(--rail-border); border-radius: 10px; padding: 12px; }
    .data-preview-title { font-weight: 600; margin-bottom: 10px; color: #333; }
    #data-canvas-host { height: 460px; overflow: hidden; }
    .data-preview.drop-active { outline: 2px dashed var(--accent); outline-offset: -6px;
      background: rgba(8,122,209,0.05); }
    @media (prefers-color-scheme: dark) {
      .data-list, .data-preview { background: #16181d; }
      .data-item:hover { background: #1d2027; }
      .data-item.active { background: #12283a; }
      .data-preview-title { color: #e6e8ec; }
    }

    @media (prefers-color-scheme: dark) {
      :root { --rail-bg: #16181d; --rail-border: #2c313a; --muted: #8a9099; }
      body { background: #0e1013; color: #e6e8ec; }
      .topstrip { background: #16181d; }
      .nav-item { color: #c9ccd1; }
      .nav-item:hover { background: #1d2027; }
      .nav-item.active { background: #12283a; }
      .hero { background: linear-gradient(120deg, #12283a, #1a1d24); }
      .notice { background: #16181d; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="brand">
        <img src="https://www.canvasxpress.org/favicon.png" alt="CanvasXpress" />
        <span>CanvasXpress</span>
      </div>
      <nav>
        <a class="nav-item active" data-view="Home"><span class="ic">🏠</span> Home</a>
        <a class="nav-item" data-view="Builder"><span class="ic">🧩</span> Builder</a>
        <a class="nav-item" data-view="Dashboards"><span class="ic">📊</span> Dashboards</a>
        <a class="nav-item" data-view="Data"><span class="ic">🗂️</span> Data</a>
        <a class="nav-item" data-view="Settings"><span class="ic">⚙️</span> Settings</a>
        <a class="nav-item" data-view="Admin" id="nav-admin" style="display:none"><span class="ic">🛡️</span> Admin</a>
      </nav>
      <div class="rail-foot" id="rail-foot">
        <span class="avatar" id="rail-avatar">?</span>
        <span id="rail-user" style="flex:1">Signed out</span>
        <a id="rail-auth" href="#" style="font-size:12px;color:var(--muted);text-decoration:none">Sign in</a>
      </div>
    </aside>

    <main class="content">
      <div class="topstrip">
        <div id="toolbar" class="toolbar-host"></div>
      </div>
      <div id="view" class="view"></div>
    </main>
  </div>

  <script>
    // A persistence client is optional: if the cxd_server isn't running on this
    // origin, Save will just report an error and everything else still works.
    //
    // The API base defaults to this page's own origin. If you serve builder.html
    // from a DIFFERENT origin than cxd_server (e.g. VS Code Live Server, or
    // `python -m http.server`, or file://), point it at the server explicitly
    // with `?api=` — e.g. builder.html?api=http://localhost:8000 — otherwise
    // /api/* requests hit the static server and 404.
    var API_BASE = new URLSearchParams(location.search).get('api') || '';
    var client = CanvasXpressDashboards.createDashboardClient({ baseUrl: API_BASE });

    var CXD = CanvasXpressDashboards;

    // The working dashboard, shared across views (Builder edits it, Settings
    // tweaks its presentation). It starts EMPTY — no panels — so the Builder
    // opens as a blank canvas. The server-side datasets the Data view lists
    // (seeded by examples/serve.py) are pre-declared as data sources so that
    // clicking "+ Panel" immediately binds to a real dataset; nothing is drawn
    // until the user adds a panel.
    function seedSpec() {
      var s = CXD.blankSpec('my-dashboard', 'My Dashboard');
      s = CXD.setDataSource(s, 'sales', { kind: 'dataset', id: 'regional-sales', store: 'local' });
      s = CXD.setDataSource(s, 'weather', { kind: 'dataset', id: 'weather-sample', store: 'local' });
      return s;
    }
    var currentSpec = seedSpec();

    // --- app shell: left-rail views drive the toolbar + canvas ---
    var toolbarEl = document.getElementById('toolbar');
    var viewEl = document.getElementById('view');
    var navItems = [].slice.call(document.querySelectorAll('.nav-item'));
    var currentBuilder = null;
    var currentPreview = null;

    function teardown() {
      if (currentBuilder) {
        // Capture the builder's latest spec (folds in live ⚙-customizer edits)
        // before destroying it, so other views see the current state.
        try { currentSpec = currentBuilder.getSpec(); } catch (e) {}
        try { currentBuilder.destroy(); } catch (e) {}
        currentBuilder = null;
      }
      if (currentPreview) { try { currentPreview.then(function (h) { if (h && h.destroy) h.destroy(); }); } catch (e) {} currentPreview = null; }
      destroyDataPreview();
      toolbarEl.innerHTML = '';
      toolbarEl.className = 'toolbar-host';   // strip any builder toolbar classes
      viewEl.innerHTML = '';
    }

    function notice(icon, title, bodyHtml) {
      return '<div class="notice"><div class="ni">' + icon + '</div><div><h3>' + title +
             '</h3><p>' + bodyHtml + '</p></div></div>';
    }

    function showHome() {
      teardown();
      toolbarEl.innerHTML = '<h2 class="view-title">Home</h2>';
      viewEl.innerHTML =
        '<div class="hero">' +
          '<h1>Welcome to CanvasXpress Dashboards</h1>' +
          '<p>Compose, coordinate, and share live dashboards — powered by CanvasXpress.</p>' +
          '<button class="cta" id="home-create">+ Create a dashboard</button>' +
        '</div>' +
        '<div class="notices">' +
          notice('📣', 'What’s new', 'Every panel opens the native CanvasXpress customizer — click the ⚙ on a panel to change chart type, colors, grouping and more.') +
          notice('🔌', 'Live data', 'Bind panels to databases &amp; Google Sheets through canvasxpress-connectors.') +
          notice('🔗', 'Sharing', 'Publish read-only share links straight from the Builder.') +
        '</div>';
      var create = document.getElementById('home-create');
      if (create) create.onclick = function () { activate('Builder'); };
    }

    function showBuilder() {
      teardown();
      // Reaching here means activate() already ensured a session (Builder is a
      // PROTECTED view), so Save/Share have a valid cookie — no 401.
      // The builder renders its actions into the app toolbar and its canvas in the
      // view; onChange keeps currentSpec in sync so Settings sees the latest.
      currentBuilder = CXD.createBuilder(viewEl, {
        toolbar: toolbarEl,
        spec: currentSpec,
        client: client,
        baseUrl: API_BASE,
        // Datasets are added/managed in the Data view; panels bind to them via
        // the per-panel Data dropdown — so hide the toolbar's "+ Data" button.
        showAddData: false,
        onChange: function (spec) { currentSpec = spec; }
      });
      window.builder = currentBuilder;
    }

    // --- Data view: browse stored datasets, preview one as a CanvasXpress table ---
    var dataPreviewInstance = null;
    var previewWidth = 0;   // measured once, reused so every dataset table is the same size
    var selectedDatasetId = null;   // keeps the selected dataset across list refreshes
    // The demo's seeded datasets (examples/serve.py) are read-only — not deletable.
    var SAMPLE_IDS = { 'regional-sales': 1, 'weather-sample': 1, penguins: 1,
      gapminder: 1, superstore: 1, diamonds: 1 };
    function destroyDataPreview() {
      if (dataPreviewInstance) { try { dataPreviewInstance.destroy(); } catch (e) {} dataPreviewInstance = null; }
    }

    function showData() {
      teardown();
      toolbarEl.innerHTML =
        '<div style="display:flex;align-items:center;gap:8px;width:100%">' +
          '<h2 class="view-title">Data</h2>' +
          '<button class="cta" id="data-add" style="margin-left:auto;padding:6px 14px;font-size:13px">+ Data</button>' +
          '<button class="cta" id="data-refresh" style="padding:6px 14px;font-size:13px;background:transparent;border:1px solid var(--rail-border);color:inherit">Refresh</button>' +
        '</div>';
      viewEl.innerHTML =
        '<div class="data-view">' +
          '<div class="data-list" id="data-list"><div class="placeholder">Loading…</div></div>' +
          '<div class="data-preview" id="data-preview">' +
            '<div class="data-preview-title" id="data-title">Select a dataset to preview it — or drop a CSV / TSV / CanvasXpress JSON file here to import.</div>' +
            '<div id="data-canvas-host"></div>' +
          '</div>' +
        '</div>';
      setupDropZone(document.getElementById('data-preview'));
      var refresh = document.getElementById('data-refresh');
      if (refresh) refresh.onclick = loadDataList;
      // "+ Data" now lives here (moved out of the Builder toolbar). It opens the
      // full "add data" dialog — upload a file, paste CSV/JSON, or import from an
      // external URL / connector — importing the result into the store, where it
      // shows up in the list and is usable from the Builder's Data dropdown.
      var addBtn = document.getElementById('data-add');
      if (addBtn) addBtn.onclick = openAddDataDialog;
      loadDataList();
    }

    // Dialog to import a dataset into the store from a file, pasted text, or an
    // external URL / connector (restores the old "+ Data" dialog capabilities).
    function openAddDataDialog() {
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;' +
        'align-items:center;justify-content:center;z-index:1000';
      var modal = document.createElement('div');
      modal.style.cssText = 'background:var(--rail-bg,#fff);color:inherit;border-radius:12px;' +
        'padding:20px;width:520px;max-width:92vw;box-shadow:0 12px 48px rgba(0,0,0,.3)';
      modal.innerHTML =
        '<h3 style="margin:0 0 12px">Add data</h3>' +
        '<div id="ad-err" style="color:#d64545;min-height:16px;font-size:13px;margin-bottom:4px"></div>' +
        '<label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);margin:4px 0 2px">Name</label>' +
        '<input id="ad-name" style="width:100%;padding:8px;box-sizing:border-box" placeholder="e.g. my-data"/>' +
        '<label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);margin:12px 0 2px">Source</label>' +
        '<select id="ad-type" style="width:100%;padding:8px;box-sizing:border-box">' +
          '<option value="file">Upload CSV / JSON file</option>' +
          '<option value="csv">Paste CSV</option>' +
          '<option value="url">External URL / connector</option>' +
        '</select>' +
        '<div id="ad-body" style="margin-top:10px"></div>' +
        '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">' +
          '<button class="cta" id="ad-cancel" style="background:transparent;border:1px solid var(--rail-border);color:inherit">Cancel</button>' +
          '<button class="cta" id="ad-add">Add</button>' +
        '</div>';
      document.body.appendChild(overlay);
      overlay.appendChild(modal);

      var nameEl = modal.querySelector('#ad-name');
      var typeEl = modal.querySelector('#ad-type');
      var bodyEl = modal.querySelector('#ad-body');
      var errEl = modal.querySelector('#ad-err');
      var addEl = modal.querySelector('#ad-add');
      function fail(m) { errEl.textContent = m; addEl.disabled = false; addEl.textContent = 'Add'; }
      function close() { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }

      var INPUT = 'width:100%;padding:8px;box-sizing:border-box';
      var AREA = INPUT + ';min-height:120px;font-family:monospace;font-size:12px';
      var bodies = {
        file: '<input id="ad-file" type="file" accept=".csv,.json,application/json,text/csv" style="' + INPUT + '">',
        csv:  '<textarea id="ad-text" placeholder="Region,Q1\nNorth,10\nSouth,20" style="' + AREA + '"></textarea>',
        url:  '<input id="ad-url" type="text" placeholder="https://host/api/data?source=… (sent with your session cookie)" style="' + INPUT + '">'
      };
      function showBody() { bodyEl.innerHTML = bodies[typeEl.value]; }
      typeEl.onchange = showBody; showBody();

      modal.querySelector('#ad-cancel').onclick = close;
      overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });

      addEl.onclick = function () {
        var name = (nameEl.value || '').trim();
        var type = typeEl.value;
        errEl.textContent = ''; addEl.disabled = true; addEl.textContent = 'Adding…';
        var done = function (summary) {
          close(); loadDataList();
          if (summary && summary.id) previewDataset(summary);
        };
        if (type === 'file') {
          var f = modal.querySelector('#ad-file').files[0];
          if (!f) return fail('Choose a file');
          client.uploadDataset(f, { title: name || f.name.replace(/\.[^.]+$/, '') }).then(done, function (e) { fail('Upload failed: ' + (e && e.message || e)); });
        } else if (type === 'csv' || type === 'json') {
          var text = modal.querySelector('#ad-text').value;
          if (!text.trim()) return fail('Paste some data');
          client.uploadDataset(text, { format: type, title: name || 'dataset' }).then(done, function (e) { fail('Import failed: ' + (e && e.message || e)); });
        } else {
          var url = (modal.querySelector('#ad-url').value || '').trim();
          if (!url) return fail('Enter a URL');
          // Fetch the external/connector source (credentialed) and snapshot it
          // into the store as a dataset.
          fetch(url, { credentials: 'include' }).then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
          }).then(function (data) {
            return client.uploadDataset(data, { format: 'json', title: name || 'imported' });
          }).then(done, function (e) { fail('Couldn’t import from URL: ' + (e && e.message || e)); });
        }
      };
      if (typeof nameEl.focus === 'function') nameEl.focus();
    }

    // Make a container a drop target: dropping a valid CanvasXpress input
    // (CSV / TSV / CanvasXpress JSON) imports it into the store and previews it.
    function setupDropZone(pane) {
      if (!pane) return;
      function stop(e) { e.preventDefault(); e.stopPropagation(); }
      // Capture phase so we intercept before any CanvasXpress canvas handler.
      pane.addEventListener('dragenter', function (e) { stop(e); pane.classList.add('drop-active'); }, true);
      pane.addEventListener('dragover', function (e) {
        stop(e); if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy'; pane.classList.add('drop-active');
      }, true);
      pane.addEventListener('dragleave', function (e) {
        stop(e); if (!pane.contains(e.relatedTarget)) pane.classList.remove('drop-active');
      }, true);
      pane.addEventListener('drop', function (e) {
        stop(e); pane.classList.remove('drop-active');
        var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (!f) return;
        // Prefer CanvasXpress's own loader (it reads CSV/TSV/JSON/PNG/… and
        // updates the live table); fall back to a direct upload only when there's
        // no table instance yet (empty store).
        if (dataPreviewInstance && typeof dataPreviewInstance.loadFile === 'function') {
          loadDroppedFileViaCanvasXpress(e.dataTransfer, f);
        } else {
          importDataFile(f);
        }
      }, true);
    }

    // Hand a dropped file to CanvasXpress: it parses + updates the visible table,
    // then its callback gives us the loaded data, which we persist to the store
    // and re-preview cleanly from there.
    function loadDroppedFileViaCanvasXpress(dataTransfer, file) {
      var titleEl = document.getElementById('data-title');
      if (titleEl) titleEl.textContent = 'Reading “' + (file.name || 'file') + '” …';
      var title = (file.name || 'dataset').replace(/\.[^.]+$/, '');
      // Read the file's own config first (a CanvasXpress JSON is {data, config});
      // a File stays valid across the async read, so it's passed to loadFile below.
      readFileConfig(file, function (fileConfig) {
        // loadFile(event, isFlag, callback, providedFile, asTable): asTable forces
        // a table view; the callback receives the new instance.
        dataPreviewInstance.loadFile(dataTransfer, false, function (newInstance) {
          dataPreviewInstance = newInstance;   // track for cleanup on the next preview
          var data = newInstance && newInstance.data;
          if (!data || !data.y) {
            if (titleEl) titleEl.textContent = 'That file isn’t a dataset CanvasXpress can load.';
            return;
          }
          // Associate any graph config the file carried (a CanvasXpress JSON's
          // graphType/etc.) so panels bound to this dataset adopt it as their
          // first state. Prefer the file's config; else the parsed instance's.
          var config = fileConfig ||
            cleanConfig(typeof newInstance.getConfig === 'function' ? newInstance.getConfig() : null);
          var opts = { format: 'cx', title: title };
          if (config && Object.keys(config).length) opts.config = config;
          client.uploadDataset({ y: data.y, x: data.x }, opts).then(function (summary) {
            loadDataList(summary && summary.id);   // list + select + clean re-render
          }, function (err) {
            window.alert('Loaded into the table but couldn’t store it: ' + (err && err.message || err));
          });
        }, file, true);
      });
    }

    // Read a dropped CanvasXpress JSON's own `config` ({data, config}); non-JSON
    // files resolve to null (their config, if any, comes from the parsed instance).
    function readFileConfig(file, doneCb) {
      var name = (file.name || '').toLowerCase();
      var looksJson = /\.(json|cx)$/.test(name) || (file.type || '').indexOf('json') >= 0;
      if (!looksJson || typeof FileReader === 'undefined') { doneCb(null); return; }
      var reader = new FileReader();
      reader.onload = function () {
        var cfg = null;
        try {
          var obj = JSON.parse(reader.result);
          if (obj && obj.config && typeof obj.config === 'object') cfg = cleanConfig(obj.config);
        } catch (e) { cfg = null; }
        doneCb(cfg);
      };
      reader.onerror = function () { doneCb(null); };
      reader.readAsText(file);
    }

    // Drop config values carrying CanvasXpress's internal "__FACTOR__" sentinel
    // (derived grouping state that breaks a re-render with fresh data).
    function cleanConfig(config) {
      if (!config || typeof config !== 'object') return null;
      var out = {};
      Object.keys(config).forEach(function (k) {
        try {
          if (JSON.stringify(config[k]).indexOf('__FACTOR__') < 0) out[k] = config[k];
        } catch (e) { /* skip unserializable */ }
      });
      return out;
    }

    // Convert tab-delimited text to CSV (quoting cells with commas/quotes).
    function tsvToCsv(text) {
      return text.split(/\r?\n/).map(function (line) {
        return line.split('\t').map(function (c) {
          return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c;
        }).join(',');
      }).join('\n');
    }

    // Import a dropped file into the store, detecting the format from its
    // extension (falling back to content sniffing), then refresh + preview it.
    function importDataFile(file) {
      var name = (file.name || '').toLowerCase();
      var title = (file.name || 'dataset').replace(/\.[^.]+$/, '');
      var titleEl = document.getElementById('data-title');
      if (titleEl) titleEl.textContent = 'Importing “' + (file.name || 'dataset') + '” …';
      function done(summary) { loadDataList(); if (summary && summary.id) previewDataset(summary); }
      function failMsg(e) {
        window.alert('Import failed: ' + (e && e.message || e));
        if (titleEl) titleEl.textContent = 'Select a dataset to preview it — or drop a file here to import.';
      }

      if (/\.png$/.test(name)) {
        return failMsg(new Error('PNG import isn’t supported here yet — use CSV, TSV, or CanvasXpress JSON.'));
      }
      if (/\.csv$/.test(name)) {
        return client.uploadDataset(file, { format: 'csv', title: title }).then(done, failMsg);
      }
      if (/\.(tsv|tab)$/.test(name)) {
        return file.text().then(function (t) {
          return client.uploadDataset(tsvToCsv(t), { format: 'csv', title: title });
        }).then(done, failMsg);
      }
      if (/\.(json|cx)$/.test(name)) {
        return client.uploadDataset(file, { format: 'json', title: title }).then(done, failMsg);
      }
      // Unknown/no extension → sniff the content.
      file.text().then(function (t) {
        var s = t.replace(/^\uFEFF/, '').trim();
        if (s.charAt(0) === '{' || s.charAt(0) === '[') {
          return client.uploadDataset(t, { format: 'json', title: title });
        }
        var firstLine = s.split(/\r?\n/)[0] || '';
        if (firstLine.indexOf('\t') >= 0 && firstLine.indexOf(',') < 0) {
          return client.uploadDataset(tsvToCsv(t), { format: 'csv', title: title });
        }
        return client.uploadDataset(t, { format: 'csv', title: title });
      }).then(done, failMsg);
    }

    // ---- authentication -------------------------------------------------------
    // The dashboard/dataset APIs are per-user (session cookie). currentUser holds
    // the signed-in username (null when signed out) and drives the footer + guards.
    var currentUser = null;
    var isAdmin = false;
    var DEMO_USER = 'demo', DEMO_PASS = 'demo1234';

    // Sync the sidebar footer + admin nav to the current auth state.
    function renderUserChip() {
      var avatar = document.getElementById('rail-avatar');
      var label = document.getElementById('rail-user');
      var link = document.getElementById('rail-auth');
      var adminNav = document.getElementById('nav-admin');
      if (currentUser) {
        avatar.textContent = currentUser.slice(0, 2).toUpperCase();
        label.textContent = currentUser;
        link.textContent = 'Sign out';
      } else {
        avatar.textContent = '?';
        label.textContent = 'Signed out';
        link.textContent = 'Sign in';
      }
      // The Admin view is only reachable when the server marks you an admin
      // (CXD_ADMINS). Hiding the nav is cosmetic — the API enforces it too.
      if (adminNav) adminNav.style.display = isAdmin ? '' : 'none';
    }

    // Ask the server who we are and reflect it in the UI. Safe with no server.
    function refreshUser() {
      return client.me().then(function (r) {
        currentUser = (r && r.user) || null;
        isAdmin = !!(r && r.is_admin);
        renderUserChip();
        return currentUser;
      }, function () { currentUser = null; isAdmin = false; renderUserChip(); return null; });
    }

    function doLogout() {
      client.logout().catch(function () {}).then(function () {
        currentUser = null; isAdmin = false; renderUserChip(); activate('Home');
      });
    }

    // The Login view: sign in, create an account, or one-click demo login. The

          '<input id="login-user" placeholder="Username" autocomplete="username" ' +
            'style="width:100%;padding:9px;margin:4px 0;box-sizing:border-box"/>' +
          '<input id="login-pass" type="password" placeholder="Password" autocomplete="current-password" ' +

      var userEl = document.getElementById('login-user');

        pendingView = null;

      function afterAuth(promise) {
        errEl.textContent = '';
        return promise.then(function (r) {

    // The Admin view: list users, create accounts, reset passwords, delete users.
    // Admin-only (gated client-side by isAdmin and server-side by CXD_ADMINS).
    function showAdmin() {
      teardown();
      toolbarEl.innerHTML = '<h2 class="view-title">Admin · Users</h2>';
      viewEl.innerHTML =
        '<div class="settings">' +
          '<div class="settings-form" style="flex:0 0 280px">' +
            '<h3>Create user</h3>' +
            '<div id="admin-err" style="color:#d64545;min-height:16px;font-size:13px"></div>' +
            '<label>Username<input id="admin-new-user" autocomplete="off"/></label>' +
            '<label>Password<input id="admin-new-pass" type="text" autocomplete="off"/></label>' +
            '<button class="cta" id="admin-create">Create user</button>' +
          '</div>' +
          '<div class="settings-preview" style="flex:1 1 420px">' +
            '<div class="data-list" style="width:auto"><div id="admin-users">' +
              '<div class="placeholder">Loading…</div>' +
            '</div></div>' +
          '</div>' +
        '</div>';

      var errEl = document.getElementById('admin-err');
      function fail(err) { errEl.textContent = (err && err.message) || String(err); }

      function renderUsers(users) {
        var host = document.getElementById('admin-users');
        if (!host) return;

            '</div>';

            if (!pw) return;
            errEl.textContent = '';
            client.setUserPassword(u.username, pw).then(function () {
              errEl.style.color = '#2e7d32'; errEl.textContent = 'Password reset for ' + u.username + '.';
            }, fail);
          };
          row.appendChild(reset);
          if (!u.is_admin && u.username !== currentUser) {

            del.textContent = 'Delete';
            del.style.cssText = 'font-size:12px;padding:4px 8px;cursor:pointer;color:#d64545';
            del.onclick = function () {

              errEl.textContent = '';

      function load() {

        });

        client.createUser(u, p).then(function () {

    // List the datasets and auto-select one so a table is always visible: the
    // requested `selectId`, else the previously-selected dataset, else the first.
    function loadDataList(selectId) {
      var listEl = document.getElementById('data-list');
      if (!listEl) return;
      listEl.innerHTML = '<div class="placeholder">Loading…</div>';
      // Data is a PROTECTED view, so a session already exists by the time we list.
      Promise.resolve().then(function () {
      client.listDatasets().then(function (datasets) {
        if (!datasets || !datasets.length) {
          listEl.innerHTML = '<div class="placeholder">No datasets yet.<br>' +
            'Click “+ Data”, or drop a CSV / TSV / CanvasXpress JSON file on the panel.</div>';
          return;
        }
        listEl.innerHTML = '';
        function selectItem(item, d) {
          var active = listEl.querySelector('.data-item.active');
          if (active) active.classList.remove('active');
          item.classList.add('active');
          selectedDatasetId = d.id;
          previewDataset(d);
        }
        var built = [];
        datasets.forEach(function (d) {
          var meta = [];
          if (d.rows != null) meta.push(d.rows + '×' + (d.cols != null ? d.cols : '?'));
          if (d.store) meta.push(d.store);
          if (d.updated_at) meta.push(String(d.updated_at).slice(0, 10));
          var item = document.createElement('div');
          item.className = 'data-item';
          item.style.display = 'flex';
          item.style.alignItems = 'center';
          item.style.gap = '8px';
          item.innerHTML = '<div style="flex:1;min-width:0">' +
            '<div class="data-item-title">' + esc(d.title || d.id) + '</div>' +
            '<div class="data-item-meta">' + esc(meta.join(' · ')) + '</div></div>';
          item.addEventListener('click', function () { selectItem(item, d); });
          // Uploaded datasets can be deleted; the seeded sample ones are protected.
          if (!SAMPLE_IDS[d.id]) {
            var del = document.createElement('button');
            del.textContent = '×';
            del.title = 'Delete dataset';
            del.style.cssText = 'border:none;background:transparent;color:var(--muted);' +
              'font-size:20px;line-height:1;cursor:pointer;padding:0 4px';
            del.addEventListener('click', function (ev) {
              ev.stopPropagation();
              if (!window.confirm('Delete “' + (d.title || d.id) + '”? This cannot be undone.')) return;
              del.disabled = true;
              client.deleteDataset(d.id, { store: d.store }).then(function () {
                if (selectedDatasetId === d.id) selectedDatasetId = null;  // re-select another
                loadDataList();
              }, function (err) {
                del.disabled = false;
                window.alert('Delete failed: ' + (err && err.message || err));
              });
            });
            item.appendChild(del);
          }
          listEl.appendChild(item);
          built.push({ item: item, d: d });
        });
        var want = selectId || selectedDatasetId;
        var target = null;
        if (want) { for (var i = 0; i < built.length; i++) { if (built[i].d.id === want) { target = built[i]; break; } } }
        if (!target) target = built[0];   // default to the first dataset
        if (target) selectItem(target.item, target.d);
      }, function (err) {
        listEl.innerHTML = '<div class="placeholder">' + esc(datasetErrorHint(err)) +
          '<br><small>' + esc(err && err.message || err) + '</small></div>';
      });
      });
    }

    // Turn a fetch failure into an actionable hint. A 404 on the LIST endpoint
    // means /api/datasets isn't on the server we hit (wrong origin, or a stale
    // server started before the dataset routes existed); 401 means not logged in;
    // no status usually means the server is down / blocked by CORS.
    function datasetErrorHint(err) {
      var status = err && err.status;
      if (status === 404) {
        return 'No /api/datasets on ' + (API_BASE || location.origin) + '. ' +
          'Serve builder.html from cxd_server, pass ?api=<server-url>, or restart a stale server.';
      }
      if (status === 401) return 'Not logged in — sign in to the cxd_server first.';
      if (status == null) return 'Couldn’t reach the cxd_server — is it running (and CORS-allowed)?';
      return 'Couldn’t load datasets (HTTP ' + status + ').';
    }

    function previewDataset(d) {
      var titleEl = document.getElementById('data-title');
      var host = document.getElementById('data-canvas-host');
      if (!host) return;
      if (titleEl) titleEl.textContent = (d.title || d.id) + (d.store ? '  ·  ' + d.store : '');
      destroyDataPreview();
      host.innerHTML = '<div class="placeholder">Loading…</div>';
      client.getDataset(d.id, { store: d.store }).then(function (data) {
        host.innerHTML = '';
        requestAnimationFrame(function () {
          if (document.getElementById('data-title') == null) return;  // navigated away
          // Per-render measurement was returning different values (so each table
          // rendered at a different size). Measure the pane ONCE and reuse that
          // width for every dataset, so all previews are identically sized.
          var measured = host.clientWidth || 0;
          if (measured > 320) previewWidth = measured;   // cache the first good width
          var width = Math.max(320, previewWidth || measured || 640);
          var height = 460;
          var canvas = document.createElement('canvas');
          canvas.id = 'data-preview-' + String(d.id).replace(/[^A-Za-z0-9_-]/g, '_');
          // Buffer + display box both pinned to the shared width (buffer defaults
          // to 500×500 otherwise).
          canvas.setAttribute('width', width);
          canvas.setAttribute('height', height);
          canvas.style.width = width + 'px';
          canvas.style.height = height + 'px';
          host.appendChild(canvas);
          // view:'table' renders the data as a scrollable grid — same as the
          // dashboard's "table" control; resizable:false pins it to the canvas.
          dataPreviewInstance = new window.CanvasXpress(canvas.id, data,
            { view: 'table', title: d.title || d.id, resizable: false }, {});
        });
      }, function (err) {
        host.innerHTML = '<div class="placeholder">Couldn’t load “' + esc(d.id) + '”.' +
          '<br><small>' + esc(err && err.message || err) + '</small></div>';
      });
    }

    function esc(v) {
      return String(v == null ? '' : v).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }

    // --- Settings view: edit the dashboard's presentation, with a live preview ---
    function showSettings() {
      teardown();
      toolbarEl.innerHTML = '<h2 class="view-title">Settings</h2>';
      var L = currentSpec.layout || {};
      viewEl.innerHTML =
        '<div class="settings">' +
          '<div class="settings-form">' +
            '<h3>Dashboard settings</h3>' +
            '<label>Background color<input type="color" id="s-bg"></label>' +
            '<label>Background (CSS override)<input type="text" id="s-bgtext" placeholder="#f2f4f7 · transparent · linear-gradient(...)"></label>' +
            '<label>Background image' +
              '<input type="file" id="s-bgimg-file" accept="image/*">' +
              '<input type="text" id="s-bgimg-url" placeholder="https://…/image.jpg or paste a URL" style="margin-top:6px">' +
              '<button type="button" id="s-bgimg-clear" style="margin-top:6px;align-self:flex-start;padding:4px 10px">Clear image</button>' +
            '</label>' +
            '<label>Dashboard width (px, blank = full)<input type="number" id="s-w" min="200" placeholder="auto"></label>' +
            '<label>Dashboard height (px, blank = auto)<input type="number" id="s-h" min="200" placeholder="auto"></label>' +
            '<label>Space between panels (px)<input type="number" id="s-gap" min="0" max="48"></label>' +
            '<label>Row height (px)<input type="number" id="s-rh" min="40" max="400"></label>' +
            '<label>Columns<input type="number" id="s-cols" min="1" max="24"></label>' +
            '<label>Canvas margin (px)<input type="number" id="s-inset" min="0" max="60"></label>' +
            '<label>Theme<select id="s-theme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></label>' +
          '</div>' +
          '<div class="settings-preview"><div id="s-preview"></div></div>' +
        '</div>';

      var bg = document.getElementById('s-bg');
      var bgText = document.getElementById('s-bgtext');
      var wIn = document.getElementById('s-w');
      var hIn = document.getElementById('s-h');
      var gap = document.getElementById('s-gap');
      var rh = document.getElementById('s-rh');
      var cols = document.getElementById('s-cols');
      var inset = document.getElementById('s-inset');
      var theme = document.getElementById('s-theme');

      bg.value = hexOr(currentSpec.background, '#f2f4f7');
      bgText.value = currentSpec.background || '';
      wIn.value = currentSpec.width != null ? currentSpec.width : '';
      hIn.value = currentSpec.height != null ? currentSpec.height : '';
      gap.value = L.gap != null ? L.gap : 12;
      rh.value = L.rowHeight != null ? L.rowHeight : 30;
      cols.value = L.cols != null ? L.cols : 12;
      inset.value = currentSpec.canvasInset != null ? currentSpec.canvasInset : 18;
      theme.value = currentSpec.theme || 'auto';

      var previewTimer = null;
      function apply(changes) {
        currentSpec = CXD.updateSettings(currentSpec, changes);
        // Background colour/image is pure container styling (the renderer only
        // sets it on the host — no CanvasXpress involvement), so reflect it live
        // and SKIP the re-render. Otherwise dragging the colour picker fires a
        // burst of `input` events, each tearing down + recreating every graph,
        // and the instances flicker/disappear mid-drag. Layout/theme changes
        // still need a render, but debounced so a rapid input doesn't thrash it.
        var keys = Object.keys(changes);
        var bgOnly = keys.length > 0 &&
          keys.every(function (k) { return k === 'background' || k === 'backgroundImage'; });
        if (bgOnly) {
          applyBgLive(document.getElementById('s-preview'));
        } else {
          schedulePreview();
        }
      }
      function applyBgLive(host) {
        if (!host) return;
        host.style.backgroundColor = currentSpec.background || '';
        if (currentSpec.backgroundImage) {
          host.style.backgroundImage = 'url("' + String(currentSpec.backgroundImage).replace(/"/g, '\\"') + '")';
          host.style.backgroundSize = 'cover';
          host.style.backgroundPosition = 'center';
          host.style.backgroundRepeat = 'no-repeat';
        } else {
          host.style.backgroundImage = '';
        }
      }
      function schedulePreview() {
        if (previewTimer) clearTimeout(previewTimer);
        previewTimer = setTimeout(function () { previewTimer = null; renderSettingsPreview(); }, 150);
      }
      bg.addEventListener('input', function () { bgText.value = bg.value; apply({ background: bg.value }); });
      bgText.addEventListener('input', function () { if (isHex(bgText.value)) bg.value = bgText.value; apply({ background: bgText.value }); });

      var bgImgFile = document.getElementById('s-bgimg-file');
      var bgImgUrl = document.getElementById('s-bgimg-url');
      if (currentSpec.backgroundImage && currentSpec.backgroundImage.indexOf('data:') !== 0) {
        bgImgUrl.value = currentSpec.backgroundImage;
      }
      bgImgFile.addEventListener('change', function () {
        var f = bgImgFile.files && bgImgFile.files[0];
        if (!f) return;
        var reader = new FileReader();
        reader.onload = function () { apply({ backgroundImage: reader.result }); };  // data URI
        reader.readAsDataURL(f);
      });
      bgImgUrl.addEventListener('input', function () { apply({ backgroundImage: bgImgUrl.value }); });
      document.getElementById('s-bgimg-clear').addEventListener('click', function () {
        bgImgUrl.value = ''; bgImgFile.value = ''; apply({ backgroundImage: '' });
      });
      wIn.addEventListener('input', function () { apply({ width: wIn.value === '' ? '' : num(wIn.value) }); });
      hIn.addEventListener('input', function () { apply({ height: hIn.value === '' ? '' : num(hIn.value) }); });
      gap.addEventListener('input', function () { apply({ gap: num(gap.value) }); });
      rh.addEventListener('input', function () { apply({ rowHeight: num(rh.value) }); });
      cols.addEventListener('input', function () { apply({ cols: num(cols.value) }); });
      inset.addEventListener('input', function () { apply({ canvasInset: num(inset.value) }); });
      theme.addEventListener('change', function () { apply({ theme: theme.value }); });

      renderSettingsPreview();
    }

    function renderSettingsPreview() {
      if (!document.getElementById('s-preview')) return;
      // Chain off the previous preview so the old instances are destroyed BEFORE
      // the new render populates the shared host (otherwise the async destroy
      // clears the freshly-rendered grid and the graphs disappear).
      currentPreview = Promise.resolve(currentPreview).then(function (h) {
        if (h && h.destroy) { try { h.destroy(); } catch (e) {} }
        var host = document.getElementById('s-preview');
        if (!host) return null;   // user navigated away mid-chain
        return CXD.renderDashboard(currentSpec, host, { CanvasXpress: window.CanvasXpress, baseUrl: API_BASE });
      });
    }

    function num(v) { var n = parseInt(v, 10); return isNaN(n) ? 0 : n; }
    function isHex(v) { return /^#[0-9a-fA-F]{3,8}$/.test(v || ''); }
    function hexOr(v, fallback) { return isHex(v) ? v : fallback; }

    function showPlaceholder(name) {
      teardown();
      toolbarEl.innerHTML = '<h2 class="view-title">' + name + '</h2>';
      viewEl.innerHTML = '<div class="placeholder"><p>' + name + ' — coming soon.</p></div>';
    }

    // Views that touch per-user state require a session; visiting one while
    // signed out routes to Login and resumes the intended view after sign-in.
    var PROTECTED = { Builder: 1, Data: 1, Dashboards: 1, Settings: 1, Admin: 1 };
    var pendingView = null;

    function activate(name) {
      if (PROTECTED[name] && !currentUser) { pendingView = name; return showLogin(name); }
      if (name === 'Admin' && !isAdmin) { return showHome(); }  // not an admin — nothing to see
      navItems.forEach(function (n) { n.classList.toggle('active', n.getAttribute('data-view') === name); });
      if (name === 'Home') showHome();
      else if (name === 'Builder') showBuilder();
      else if (name === 'Data') showData();
      else if (name === 'Settings') showSettings();
      else if (name === 'Admin') showAdmin();
      else showPlaceholder(name);
    }

    navItems.forEach(function (n) {
      n.addEventListener('click', function () { activate(n.getAttribute('data-view')); });
    });

    // Footer link: "Sign in" when signed out, "Sign out" when signed in.
    document.getElementById('rail-auth').addEventListener('click', function (e) {
      e.preventDefault();
      if (currentUser) doLogout(); else showLogin(pendingView || 'Home');
    });

    // Dev convenience: the real served app injects window.__CXD_CONFIG__, so its
    // absence means we're the raw dev example (examples/serve.py), which seeds a
    // `demo` user. There, sign in automatically so the example opens straight
    // into the builder like before. The served app always shows the login screen.
    var IS_SERVED_APP = typeof window.__CXD_CONFIG__ !== 'undefined';

    // Boot: ask the server who we are. If a session cookie is already valid we
    // land on Home signed-in; otherwise the served app reads "Signed out" and
    // protected views bounce to Login — while the dev example auto-signs-in demo.
    refreshUser().catch(function () {}).then(function () {
      if (currentUser || IS_SERVED_APP) return activate('Home');
      // dev example, not logged in → sign in as the seeded demo user (create on
      // first run), then continue. Falls through to Home if no server is present.
      return client.login(DEMO_USER, DEMO_PASS)
        .catch(function () { return client.signup(DEMO_USER, DEMO_PASS); })
        .then(function () { return refreshUser(); })
        .catch(function () {})
        .then(function () { activate('Home'); });
    });
  </script>
</body>
</html>
