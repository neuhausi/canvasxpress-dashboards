[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canvasxpress-dashboards-server"
version = "0.10.0"
description = "Persistence & sharing service for canvasxpress-dashboards specs — save/load/share dashboards behind your own origin, mirroring the canvasxpress-connectors auth model."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Isaac Neuhaus" }]
keywords = ["canvasxpress", "dashboard", "visualization", "persistence", "sharing"]

# The store is stdlib-only; the web app adds FastAPI.
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "itsdangerous>=2.1", "python-dotenv>=1.0"]
s3 = ["boto3>=1.34"]
# SQL object + dashboard stores (postgres:// / sqlite://). SQLite needs no
# driver; for Postgres add a driver too — or use the `postgres` extra below,
# which bundles the drivers so `postgresql://` URLs work out of the box.
sql = ["SQLAlchemy>=2.0"]
# Both drivers: a plain `postgresql://` URL means psycopg2 under SQLAlchemy 2.0 but
# psycopg (3) under SQLAlchemy 2.1+, so bundling both keeps such URLs working on
# either. (`postgresql+psycopg://` / `+psycopg2://` pick one explicitly.)
postgres = ["SQLAlchemy>=2.0", "psycopg2-binary>=2.9", "psycopg[binary]>=3.1"]
# Google Drive store (gdrive://folderId). OAuth reuses canvasxpress-connectors.
gdrive = ["google-api-python-client>=2.0", "google-auth>=2.0"]
# Python reference runtime for kind:"function" (/api/functions/run). The snippet
# harness runs each input through a pandas DataFrame, so the Python language is
# only offered when pandas is importable (functions_status gates on it).
functions = ["pandas>=2.0"]
# Natural-language dashboard builder (CXD_LLM_API_KEY). 1.8 is the version
# tested; older SDKs may lack messages.create(output_config=...).
llm = ["anthropic>=1.8"]
# Single sign-on (OpenID Connect): ID-token signature checks.
sso = ["PyJWT[crypto]>=2.8"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6", "pandas>=2.0", "PyJWT[crypto]>=2.8"]

[project.urls]
Homepage = "https://github.com/neuhausi/canvasxpress-dashboards"

[project.scripts]
cxd-server = "cxd_server.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cxd_server"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
