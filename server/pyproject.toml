[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canvasxpress-dashboards-server"
version = "0.14.0"
description = "Persistence & sharing service for canvasxpress-dashboards specs — save/load/share dashboards behind your own origin, mirroring the canvasxpress-connectors auth model."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Isaac Neuhaus" }]
keywords = ["canvasxpress", "dashboard", "visualization", "persistence", "sharing"]

# The store is stdlib-only; the web app adds FastAPI.
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "itsdangerous>=2.1", "python-dotenv>=1.0",
       # httpx is the async client the main app uses to forward data-function runs to a
       # standalone runtime (CXD_FUNCTIONS_RUNTIME_URL). It is also FastAPI's TestClient dep.
       "httpx>=0.27"]
s3 = ["boto3>=1.34"]
# SQL object + dashboard stores (postgres:// / sqlite://). SQLite needs no
# driver; for Postgres add a driver too — or use the `postgres` extra below,
# which bundles the drivers so `postgresql://` URLs work out of the box.
sql = ["SQLAlchemy>=2.0"]
# Both drivers: a plain `postgresql://` URL means psycopg2 under SQLAlchemy 2.0 but
# psycopg (3) under SQLAlchemy 2.1+, so bundling both keeps such URLs working on
# either. (`postgresql+psycopg://` / `+psycopg2://` pick one explicitly.)
postgres = ["SQLAlchemy>=2.0", "psycopg2-binary>=2.9", "psycopg[binary]>=3.1"]
# Google Drive store (gdrive://folderId). OAuth reuses canvasxpress-connectors.
gdrive = ["google-api-python-client>=2.0", "google-auth>=2.0"]
# Python reference runtime for kind:"function" (/api/functions/run). The snippet
# harness runs each input through a pandas DataFrame, so the Python language is
# only offered when pandas is importable (functions_status gates on it).
functions = ["pandas>=2.0"]
# Natural-language dashboard builder (CXD_LLM_API_KEY). 1.8 is the version
# tested; older SDKs may lack messages.create(output_config=...).
llm = ["anthropic>=1.8"]
# Single sign-on (OpenID Connect): ID-token signature checks.
sso = ["PyJWT[crypto]>=2.8"]
# Per-user database sources + scheduled refresh from them (CXD_CONNECTORS=on,
# ENCRYPTION_KEY required). Add the driver extra for your database too, e.g.
# canvasxpress-connectors[postgres].
# 0.8+: the integration opens its store with cx_connectors.sqlstore.open_store (so
# CXD_CONNECTORS_DB may be a bare path, a sqlite:// URL, or a postgresql:// URL) and
# uses cx_connectors.databricks_oauth. Add the driver extra for your database too, e.g.
# canvasxpress-connectors[postgres].
connectors = ["canvasxpress-connectors[web,sql]>=0.8"]
# Databricks "sign in as the viewer" for connector sources when the app runs on
# Posit Connect (databricks://posit-connect@host...). Uses the cx_connectors
# databricks_oauth resolver and open_store, so it needs the same 0.8+ as above
# plus its posit-sdk extra. See connectors.py.
posit-connect = ["canvasxpress-connectors[web,sql,databricks,posit-connect]>=0.8", "SQLAlchemy>=2.0,<2.1"]
# The Data page's Databricks catalog browser WITHOUT Posit Connect (CXD_DATABRICKS_AUTH=token).
# SQLAlchemy 2.1 breaks the Databricks driver ("Expected tuple, got Row"), hence the cap.
databricks = ["canvasxpress-connectors[web,sql,databricks]>=0.8", "SQLAlchemy>=2.0,<2.1"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6", "pandas>=2.0", "PyJWT[crypto]>=2.8"]

[project.urls]
Homepage = "https://github.com/neuhausi/canvasxpress-dashboards"

[project.scripts]
cxd-server = "cxd_server.__main__:main"
cxd-pool = "cxd_server.billing:main"
cxd-reference-data = "cxd_server.reference_data:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cxd_server"]
# Ship the small demo SQLite databases so the built-in connectors integration can
# seed demo sources on any install (CXD_CONNECTORS_DEMO_SOURCES=on), not just the
# examples/ dev launcher.
artifacts = ["src/cxd_server/demo_data/*.db"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
