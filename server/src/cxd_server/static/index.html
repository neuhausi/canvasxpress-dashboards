    // The schedule editor (a modal). sc = an existing schedule, or {kind, config?} for a new one.
    function editSchedule(sc, status, onSaved) {
      var kind = sc.kind;
      var cfg = JSON.parse(JSON.stringify(sc.config || {}));
      var body = openModal((sc.id ? 'Edit: ' : '') + SCHEDULE_KINDS[kind].label);
      // Fields use the shared .cxd-control look (same height/border/radius as the
      // rest of the app) instead of short native inputs.
      function row(label, control, hint) {
        var r = document.createElement('div');
        r.style.cssText = 'display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;margin:8px 0';
        var l = document.createElement('div'); l.textContent = label; l.style.fontWeight = '600';
        var c = document.createElement('div'); c.style.cssText = 'display:flex;gap:6px;align-items:center;flex-wrap:wrap';
        (Array.isArray(control) ? control : [control]).forEach(function (x) { c.appendChild(x); });
        if (hint) { var h = document.createElement('div'); h.style.cssText = 'grid-column:2;font-size:13px;color:var(--muted);margin-top:-4px'; h.innerHTML = hint; r.appendChild(l); r.appendChild(c); r.appendChild(h); return r; }
        r.appendChild(l); r.appendChild(c); return r;
      }
      function input(value, placeholder, type) {
        var i = document.createElement('input'); i.type = type || 'text'; i.value = value == null ? '' : value;
        if (placeholder) i.placeholder = placeholder; i.className = 'cxd-control'; return i;
      }
      function select(options, value) {
        var sel = document.createElement('select'); sel.className = 'cxd-control';
        options.forEach(function (o) { var op = document.createElement('option'); op.value = o[0]; op.textContent = o[1]; sel.appendChild(op); });
        if (value != null) sel.value = value;
        return sel;
      }
      var err = document.createElement('div'); err.style.cssText = 'color:var(--cx-ui-danger);min-height:18px;font-size:14px;margin-top:8px';
      var fields = document.createElement('div');
      var name = input(sc.name || '', 'A name you will recognise');
      name.style.width = '100%';
      fields.appendChild(row('Name', name));
      var getConfig = null;   // kind-specific: returns the config object

      // ---- when (preset → cron) ----
      var cron = sc.cron || (kind === 'alert' ? '*/15 * * * *' : kind === 'refresh' ? '0 6 * * *' : '0 8 * * 1');
      var parts = cron.split(' ');
      var presetValue = 'custom';
      if (cron === '*/15 * * * *' || cron === '0 * * * *') presetValue = cron;
      else if (/^\d+ \d+ \* \* \*$/.test(cron)) presetValue = 'daily';
      else if (/^\d+ \d+ \* \* 1-5$/.test(cron)) presetValue = 'weekdays';
      else if (/^\d+ \d+ \* \* [0-6]$/.test(cron)) presetValue = 'weekly';
      var preset = select(WHEN_PRESETS, presetValue);
      var time = input(/^\d+$/.test(parts[1]) && /^\d+$/.test(parts[0]) ? ('0' + parts[1]).slice(-2) + ':' + ('0' + parts[0]).slice(-2) : '08:00', '', 'time');
      var day = select([['1', 'Monday'], ['2', 'Tuesday'], ['3', 'Wednesday'], ['4', 'Thursday'], ['5', 'Friday'], ['6', 'Saturday'], ['0', 'Sunday']],
        /^[0-6]$/.test(parts[4]) ? parts[4] : '1');
      var custom = input(cron, 'minute hour day month weekday');
      var tz = input(sc.tz || localZone(), 'IANA time zone, e.g. Europe/Paris');
      tz.style.width = '200px';
      var preview = document.createElement('div');
      preview.style.cssText = 'font-size:13px;color:var(--muted)';
      function cronValue() {
        var p = preset.value;
        if (p === 'custom') return custom.value.trim();
        if (p.indexOf('*') !== -1) return p;
        var hm = (time.value || '08:00').split(':');
        var base = String(+hm[1]) + ' ' + String(+hm[0]) + ' * * ';
        return base + (p === 'daily' ? '*' : p === 'weekdays' ? '1-5' : day.value);
      }
      var previewTimer = null;
      function syncWhen() {
        var p = preset.value;
        time.style.display = (p === 'daily' || p === 'weekdays' || p === 'weekly') ? '' : 'none';
        day.style.display = p === 'weekly' ? '' : 'none';
        custom.style.display = p === 'custom' ? '' : 'none';

      gap.addEventListener('input', function () { apply({ gap: num(gap.value) }); });
      rh.addEventListener('input', function () { apply({ rowHeight: num(rh.value) }); });
      cols.addEventListener('input', function () { apply({ cols: num(cols.value) }); });
      inset.addEventListener('input', function () { apply({ canvasInset: num(inset.value) }); });
      // Read a theme's panel background straight from the loaded library, so the
      // "Coordinate" option stays in step with whatever CanvasXpress ships.
      function themeBg(name) {
        var CX = window.CanvasXpress;
        if (!CX || !CX.themeDef) return '';
        var key = String(name || '').toLowerCase().replace(/[\s_]+/g, '');
        if (key === 'auto') {
          var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          key = dark ? 'cxdark' : 'cx';
        }
        var def = CX.themeDef[key];
        if (!def) return '';
        // Mirror renderDashboard.themeBackground: prefer the outer canvas fill
        // (`plot.background.fill`), then the inner panel fill, then the base
        // `rect.fill` both inherit from. Themes like `stata` have a white panel but
        // a tinted outer canvas (#eaf2f3); `wsj` defines only `rect.fill` (#f8f2e4).
        var fill = def['plot.background.fill'];
        if (!fill || fill === 'element_blank') fill = def['panel.background.fill'];
        if (!fill || fill === 'element_blank') fill = def['rect.fill'];
        return (fill && fill !== 'element_blank') ? fill : '';
      }
      // While coordinating, the background is derived from the theme (the spec's
      // own `background` is left untouched, so it returns verbatim on uncheck).
      // Disable the pickers and show the themed colour in them as feedback.
      function reflectBgControls() {
        var coord = bgCoord.checked;
        bg.disabled = coord; bgText.disabled = coord;
        if (coord) {
          var c = themeBg(theme.value);
          if (isHex(c)) bg.value = c;
          if (c) bgText.value = c;
        } else {
          bg.value = hexOr(currentSpec.background, '#f2f4f7');
          bgText.value = currentSpec.background || '';
        }
      }
      // Live-apply to every rendered CanvasXpress instance using the library's own
      // theme switch (setTheme redraws itself) — the same mechanism the library
      // uses internally. The persisted config change (apply) covers fresh renders.
      function liveApplyTheme(name) {
        var list = window.CanvasXpress && window.CanvasXpress.instances || [];
        for (var i = 0; i < list.length; i++) {
          try { if (typeof list[i].setTheme === 'function') list[i].setTheme(name || 'auto'); }
          catch (e) { /* best-effort */ }
        }
      }
      // Live-apply a color scheme: set the instance's colorScheme, recompute its
      // color array via the library's setColorScheme, then redraw.
      function liveApplyColors(name) {
        if (!name) return;   // empty = per-chart default; the re-render restores it
        var list = window.CanvasXpress && window.CanvasXpress.instances || [];
        for (var i = 0; i < list.length; i++) {
          try {
            var g = list[i];
            g.colorScheme = name;
            if (typeof g.setColorScheme === 'function') g.setColorScheme();
            if (typeof g.draw === 'function') g.draw();
          } catch (e) { /* best-effort */ }
        }
      }
      theme.addEventListener('change', function () {
        apply({ theme: theme.value });   // renderer re-derives the coordinated bg
        reflectBgControls();
        if (panelCoord.checked) { applyChromeLive(document.getElementById('s-preview')); reflectPanelControls(); }
        // The preview's light/dark chrome first, so the re-themed charts pick up its theme
        applyThemeClassLive(document.getElementById('s-preview'));
        liveApplyTheme(theme.value);
      });
      bgCoord.addEventListener('change', function () {
        apply({ coordinateBackground: bgCoord.checked });
        reflectBgControls();
        if (panelCoord.checked) { applyChromeLive(document.getElementById('s-preview')); reflectPanelControls(); }
      });
      colors.addEventListener('change', function () {
        apply({ colorScheme: colors.value });
        liveApplyColors(colors.value);
      });
      reflectBgControls();
      reflectPanelControls();
      fontSel.addEventListener('change', function () {
        apply({ fontName: fontSel.value });
        // Live-apply to every existing CanvasXpress instance on the page (the
        // preview re-render covers new ones; this covers whatever is drawn now).
        var list = window.CanvasXpress && window.CanvasXpress.instances || [];
        for (var i = 0; i < list.length; i++) {
          try {
            list[i].fontName = fontSel.value;
            if (typeof list[i].draw === 'function') list[i].draw();
          } catch (e) { /* best-effort */ }
        }
      });

      renderSettingsPreview();
    }

    function renderSettingsPreview() {
      if (!document.getElementById('s-preview')) return;
      // Chain off the previous preview so the old instances are destroyed BEFORE
      // the new render populates the shared host (otherwise the async destroy
      // clears the freshly-rendered grid and the graphs disappear).
      currentPreview = Promise.resolve(currentPreview).then(function (h) {
        if (h && h.destroy) { try { h.destroy(); } catch (e) {} }
        var host = document.getElementById('s-preview');
        if (!host) return null;   // user navigated away mid-chain
        return CXD.renderDashboard(currentSpec, host, { CanvasXpress: window.CanvasXpress, baseUrl: API_BASE, functionsRuntime: FUNCTIONS_RUNTIME, prepareLive: ensureConnectorsSession });
      });
    }

    function num(v) { var n = parseInt(v, 10); return isNaN(n) ? 0 : n; }
    function isHex(v) { return /^#[0-9a-fA-F]{3,8}$/.test(v || ''); }
    function hexOr(v, fallback) { return isHex(v) ? v : fallback; }

    // ---- "Dashboard from database": a guided path through the three tools it
    // is made of — the database-source editor (Data → + Database) twice, then
    // the Builder's + Control ("Query a source") and + Panel dialogs on a new
    // dashboard. Nothing here is wizard-only: each step is the same dialog the
    // user meets later, so the dashboard stays editable with the same tools.
    function showDbWizard(prefill) {
      prefill = prefill || {};
      var created = [];
      function dropCreated() {
        created.forEach(function (n) {
          connectorsApi('/api/sources/' + encodeURIComponent(n), { method: 'DELETE' }).catch(function () {});
        });
      }
      var body = openModal('New dashboard from a database', null);
      var intro = document.createElement('div');
      intro.className = 'cxd-wizard-note';
      intro.style.marginBottom = '12px';
      intro.innerHTML = 'A dashboard like <b>GTEx Gene Explorer</b>, in four steps — each one is a tool you can use on its own later:' +
        '<ol style="margin:8px 0 0;padding-left:20px;line-height:1.6">' +
        '<li><b>The values to pick from</b> — a database query (Data → + Database).</li>' +
        '<li><b>The query a pick re-runs</b> — a query with a <code>:parameter</code>.</li>' +
        '<li><b>The Control</b> — lists the values and re-runs the query (Builder → + Control).</li>' +
        '<li><b>The chart</b> — of the re-run query, with a live preview (Builder → + Panel).</li></ol>';
      body.appendChild(intro);
      var title = document.createElement('input');
      title.type = 'text';
      title.placeholder = 'e.g. Sales by store';
      var label = document.createElement('label');
      label.className = 'cxd-wizard-field';
      label.appendChild(document.createTextNode('Dashboard title'));
      label.appendChild(title);
      body.appendChild(label);
      var msg = document.createElement('div');
      msg.className = 'cxd-wizard-msg';
      body.appendChild(msg);
      var row = document.createElement('div');
      row.className = 'cxd-wizard-actions';
      var start = smallButton('Start', function () {
        var t = title.value.trim();
        if (!t) { msg.textContent = 'Give the dashboard a title.'; return; }
        body.close();
        runChain(t);
      });
      start.className = 'cX-Button cX-Button--primary';
      row.appendChild(smallButton('Cancel', function () { body.close(); }));
      row.appendChild(start);
      body.appendChild(row);
      setTimeout(function () { title.focus(); }, 0);

      function slugOf(text) {
        return String(text || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 32) || 'explorer';
      }
      function runChain(dashTitle) {
        var slug = slugOf(dashTitle);
        var choices = null;
        openDbSourceDialog(null, {
          title: 'Step 1 of 4 — The values to pick from', name: slug + '-choices', template: 'choices',
          fromSource: prefill.source || '', table: prefill.table || '',
          saveLabel: 'Save and continue',
          intro: 'Pick the <b>database</b>, the <b>table</b>, then click the <b>column</b> whose values the Control will list: ' +
            'the query is written for you. <b>Test</b> it, then continue.'
        }).then(function (saved) {
          if (!saved) return null;
          created.push(saved.name);
          choices = saved;
          var cols = saved.sample && saved.sample.columns || [];
          return openDbSourceDialog(null, {
            title: 'Step 2 of 4 — The query a pick re-runs', name: slug + '-detail', template: 'detail',
            fromSource: saved.name, param: cols[1] || '', saveLabel: 'Save and continue',
            intro: 'Pick the <b>table</b> and the <b>column</b> the picked value filters: the query gets a <b>:' + esc(cols[1] || 'parameter') +
              '</b> where the Control’s value goes (always bound, never pasted into the SQL). Give it a sample value and <b>Test</b>.'
          });
        }).then(function (detail) {
          if (!detail) { dropCreated(); return; }
          created.push(detail.name);
          // A new dashboard with both sources, then the Builder's own dialogs.
          var spec = CXD.blankSpec(slug + '-' + Date.now().toString(36), dashTitle);
          spec = CXD.setDataSource(spec, choices.name, { kind: 'connector', url: CXD.connectorSourceUrl(choices.name), ttl: 600000 });
          spec = CXD.setDataSource(spec, detail.name, { kind: 'connector', url: CXD.connectorSourceUrl(detail.name), ttl: 0 });
          currentSpec = spec; currentOwner = null;
          activate('Builder');
          var builder = currentBuilder;
          var choiceCols = choices.sample && choices.sample.columns || [];
          return builder.openControlDialog({
            choices: 'ref:' + choices.name, target: 'ref:' + detail.name,
            annotation: choiceCols[1] || '', param: detail.params[0] || ''
          }).then(function (control) {
            if (!control) return null;
            return builder.whenReady().then(function () {
              return builder.openPanelDialog({ source: 'ref:' + detail.name, title: dashTitle });
            });
          }).then(function (panel) {
            // Saved either way: the sources and the Control are already useful.
            var finalSpec = builder.getSpec();
            currentSpec = finalSpec;
            return client.save(finalSpec).then(function () {
              if (!panel) window.alert('Saved “' + dashTitle + '”. Add its chart with + Panel.');
            });
          });
        }).catch(function (e) { window.alert('Dashboard from database: ' + (e && e.message || e)); });
      }
    }

    // --- Dashboards view: the user's saved dashboards (the shipped examples
    // are seeded here by examples/serve.py) — open in Builder, preview, delete.
    function showDashboards() {
      teardown();
      chipsOpen = false;
      toolbarEl.innerHTML =
        '<div style="display:flex;align-items:center;gap:8px;width:100%">' +
          '<h2 class="view-title">Dashboards</h2>' +
          '<button class="cta" id="dash-refresh" style="margin-left:auto;padding:6px 14px;font-size:16px;background:transparent;border:1px solid var(--rail-border);color:inherit">Refresh</button>' +
          '<button class="cta" id="dash-wizard">＋ Chart from data</button>' +
          '<button class="cta" id="dash-dbwizard" title="A Control that lists values from your database, over a chart that re-queries it for the picked value">＋ Dashboard from database</button>' +
        '</div>';
      viewEl.innerHTML =
        '<div class="data-view cxd-dash-view">' +
          '<div class="cxd-dash-col" style="flex:0 0 var(--cxd-left-w);width:var(--cxd-left-w);box-sizing:border-box;display:flex;flex-direction:column">' +
            '<div class="cxb-dash-search-wrap">' +
              '<input id="dash-search" type="search" placeholder="Search dashboards…"/>' +
              '<button type="button" id="dash-filter-btn" title="Filter by what a dashboard uses" aria-label="Filter by what a dashboard uses" aria-haspopup="true" aria-expanded="false"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h12l-4.5 5.5V13l-3-1.5V8.5z"/></svg><span id="dash-filter-badge"></span></button>' +
              '<div id="dash-chips" role="group" aria-label="Filter by what a dashboard uses"></div>' +
            '</div>' +
            '<div class="data-list" id="dash-list" style="width:auto;align-self:stretch"><div class="placeholder">Loading…</div></div>' +
          '</div>' +
          '<div class="cxd-left-resizer" title="Drag to resize the side panel (every page follows) · double-click to reset" role="separator" aria-orientation="vertical"></div>' +
          '<div class="data-preview" id="dash-preview" style="padding:0 12px 12px">' +
            '<div class="data-preview-title" id="dash-title">Click “View” on a dashboard to preview it here.</div>' +
            '<div id="dash-host"></div>' +
            // Floating pill, styled like the Comments / Ask pills, sitting in the same
            // bottom strip (positioned by placeCollabPills). Shown only while previewing.
            '<button type="button" id="dash-export-bundle" title="Download a self-contained zip: spec + data snapshot + per-panel R &amp; Python code + methods.md" ' +
              'style="display:none;position:fixed;bottom:var(--cxd-pill-bottom,16px);z-index:var(--cx-z-modal);' +
              'align-items:center;gap:7px;padding:7px 14px;border:1px solid var(--cxd-border);border-radius:var(--cx-radius-pill);' +
              'background:var(--cxd-panel-bg);color:inherit;font:600 12.5px/1.3 var(--cxd-font);cursor:pointer;box-shadow:var(--cx-shadow-2)">⬇ Export bundle</button>' +
          '</div>' +
        '</div>';
      document.getElementById('dash-refresh').onclick = loadDashList;
      document.getElementById('dash-wizard').onclick = showWizard;
      document.getElementById('dash-dbwizard').onclick = showDbWizard;
      loadDashList();
    }

    // Shipped dashboards pinned to fixed places in the Dashboards list (1-based,
    // top to bottom) — the two data-function showcases and the live-streaming
    // one — whatever their owner or save date (plus the disposable Sandbox);
    // every other dashboard keeps the server's order around them.
    var FEATURED_DASHBOARD_POSITIONS = { 'cohort-explorer': 2, 'live-ops': 3, 'dose-response-lab': 4, 'sandbox': 5 };

    /**
     * Move the featured dashboards to their fixed list positions.
     * @param {object[]} rows - Dashboard summaries in server order.
     * @param {object} positions - id -> 1-based position.
     * @returns {object[]} The reordered rows (a new array).
     */
    function placeFeatured(rows, positions) {
      var rest = rows.filter(function (d) { return !Object.prototype.hasOwnProperty.call(positions, d.id); });
      var pinned = rows.filter(function (d) { return Object.prototype.hasOwnProperty.call(positions, d.id); })
        .sort(function (a, b) { return positions[a.id] - positions[b.id]; });
      pinned.forEach(function (d) {
        rest.splice(Math.min(positions[d.id] - 1, rest.length), 0, d);
      });
      return rest;
    }

    // Filter chips for the building blocks a dashboard uses (Links, Fields, Shape
    // data, …). Purely additive: the features come from a separate read-only call
    // after the list has rendered, so if it fails the list simply has no chips.
    var FEATURE_CHIPS = [['links', 'Links'], ['fields', 'Fields'], ['shape', 'Shape data'], ['filters', 'Filters'],
      ['join', 'Join'], ['function', 'Function'], ['live', 'Live']];
    var activeFeatureChips = {};
    var chipsOpen = false;   // popover state (survives the chip re-render on each toggle)

    /**
     * Show or hide the chips popover under the search box.
     * @param {boolean} open - True to show it.
     */
    function setChipsOpen(open) {
      var chipsEl = document.getElementById('dash-chips');
      var btnEl = document.getElementById('dash-filter-btn');
      if (!chipsEl) return;
      chipsOpen = !!open;
      chipsEl.classList.toggle('cxb-is-open', !!chipsOpen);
      if (btnEl) btnEl.setAttribute('aria-expanded', chipsOpen ? 'true' : 'false');
    }
    // Click outside or Esc closes it. Bound once; a no-op when the view is not showing.
    document.addEventListener('click', function (e) {
      if (chipsOpen && !e.target.closest('#dash-chips') && !e.target.closest('#dash-filter-btn')) setChipsOpen(false);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && chipsOpen) setChipsOpen(false);
    });

    /**
     * Hide the list rows that lack any active chip's feature, then re-run the text search.
     * @param {object} featuresByKey - "owner/id" -> feature id array.
     */
    function applyFeatureChips(featuresByKey) {
      var active = Object.keys(activeFeatureChips).filter(function (k) { return activeFeatureChips[k]; });
      document.querySelectorAll('#dash-list .data-item').forEach(function (row) {
        var have = featuresByKey[row.getAttribute('data-dash-key')] || [];
        var miss = active.some(function (k) { return have.indexOf(k) === -1; });
        if (miss) row.setAttribute('data-chip-hide', '1'); else row.removeAttribute('data-chip-hide');
      });
      var input = document.getElementById('dash-search');
      if (input && input.oninput) input.oninput();
    }

    function loadDashFeatureChips() {
      var chipsEl = document.getElementById('dash-chips');
      if (!chipsEl) return;
      fetch(API_BASE + '/api/dashboards/features', { credentials: 'include' }).then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      }).then(function (r) {
        var features = (r && r.features) || {};
        var counts = {};
        Object.keys(features).forEach(function (key) {
          features[key].forEach(function (f) { counts[f] = (counts[f] || 0) + 1; });
        });
        chipsEl.innerHTML = '';
        FEATURE_CHIPS.forEach(function (chip) {
          if (!counts[chip[0]]) return;
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'cta';
          btn.setAttribute('aria-pressed', activeFeatureChips[chip[0]] ? 'true' : 'false');
          btn.className = 'cxb-dash-chip' + (activeFeatureChips[chip[0]] ? '' : ' cxb-is-off');
          btn.textContent = chip[1] + ' (' + counts[chip[0]] + ')';
          btn.onclick = function (e) {
            e.stopPropagation();
            activeFeatureChips[chip[0]] = !activeFeatureChips[chip[0]];
            loadDashFeatureChips();
          };
          chipsEl.appendChild(btn);
        });
        var btnEl = document.getElementById('dash-filter-btn');
        var badgeEl = document.getElementById('dash-filter-badge');
        var nActive = Object.keys(activeFeatureChips).filter(function (k) { return activeFeatureChips[k]; }).length;
        if (btnEl) {
          btnEl.classList.toggle('cxb-is-shown', !!chipsEl.children.length);
          btnEl.onclick = function (e) { e.stopPropagation(); setChipsOpen(!chipsEl.classList.contains('cxb-is-open')); };
        }
        if (badgeEl) { badgeEl.textContent = nActive; badgeEl.classList.toggle('cxb-is-shown', !!nActive); }
        if (!chipsEl.children.length) setChipsOpen(false);
        else setChipsOpen(chipsOpen);
        applyFeatureChips(features);
      }).catch(function () { /* chips are optional */ });
    }

    var selectedDashboardId = null;   // last previewed dashboard (survives view switches)

    function loadDashList() {
      var listEl = document.getElementById('dash-list');
      if (!listEl) return;
      client.list().then(function (rows) {
        rows = placeFeatured((rows && rows.dashboards) || rows || [], FEATURED_DASHBOARD_POSITIONS);
        if (!rows.length) {
          listEl.innerHTML = '<div class="placeholder">No dashboards yet — build one in the Builder (or describe one in Chat) and Save.</div>';
          return;
        }
        listEl.innerHTML = '';
        rows.forEach(function (d) {
          var item = document.createElement('div');
          item.className = 'data-item';
          item.style.cssText = 'padding:10px 12px;border:1px solid var(--rail-border);border-radius:var(--cx-radius-lg);margin-bottom:8px;cursor:pointer';
          var when = (d.updated_at || '').replace('T', ' ').slice(0, 16);
          var isShared = d.visibility === 'public' || d.visibility === 'auth';
          // Shared WITH me (by another owner) vs mine: only the owner manages it.
          var fromOther = !!d.shared;
          var mine = !fromOther && !d.example;
          // The badge doubles as "show the link again" (click it) so the Share
          // button can be a simple Share/Unshare toggle without losing access to
          // the existing link once shared.
          var sharedBadge = isShared && mine
            ? ' <span data-act="showlink" title="Show the share link and embed codes" style="cursor:pointer;font-size:13px;font-weight:600;color:var(--cx-ui-text);background:var(--cx-ui-accent-tint-subtle);border-radius:var(--cx-radius-pill);padding:1px 8px;vertical-align:middle">🔗 shared' +
              (d.visibility === 'auth' ? ' (sign-in)' : '') + '</span>'
            : '';
          // A compact access icon describing YOUR access; hovering shows the owner
          // and permissions. 🔒 = you can only view; 👥 = shared (you may edit it,
          // or you own it and shared it); nothing = yours / editable and unshared.
          var accessIcon = '', accessTip = '';
          var canEdit = mine || (fromOther && d.access === 'edit') || (d.example && !d.readOnly);
          var grants = d.sharedWith || [];
          if (d.disposable) {
            accessIcon = '👥';
            accessTip = 'Owner: ' + d.owner + '\nPermissions: anyone can edit or delete \u2014 a disposable ' +
              'scratch dashboard, recreated when the server restarts if it is missing';
          } else if (!canEdit) {
            accessIcon = '🔒';
            accessTip = d.example
              ? 'Owner: ' + d.owner + ' (shipped example)\nPermissions: view only (only an administrator can change it)'
              : 'Owner: ' + d.owner + '\nPermissions: view only (you can open it and read how it is built; saving is disabled)';
          } else if (fromOther) {
            accessIcon = '👥';
            accessTip = 'Owner: ' + d.owner + '\nPermissions: can edit (your saves update the owner\'s dashboard)';
          } else if (mine && grants.length) {
            accessIcon = '👥';
            accessTip = 'Owner: you\nShared with: ' + grants.map(function (g) {
              var who = g.principal === '*' ? 'everyone' : g.principal.replace(/^user:/, '').replace(/^group:/, 'group ');
              return who + ' (' + (g.level === 'edit' ? 'can edit' : 'view') + ')';
            }).join(', ') + (d.locked ? '\nProtected from deletion' : '');
          }
          if (accessIcon) {
            sharedBadge += ' <span class="access-icon" title="' + esc(accessTip) + '" aria-label="' + esc(accessTip) + '">' +
              accessIcon + '</span>';
          }
          item.innerHTML =
            '<div style="font-weight:600">' + (d.title || d.id) + sharedBadge + '</div>' +
            '<div style="font-size:14px;color:var(--muted)">' + d.id + (when ? ' · ' + when : '') + '</div>' +
            '<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">' +
              '<button class="cta" data-act="view" style="padding:4px 10px;font-size:14px">View</button>' +
              '<button class="cta" data-act="preview" style="padding:4px 10px;font-size:14px;background:transparent;border:1px solid var(--rail-border);color:var(--accent)">Preview</button>' +
              '<button class="cta" data-act="open" style="padding:4px 10px;font-size:14px;background:transparent;border:1px solid var(--rail-border);color:var(--accent)">Open in Builder</button>' +
              (mine && hasPerm('share.grant')
                ? '<button class="cta" data-act="people" style="padding:4px 10px;font-size:14px;background:transparent;border:1px solid var(--rail-border);color:inherit">People</button>'
                : '') +
              // One toggle: "Share link" when not shared, "Unshare" when shared
              // (Unshare in the danger colour so it stands out on the selected
              // card's accent-tint background, where a neutral border washes out).
              (mine && hasPerm('share.public') && !isShared
                ? '<button class="cta" data-act="share" style="padding:4px 10px;font-size:14px;background:transparent;border:1px solid var(--rail-border);color:inherit">Share link</button>'
                : '') +
              (mine && isShared
                ? '<button class="cta" data-act="unshare" style="padding:4px 10px;font-size:14px;background:transparent;border:1px solid var(--cx-ui-danger);color:var(--cx-ui-danger)">Unshare</button>'
                : '') +
              '<button class="cta" data-act="history" title="Versions and electronic signatures" style="padding:4px 10px;font-size:14px;background:transparent;border:1px solid var(--rail-border);color:inherit">History</button>' +
              (hasPerm('schedule.create')
                ? '<button class="cta" data-act="subscribe" title="Email this dashboard on a schedule" style="padding:4px 10px;font-size:14px;background:transparent;border:1px solid var(--rail-border);color:inherit">Subscribe</button>'
                : '') +
              (mine || d.disposable
                ? '<button class="cta" data-act="del" style="padding:4px 10px;font-size:14px;background:transparent;border:1px solid var(--rail-border);color:inherit">Delete</button>'
                : '') +
            '</div>' +
            '<div class="dash-share cxd-share-box" style="display:none;margin-top:8px;font-size:14px"></div>';
          item.onclick = function (e) {
            var act = e.target.getAttribute && e.target.getAttribute('data-act');
            if (act === 'view') {
              previewDashboard(d);
            } else if (act === 'preview') {
              // Full-page render in a new tab — like opening an example page.
              window.open(API_BASE + '/examples/view.html?id=' + encodeURIComponent(d.id), '_blank');
            } else if (act === 'open') {
              // Edit access saves back to the owner (a shared board with an edit
              // grant, or a shipped example an admin maintains); view access saves
              // your own copy under a new name (the Builder's Save dialog).
              var writesToOwner = (fromOther && d.access === 'edit') || (d.example && !d.readOnly);
              client.load(d.id, fromOther || d.example ? { owner: d.owner } : undefined).then(function (spec) {
                currentSpec = spec;
                currentOwner = writesToOwner ? d.owner : null;
                activate('Builder');
              });
            } else if (act === 'people') {
              showPeople({ kind: 'dashboard', id: d.id, title: d.title });
            } else if (act === 'history') {
              showHistory(d);
            } else if (act === 'subscribe') {
              pendingSchedule = { kind: 'subscription', name: (d.title || d.id) + ' by email',
                config: { dashboard: d.id, dashboard_owner: d.owner || currentUser } };
              activate('Schedules');
            } else if (act === 'share') {
              shareDashboard(d, item.querySelector('.dash-share'));
            } else if (act === 'showlink') {
              // Re-open the link/embed for an already-shared board (no re-send).
              shareDashboard(d, item.querySelector('.dash-share'), true);
            } else if (act === 'unshare') {
              client.share(d.id, 'private').then(loadDashList);
            } else if (act === 'del') {
              if (!confirm('Delete "' + (d.title || d.id) + '"?')) return;
              client.remove(d.id, d.owner && d.owner !== currentUser ? { owner: d.owner } : undefined).then(loadDashList);
            } else if (!e.target.closest('.dash-share')) {
              previewDashboard(d);
            }
          };
          item.setAttribute('data-search', ((d.title || '') + ' ' + d.id + ' ' + (fromOther ? d.owner : '')).toLowerCase());
          item.setAttribute('data-dash-id', d.id);
          item.setAttribute('data-dash-key', (d.owner || '') + '/' + d.id);
          listEl.appendChild(item);
        });
        wireListSearch('dash-search', 'dash-list');
        loadDashFeatureChips();
        // Default preview: the dashboard picked last time, else the first one.
        var pick = rows.find(function (d) { return d.id === selectedDashboardId; }) || rows[0];
        if (pick) previewDashboard(pick);
      }).catch(function (err) {
        listEl.innerHTML = '<div class="placeholder">Could not list dashboards: ' + err.message + '</div>';
      });
    }

    // Publish a read-only share link for a dashboard and surface it inline
    // (with copy). 'public' = anyone with the link; the server also supports
    // 'auth' (signed-in users only) and 'private' (revoke).
    function shareDashboard(d, box, skipMail) {
      if (!box) return;
      // Collapse an already-open box toggles it shut (a second click / the ✕).
      if (skipMail && box.style.display === 'block') {
        box.style.display = 'none'; box.innerHTML = ''; return;
      }
      box.style.display = 'block';
      box.textContent = 'Publishing share link…';
      client.share(d.id, 'public').then(function (summary) {
        var url = summary.share_url ||
          (location.origin + '/shared.html?token=' + summary.share_token);
        // When first sharing, open the default email client with the link
        // pre-filled; re-opening an already-shared board (skipMail) just shows
        // the copy/revoke/embed box.
        var title = d.title || d.id;
        if (!skipMail) location.href = 'mailto:?subject=' +
          encodeURIComponent('Dashboard shared with you: ' + title) +
          '&body=' + encodeURIComponent(
            'I’ve shared the dashboard “' + title + '” with you (read-only, no account needed):\n\n' +
            url + '\n');
        box.innerHTML = '';
        // An obvious way to collapse the whole share/embed block again.
        var shead = document.createElement('div');
        shead.className = 'cxd-share-head';
        var stitle = document.createElement('b');
        stitle.textContent = 'Share link';
        var sclose = document.createElement('button');
        sclose.className = 'cta cxd-share-close';
        sclose.textContent = '✕';
        sclose.title = 'Close';
        sclose.setAttribute('aria-label', 'Close share options');
        sclose.onclick = function (e) { e.stopPropagation(); box.style.display = 'none'; box.innerHTML = ''; };
        shead.appendChild(stitle); shead.appendChild(sclose);
        box.appendChild(shead);
        var input = document.createElement('input');
        input.value = url; input.readOnly = true;
        input.className = 'cxd-share-link';
        input.onclick = function (e) { e.stopPropagation(); input.select(); };
        var row = document.createElement('div');
        row.className = 'cxd-share-actions';
        var copy = document.createElement('button');
        copy.className = 'cta'; copy.textContent = 'Copy link';
        copy.onclick = function (e) {
          e.stopPropagation();
          (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject())
            .then(function () { copy.textContent = 'Copied ✓'; },
                  function () { input.select(); document.execCommand('copy'); copy.textContent = 'Copied ✓'; });
        };
        var revoke = document.createElement('button');
        revoke.className = 'cta'; revoke.textContent = 'Unshare';
        revoke.style.cssText = 'background:transparent;border:1px solid var(--cx-ui-danger);color:var(--cx-ui-danger)';
        revoke.onclick = function (e) {
          e.stopPropagation();
          client.share(d.id, 'private').then(function () {
            box.textContent = 'Link revoked.'; setTimeout(function () { box.style.display = 'none'; }, 1500);
          });
        };
        row.appendChild(copy); row.appendChild(revoke);
        box.appendChild(input); box.appendChild(row);
        if (summary.share_token) renderEmbedCodes(box, summary.share_token);
      }, function (err) {
        box.textContent = 'Share failed: ' + err.message;
      });
    }

    // Publish & embed: per-panel (or whole-dashboard) embed codes for a shared
    // dashboard. The share token is the stable handle, so saving republishes
    // every embed in place.
    function renderEmbedCodes(box, token) {
      var wrap = document.createElement('div');
      wrap.className = 'cxd-embed-codes';
      wrap.onclick = function (e) { e.stopPropagation(); };
      var head = document.createElement('div');
      head.className = 'cxd-embed-head';
      head.innerHTML = '<b>Embed</b>';
      var pick = document.createElement('select');
      pick.setAttribute('aria-label', 'Chart to embed');
      pick.className = 'cxd-embed-pick';
      var whole = document.createElement('option');
      whole.value = ''; whole.textContent = 'Whole dashboard';
      pick.appendChild(whole);
      head.appendChild(pick);
      wrap.appendChild(head);
      var codes = document.createElement('div');
      wrap.appendChild(codes);
      box.appendChild(wrap);

      function codeRow(label, text) {
        var row = document.createElement('div');
        row.className = 'cxd-embed-row';
        var area = document.createElement('textarea');
        area.readOnly = true; area.value = text; area.rows = label === 'Image' ? 1 : 3;
        area.setAttribute('aria-label', label + ' embed code');
        area.className = 'cxd-embed-code';
        var btn = document.createElement('button');
        btn.className = 'cta cxd-embed-copy'; btn.textContent = 'Copy ' + label;
        btn.onclick = function () {
          (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
            .then(function () { btn.textContent = 'Copied ✓'; },
                  function () { area.select(); document.execCommand('copy'); btn.textContent = 'Copied ✓'; });
        };
        row.appendChild(area); row.appendChild(btn);
        return row;
      }
      function load() {
        codes.textContent = 'Loading embed codes…';
        client.embedCodes(token, pick.value ? { panel: pick.value } : undefined).then(function (embed) {
          codes.innerHTML = '';
          codes.appendChild(codeRow('iframe', embed.iframe));
          codes.appendChild(codeRow('script', embed.script));
          codes.appendChild(codeRow('Image', embed.image));
        }, function (err) { codes.textContent = 'Embed codes unavailable: ' + err.message; });
      }
      // Panel list comes from the published spec itself (what viewers see).
      client.loadShared(token).then(function (result) {
        var panels = (result.spec && result.spec.panels) || {};
        Object.keys(panels).forEach(function (id) {
          var p = panels[id] || {};
          if (p.type && p.type !== 'graph') return;      // charts only
          var o = document.createElement('option');
          o.value = id; o.textContent = p.title || id;
          pick.appendChild(o);
        });
      }).then(load, load);
      pick.onchange = load;
    }

    // Version history and electronic signatures for one dashboard (a modal).
    function showHistory(d) {
      var opts = d.shared || d.example ? { owner: d.owner } : undefined;
      // Closing refreshes the list (a restore changes it), except when closing to
      // preview an old version: the refresh would re-preview the current one.
      var previewing = false;
      var body = openModal('History of “' + (d.title || d.id) + '”', function () {
        if (!previewing) loadDashList();
      });
      function draw() {
        body.textContent = 'Loading…';
        client.versions(d.id, opts).then(function (r) {
          body.innerHTML = '<p style="margin:0 0 10px;color:var(--muted);font-size:14px">Every save is kept as a version ' +
            'that cannot be changed. A signature binds a person, a meaning and a time to one version’s exact content ' +
            '(its fingerprint); an edit makes a new, unsigned version.</p>';
          var err = document.createElement('div');
          err.style.cssText = 'color:var(--cx-ui-danger);min-height:18px;font-size:14px';
          r.versions.forEach(function (v, i) {
            var box = document.createElement('div');
            box.className = 'cxd-version';
            box.style.cssText = 'border:1px solid var(--rail-border);border-radius:var(--cx-radius-md);padding:8px 10px;margin-bottom:8px';
            var sigs = v.signatures.map(function (sg) {
              return '<div style="font-size:14px;margin-top:3px">' + (sg.valid ? '✍️ ' : '⚠️ ') + '<b>' + esc(sg.meaning) + '</b> by ' +
                esc(sg.signer) + ' · ' + esc(whenText(sg.signed_at)) + ' <span style="color:var(--muted)">(' + esc(sg.method) + ')</span>' +
                (sg.valid ? '' : ' <span style="color:var(--cx-ui-danger)">content changed since signing</span>') + '</div>';
            }).join('');
            box.innerHTML = '<div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap">' +
              '<b>Version ' + v.version + '</b>' + (i === 0 ? ' <span style="font-size:13px;color:var(--accent)">current</span>' : '') +
              '<span style="color:var(--muted);font-size:14px">' + esc(whenText(v.saved_at)) + (v.saved_by ? ' · ' + esc(v.saved_by) : '') +
              (v.note ? ' · ' + esc(v.note) : '') + '</span>' +
              '<code style="font-size:12px;color:var(--muted);margin-left:auto" title="SHA-256 of the saved spec">' + esc(v.sha256.slice(0, 12)) + '…</code></div>' +
              sigs;
            var actions = document.createElement('div');
            actions.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;margin-top:6px';
            actions.appendChild(smallButton('Preview', function () {
              client.version(d.id, v.version, opts).then(function (res) {
                previewing = true;
                body.close();
                previewSpec(res.spec, (d.title || d.id) + ' · version ' + v.version);
              }, function (e) { err.textContent = e.message; });
            }));
            var mine = !d.shared && !d.example;
            if (i > 0 && (mine || d.access === 'edit' || isAdmin)) {
              actions.appendChild(smallButton('Restore', function () {
                if (!confirm('Make version ' + v.version + ' current again? It is saved as a new version.')) return;
                client.restoreVersion(d.id, v.version, opts).then(draw, function (e) { err.textContent = e.message; });
              }));
            }
            if (r.can_sign) {
              var meaning = document.createElement('select');
              meaning.style.cssText = 'font-size:14px;padding:3px 28px 3px 6px';
              r.meanings.forEach(function (m) { meaning.appendChild(new Option(m, m)); });
              var pw = document.createElement('input');
              pw.type = 'password'; pw.placeholder = 'your password';
              pw.style.cssText = 'font-size:14px;padding:3px 6px;width:150px';
              if (r.reauth !== 'password') pw.style.display = 'none';
              actions.appendChild(meaning); actions.appendChild(pw);
              actions.appendChild(smallButton('Sign', function () {
                err.textContent = '';
                client.signVersion(d.id, { version: v.version, meaning: meaning.value, password: pw.value }, opts).then(draw, function (e) {
                  if (e.status === 401 && /^reauth/.test(e.message)) {
                    if (confirm('To sign, confirm who you are with single sign-on (you come back here afterwards).')) {
                      location.href = API_BASE + '/auth/oidc/login?prompt=login';
                    }
                    return;
                  }
                  err.textContent = e.message;
                });
              }, 'background:var(--cx-ui-accent-strong);color:var(--cx-ui-on-accent);border:none;border-radius:var(--cx-radius-md)'));
            }
            box.appendChild(actions);
            body.appendChild(box);
          });
          body.appendChild(err);
        }, function (e) { body.textContent = e.message; });
      }
      draw();
    }

    // Render a spec (e.g. an old version) in the Dashboards preview pane.
    function previewSpec(spec, label) {
      destroyPreviewCollab();
      var titleEl = document.getElementById('dash-title');
      if (titleEl) { titleEl.style.display = ''; titleEl.textContent = label + ' (read-only preview)'; }
      currentPreview = Promise.resolve(currentPreview).then(function (h) {
        if (h && h.destroy) { try { h.destroy(); } catch (e) {} }
        var host = document.getElementById('dash-host');
        if (!host) return null;
        host.innerHTML = '';
        return CXD.renderDashboard(spec, host, { CanvasXpress: window.CanvasXpress, baseUrl: API_BASE, functionsRuntime: FUNCTIONS_RUNTIME, prepareLive: ensureConnectorsSession });
      });
    }

    function previewDashboard(summary) {
      selectedDashboardId = summary.id;
      var listEl = document.getElementById('dash-list');
      if (listEl) {
        var active = listEl.querySelector('.data-item.active');
        if (active) active.classList.remove('active');
        var mine = listEl.querySelector('[data-dash-id="' + summary.id + '"]');
        if (mine) mine.classList.add('active');
      }
      // The dashboard renders name-free (matching the builder) — hide the
      // "click View…" hint line instead of printing the title over it.
      var titleEl = document.getElementById('dash-title');
      if (titleEl) titleEl.style.display = 'none';
      destroyPreviewCollab();
      client.load(summary.id, summary.shared ? { owner: summary.owner } : undefined).then(function (spec) {
        currentPreview = Promise.resolve(currentPreview).then(function (h) {
          if (h && h.destroy) { try { h.destroy(); } catch (e) {} }
          var host = document.getElementById('dash-host');
          if (!host) return null;
          host.innerHTML = '';
          return CXD.renderDashboard(spec, host, { CanvasXpress: window.CanvasXpress, baseUrl: API_BASE, functionsRuntime: FUNCTIONS_RUNTIME, prepareLive: ensureConnectorsSession });
        }).then(function (h) {
          mountPreviewCollab(spec, summary);
          // Wire the inline "Export bundle" pill to this live handle (no popup /
          // separate viewer needed): spec + data + per-panel R/Python + methods.
          var btn = document.getElementById('dash-export-bundle');
          if (btn && h && typeof CXD.exportReproducibleBundle === 'function') {
            btn.style.display = 'inline-flex';
            btn.onclick = function () {
              btn.disabled = true;
              Promise.resolve(CXD.exportReproducibleBundle(h, { baseUrl: API_BASE, filename: (spec.id || 'dashboard') + '-bundle.zip' }))
                .then(function () { btn.disabled = false; }, function (e) { btn.disabled = false; alert('Export failed: ' + (e && e.message || e)); });
            };
            setTimeout(function () { positionExportPill(); }, 0);
          } else if (btn) {
            btn.style.display = 'none';
          }
          return h;
        });
      });
    }

    // --- Builder chat assistant: describe a dashboard in plain language; the
    // server's LLM authors the declarative spec (it never touches the data),
    // the client validates it and loads it straight into the live builder.
    // The checkbox list scopes which datasets the assistant may bind to.
    var chatHistory = [];      // [{role, content}] — survives view switches

    function initChatPanel() {
      var input = document.getElementById('chat-input');
      var send = document.getElementById('chat-send');
      var splitter = document.getElementById('chat-splitter');
      if (splitter) splitter.addEventListener('pointerdown', function (ev) {
        ev.preventDefault();
        var ds = document.getElementById('chat-datasets');
        var section = document.getElementById('chat-section');
        var startY = ev.clientY;
        var startH = ds.getBoundingClientRect().height;
        var maxH = startH + section.getBoundingClientRect().height - 250;
        function move(e) {
          var h = Math.max(250, Math.min(maxH, startH + (e.clientY - startY)));
          ds.style.height = h + 'px';
          ds.style.minHeight = h + 'px';
        }
        function up() {
          document.removeEventListener('pointermove', move);
          document.removeEventListener('pointerup', up);
        }
        document.addEventListener('pointermove', move);
        document.addEventListener('pointerup', up);
      });
      send.onclick = sendChat;
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
      });
      chatHistory.forEach(function (m) { appendChatBubble(m.role, m.content); });
      scrollChatToEnd();
      loadChatDatasets();
      fetch(API_BASE + '/api/llm/status', { credentials: 'include' })
        .then(function (r) { return r.json(); })
        .then(function (s) {
          if (!s.enabled) {
            input.disabled = true; send.disabled = true;
            appendChatBubble('assistant',
              'The assistant is not configured on this server. Set CXD_LLM_API_KEY ' +
              '(an Anthropic API key) in .env and restart — meanwhile, compose dashboards manually on the canvas.');
          }
        }).catch(function () {});
    }

    // Use the card itself as the drag image. The browser's default snapshot of
    // a row near the bottom of the scrolling list includes a sliver of the
    // scrollbar / clips at the container edge; an off-screen clone never does.
    // The clone is removed on the next tick (after the browser has grabbed it).
    function setCardDragImage(ev, card) {
      if (!ev.dataTransfer || typeof ev.dataTransfer.setDragImage !== 'function') return;
      try {
        var r = card.getBoundingClientRect();
        var ghost = card.cloneNode(true);
        // Keep the card's own flex row (checkbox left, title/meta block right) —
        // cssText replaces the label's inline display:flex, so restate it.
        ghost.style.cssText = 'position:fixed;top:-1000px;left:-1000px;margin:0;' +
          'display:flex;align-items:center;gap:8px;' +
          'box-sizing:border-box;width:' + Math.round(r.width) + 'px;pointer-events:none;' +
          'background:var(--cx-ui-surface);box-shadow:var(--cx-shadow-2);opacity:1';
        document.body.appendChild(ghost);
        ev.dataTransfer.setDragImage(ghost, Math.round(ev.clientX - r.left), Math.round(ev.clientY - r.top));
        setTimeout(function () { if (ghost.parentNode) ghost.parentNode.removeChild(ghost); }, 0);
      } catch (e) { /* setDragImage unsupported — keep the default image */ }
    }

    function loadChatDatasets() {
      var listEl = document.getElementById('chat-dataset-list');
      var searchEl = document.getElementById('chat-dataset-search');
      if (!listEl) return;
      fetch(API_BASE + '/api/datasets', { credentials: 'include' })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          var rows = res.datasets || [];
          if (!rows.length) { listEl.textContent = 'No datasets yet — add some in the Data view.'; return; }
          listEl.innerHTML = '';
          rows.forEach(function (d) {
            // Card styled like the Data page's dataset list (.data-item): a bold
            // title over a muted meta line (dims · store · date). Still a <label>
            // so the whole card toggles its checkbox, still draggable to the
            // canvas. Zero margin — the list's flex gap already spaces the cards.
            var label = document.createElement('label');
            label.className = 'chat-ds-row data-item';
            label.style.cssText = 'display:flex;align-items:center;gap:8px;margin:0;cursor:grab';
            var meta = [];
            if (d.rows != null && d.cols != null) meta.push(Math.max(d.rows, d.cols) + '×' + Math.min(d.rows, d.cols));
            else if (d.rows != null) meta.push(d.rows + '×?');
            if (d.store) meta.push(d.store);
            if (d.updated_at) meta.push(String(d.updated_at).slice(0, 10));
            label.setAttribute('data-search', ((d.title || '') + ' ' + d.id + ' ' + (d.store || '')).toLowerCase());
            // Drag the row onto the builder canvas to create a panel from it
            // (the builder's setupDatasetDrop reads this payload); chart type is
            // auto-picked from the data shape.
            label.setAttribute('draggable', 'true');
            label.title = 'Drag onto the canvas to add a panel, or tick to use';
            label.addEventListener('dragstart', function (ev) {
              if (!ev.dataTransfer) return;
              ev.dataTransfer.effectAllowed = 'copy';
              ev.dataTransfer.setData('application/x-cxd-dataset',
                JSON.stringify({ id: d.id, title: d.title || d.id, store: d.store || undefined, config: d.config || undefined }));
              setCardDragImage(ev, label);
            });
            var cb = document.createElement('input');
            cb.type = 'checkbox'; cb.value = d.id; cb.className = 'chat-ds';
            cb.setAttribute('data-store', d.store || '');
            cb.onchange = function () { toggleSpecDataset(d, cb.checked); };
            label.appendChild(cb);
            var info = document.createElement('div');
            info.style.cssText = 'flex:1;min-width:0';
            var titleEl = document.createElement('div');
            titleEl.className = 'data-item-title';
            titleEl.textContent = d.title || d.id;
            var metaEl = document.createElement('div');
            metaEl.className = 'data-item-meta';
            metaEl.textContent = meta.join(' · ');
            info.appendChild(titleEl);
            info.appendChild(metaEl);
            label.appendChild(info);
            listEl.appendChild(label);
          });
          if (searchEl) searchEl.oninput = function () {
            var q = searchEl.value.trim().toLowerCase();
            [].slice.call(listEl.querySelectorAll('.chat-ds-row')).forEach(function (row) {
              row.style.display = (!q || row.getAttribute('data-search').indexOf(q) !== -1) ? 'flex' : 'none';
            });
          };
          syncChatChecks(currentSpec);
          appendChatConnectorRows(listEl);
        })
        .catch(function () { listEl.textContent = 'Could not load datasets.'; });
    }

    // Database sources (bridged canvasxpress-connectors) join the checklist
    // below the datasets: checking one declares it as a live connector source
    // in the working spec, exactly like checking a dataset.
    function appendChatConnectorRows(listEl) {
      ensureConnectorsSession().then(function () {
        return fetch(API_BASE + '/connectors/api/sources', { credentials: 'include' })
          .then(function (r) { return r.ok ? r.json() : { sources: [] }; });
      }).then(function (res) {
        if (document.getElementById('chat-dataset-list') !== listEl) return;
        (res.sources || []).forEach(function (name) {
          var url = API_BASE + '/connectors/api/data?source=' + encodeURIComponent(name);
          // Card styled like the dataset rows / Data page (.data-item): a title
          // (🗄 name) over a muted meta line (dims · database).
          var label = document.createElement('label');
          label.className = 'chat-ds-row data-item';
          label.style.cssText = 'display:flex;align-items:center;gap:8px;margin:0;cursor:grab';
          label.setAttribute('data-search', name.toLowerCase() + ' database');
          // Drag the row onto the canvas to create a panel bound to this
          // database source (the builder's setupDatasetDrop reads this payload).
          label.setAttribute('draggable', 'true');
          label.title = 'Drag onto the canvas to add a panel, or tick to use';
          label.addEventListener('dragstart', function (ev) {
            if (!ev.dataTransfer) return;
            ev.dataTransfer.effectAllowed = 'copy';
            ev.dataTransfer.setData('application/x-cxd-connector', JSON.stringify({ name: name, url: url }));
            setCardDragImage(ev, label);
          });
          var cb = document.createElement('input');
          cb.type = 'checkbox'; cb.value = url; cb.className = 'chat-cs';
          cb.onchange = function () { toggleSpecConnector(name, url, cb); };
          label.appendChild(cb);
          var info = document.createElement('div');
          info.style.cssText = 'flex:1;min-width:0';
          var titleEl = document.createElement('div');
          titleEl.className = 'data-item-title';
          titleEl.textContent = '🗄 ' + name;
          // Meta is the size span; data-sep appends " · database" once dims load
          // (no data-paren, so it reads "342×2 · database" like the dataset meta).
          var metaEl = document.createElement('div');
          metaEl.className = 'data-item-meta';
          metaEl.setAttribute('data-sep', ' · database');
          fillDbSourceDims(name, metaEl);
          info.appendChild(titleEl);
          info.appendChild(metaEl);
          label.appendChild(info);
          listEl.appendChild(label);
        });
        syncChatChecks(currentSpec);
      }).catch(function () { /* no connectors app — checklist stays datasets-only */ });
    }

    function toggleSpecConnector(name, url, cb) {
      var working = currentBuilder ? currentBuilder.getSpec() : currentSpec;
      var data = working.data || {};
      var ref = null;
      Object.keys(data).forEach(function (r) {
        if (!ref && data[r] && data[r].kind === 'connector' && data[r].url === url) ref = r;
      });
      if (cb.checked) {
        if (ref) return;
        working = CXD.setDataSource(working, name, { kind: 'connector', url: url });
      } else {
        if (!ref) return;
        var used = Object.keys(working.panels || {}).some(function (pid) {
          return working.panels[pid].dataRef === ref;
        }) || (working.controls || []).some(function (c) { return c.dataRef === ref; });
        if (used) {
          appendChatBubble('assistant', '“' + name + '” is still used by a panel — unbind or delete that panel first.');
          cb.checked = true;
          return;
        }
        delete working.data[ref];
      }
      currentSpec = working;
      if (currentBuilder) currentBuilder.setSpec(working);
    }

    function selectedChatDatasets() {
      return [].slice.call(document.querySelectorAll('.chat-ds:checked'))
        .map(function (cb) { return cb.value; });
    }

    // --- keep the checklist and the working spec's data sources in sync ---
    // Checked = declared as a spec data source (so "+ Panel" and the per-panel
    // Data dropdown see the same set); binding a dataset on the canvas checks
    // its box here, and vice versa.
    function specDatasetIds(spec) {
      var ids = {};
      var data = (spec && spec.data) || {};
      Object.keys(data).forEach(function (ref) {
        if (data[ref] && data[ref].kind === 'dataset' && data[ref].id) ids[data[ref].id] = ref;
      });
      return ids;
    }

    function syncChatChecks(spec) {
      var ids = specDatasetIds(spec);
      [].slice.call(document.querySelectorAll('.chat-ds')).forEach(function (cb) {
        cb.checked = !!ids[cb.value];
      });
      // Connector rows check by URL.
      var urls = {};
      var data = (spec && spec.data) || {};
      Object.keys(data).forEach(function (ref) {
        if (data[ref] && data[ref].kind === 'connector' && data[ref].url) urls[data[ref].url] = ref;
      });
      [].slice.call(document.querySelectorAll('.chat-cs')).forEach(function (cb) {
        cb.checked = !!urls[cb.value];
      });
    }

    function toggleSpecDataset(d, checked) {
      var working = currentBuilder ? currentBuilder.getSpec() : currentSpec;
      var ids = specDatasetIds(working);
      if (checked) {
        if (ids[d.id]) return;   // already declared
        working = CXD.setDataSource(working, d.id,
          { kind: 'dataset', id: d.id, store: d.store || undefined });
      } else {
        var ref = ids[d.id];
        if (!ref) return;
        var used = Object.keys(working.panels || {}).some(function (pid) {
          return working.panels[pid].dataRef === ref;
        }) || (working.controls || []).some(function (c) { return c.dataRef === ref; });
        if (used) {
          appendChatBubble('assistant', '“' + (d.title || d.id) + '” is still used by a panel — unbind or delete that panel first.');
          syncChatChecks(working);
          return;
        }
        delete working.data[ref];
      }
      currentSpec = working;
      if (currentBuilder) currentBuilder.setSpec(working);
    }

    // Pin the log to its newest message (bubble growth, replies updating in
    // place, and late layout shifts all re-anchor to the bottom).
    function scrollChatToEnd() {
      var log = document.getElementById('chat-log');
      if (!log) return;
      log.scrollTop = log.scrollHeight;
      requestAnimationFrame(function () { log.scrollTop = log.scrollHeight; });
    }

    function appendChatBubble(role, text) {
      var log = document.getElementById('chat-log');
      if (!log) return;
      var b = document.createElement('div');
      var user = role === 'user';
      b.style.cssText = 'max-width:88%;padding:8px 12px;border-radius:var(--cx-radius-lg);font-size:16px;line-height:1.45;white-space:pre-wrap;' +
        (user ? 'align-self:flex-end;background:var(--cx-ui-accent-strong);color:var(--cx-ui-on-accent)'
              : 'align-self:flex-start;background:rgba(127,127,127,.12)');
      b.textContent = text;
      log.appendChild(b);
      log.scrollTop = log.scrollHeight;
      return b;
    }

    function sendChat() {
      var input = document.getElementById('chat-input');
      var msg = (input.value || '').trim();
      if (!msg) return;
      input.value = '';
      appendChatBubble('user', msg);
      chatHistory.push({ role: 'user', content: msg });
      var pending = appendChatBubble('assistant', 'Thinking…');
      // The working spec on the canvas is the revision context, so chat and
      // hand edits compose; selected datasets scope what the LLM may bind to.
      var working = currentBuilder ? currentBuilder.getSpec() : currentSpec;
      fetch(API_BASE + '/api/llm/dashboard', {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: msg,
          history: chatHistory.slice(0, -1),
          spec: working,
          datasets: selectedChatDatasets()
        })
      }).then(function (r) {
        return r.json().then(function (body) {
          if (!r.ok) throw new Error(body.detail || ('HTTP ' + r.status));
          return body;
        });
      }).then(function (res) {
        pending.textContent = res.reply || 'Done.';
        scrollChatToEnd();
        chatHistory.push({ role: 'assistant', content: res.reply || '' });
        if (res.spec) {
          // Underlay each bound dataset's associated config (uploadDataset's
          // opts.config — e.g. the oncoprintCNA/MUT layer keys a flattened
          // alteration matrix needs) beneath the generated panel config;
          // generated keys win. Panels are documented to adopt it as their
          // initial state — without it, asking for an oncoprint on such a
          // dataset draws a plain heatmap (no layer wiring).
          client.listDatasets().then(function (all) {
            var cfgById = {};
            (all || []).forEach(function (d) { if (d && d.config) cfgById[d.id] = d.config; });
            var sources = res.spec.data || {};
            Object.keys(res.spec.panels || {}).forEach(function (pid) {
              var panel = res.spec.panels[pid];
              var src = panel && panel.dataRef && sources[panel.dataRef];
              var base = src && src.kind === 'dataset' && cfgById[src.id];
              if (base) panel.config = Object.assign({}, base, panel.config || {});
            });
          }).catch(function () {}).then(function () {
            // Defence in depth: the server validates and repairs before replying,
            // so this should already be clean — but never render an invalid spec.
            var v = CXD.validateSpec(res.spec);
            if (v.valid) {
              currentSpec = res.spec;
              if (currentBuilder) currentBuilder.setSpec(res.spec);
              syncChatChecks(res.spec);
            } else {
              appendChatBubble('assistant', 'The generated spec did not validate: ' + v.errors.join('; '));
            }
          });
        } else if (res.validation && res.validation.ok === false) {
          // The server tried to repair its own spec and ran out of attempts.
          // Say why, so the user can rephrase instead of guessing.
          appendChatBubble('assistant', 'I could not build a valid dashboard: '
            + (res.validation.errors || []).slice(0, 5).join('; '));
        }
      }).catch(function (err) {
        pending.textContent = '⚠ ' + err.message;
        scrollChatToEnd();
      });
    }

    // --- Logs view: the canvasxpress-mcp bridge log (request + response per
    // chart-engine call), newest first — for debugging generated configs.
    function showLogs() {
      teardown();
      toolbarEl.innerHTML =
        '<div style="display:flex;align-items:center;gap:8px;width:100%">' +
          '<h2 class="view-title">Logs</h2>' +
          '<span id="logs-path" style="font-size:13px;color:var(--muted)"></span>' +
          '<button class="cta" id="logs-clear" style="margin-left:auto;padding:6px 14px;font-size:14px;background:transparent;border:1px solid var(--rail-border);color:var(--cx-ui-danger)">Delete all</button>' +
          '<button class="cta" id="logs-refresh" style="padding:6px 14px;font-size:14px;background:transparent;border:1px solid var(--rail-border);color:inherit">Refresh</button>' +
        '</div>';
      viewEl.innerHTML = '<div id="logs-list" style="display:flex;flex-direction:column;gap:10px;max-width:1100px"><div class="placeholder">Loading…</div></div>';
      document.getElementById('logs-refresh').onclick = loadLogs;
      document.getElementById('logs-clear').onclick = clearLogs;
      loadLogs();
    }

    // Delete every recorded chart-engine call (clears the server log file).
    function clearLogs() {
      if (!confirm('Delete all logged chart-engine calls? This cannot be undone.')) return;
      var btn = document.getElementById('logs-clear');
      if (btn) { btn.disabled = true; btn.textContent = 'Deleting…'; }
      fetch(API_BASE + '/api/llm/mcp-log', { method: 'DELETE', credentials: 'include' })
        .then(function (r) { return r.json(); })
        .then(function () { loadLogs(); })
        .catch(function (err) { alert('Could not delete logs: ' + err.message); })
        .then(function () {
          var b = document.getElementById('logs-clear');
          if (b) { b.disabled = false; b.textContent = 'Delete all'; }
        });
    }

    function loadLogs() {
      var listEl = document.getElementById('logs-list');
      if (!listEl) return;
      fetch(API_BASE + '/api/llm/mcp-log?n=100', { credentials: 'include' })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          var pathEl = document.getElementById('logs-path');
          if (pathEl) pathEl.textContent = res.log_path || '';
          var entries = (res.entries || []).slice().reverse();   // newest first
          if (!entries.length) {
            listEl.innerHTML = '<div class="placeholder">No chart-engine calls logged yet — use the Builder chat, then Refresh.</div>';
            return;
          }
          listEl.innerHTML = '';
          entries.forEach(function (e) {
            var resp = e.response || {};
            var ok = !e.error && resp.success !== false;
            var cfg = resp.config || {};
            var req = e.request || {};
            var head = document.createElement('div');
            var card = document.createElement('details');
            card.style.cssText = 'border:1px solid var(--rail-border);border-radius:var(--cx-radius-lg);background:var(--rail-bg);padding:10px 14px';
            var sum = document.createElement('summary');
            sum.style.cssText = 'cursor:pointer;display:flex;gap:10px;align-items:center;flex-wrap:wrap;list-style:none';
            sum.innerHTML =
              '<span style="font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:var(--cx-radius-pill);background:' + (ok ? 'var(--cx-ui-success-tint);color:var(--cx-ui-success)' : 'var(--cx-ui-danger-tint);color:var(--cx-ui-danger)') + '">' + (ok ? 'OK' : 'FAIL') + '</span>' +
              '<span style="font-weight:600">' + (e.endpoint || '?') + '</span>' +
              (cfg.graphType ? '<span style="color:var(--accent)">' + cfg.graphType + '</span>' : '') +
              '<span style="color:var(--muted);font-size:13px">' + (e.ts || '') + '</span>' +
              '<span style="color:var(--muted);font-size:13px;flex:1;min-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(req.description || req.instruction || '') + '</span>';
            card.appendChild(sum);
            var body = document.createElement('div');
            body.style.cssText = 'margin-top:10px;display:grid;gap:8px';
            function block(title, obj) {
              if (obj == null) return;
              var d = document.createElement('div');
              d.innerHTML = '<div style="font-size:12px;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:2px">' + title + '</div>';
              var pre = document.createElement('pre');
              pre.style.cssText = 'margin:0;padding:8px 10px;background:rgba(127,127,127,.08);border-radius:var(--cx-radius-md);font-size:12.5px;overflow-x:auto;white-space:pre-wrap';
              pre.textContent = typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2);
              d.appendChild(pre);
              body.appendChild(d);
            }
            block('Request', req);
            if (e.error) block('Error', e.error);
            block('Config returned', resp.config);
            if ((resp.warnings || []).length) block('Warnings', resp.warnings);
            if (resp.invalid_refs && Object.keys(resp.invalid_refs).length) block('Invalid references', resp.invalid_refs);
            if ((resp.removed_params || []).length) block('Removed (hallucinated) params', resp.removed_params);
            if (resp.request_id) block('MCP request id', resp.request_id);
            card.appendChild(body);
            listEl.appendChild(card);
          });
        })
        .catch(function (err) {
          listEl.innerHTML = '<div class="placeholder">Could not load the log: ' + esc(err.message) + '</div>';
        });
    }

    function showPlaceholder(name) {
      teardown();
      toolbarEl.innerHTML = '<h2 class="view-title">' + name + '</h2>';
      viewEl.innerHTML = '<div class="placeholder"><p>' + name + ' — coming soon.</p></div>';
    }

    // Views that touch per-user state require a session; visiting one while
    // signed out routes to Login and resumes the intended view after sign-in.
    var PROTECTED = { Builder: 1, Data: 1, Dashboards: 1, Schedules: 1, Settings: 1, Admin: 1, Logs: 1 };
    var pendingView = null;

    function activate(name) {
      if (PROTECTED[name] && !currentUser) { pendingView = name; return showLogin(name); }
      if (name === 'Admin' && !isAdmin) { return showHome(); }  // not an admin — nothing to see
      if (name === 'Logs' && !isAdmin) { return showHome(); }   // Logs is admin-only
      navItems.forEach(function (n) { n.classList.toggle('active', n.getAttribute('data-view') === name); });
      if (name === 'Home') showHome();
      else if (name === 'Builder') showBuilder();
      else if (name === 'Dashboards') showDashboards();
      else if (name === 'Logs') showLogs();
      else if (name === 'Data') showData();
      else if (name === 'Settings') showSettings();
      else if (name === 'Schedules') showSchedules();
      else if (name === 'Admin') showAdmin();
      else showPlaceholder(name);
    }

    navItems.forEach(function (n) {
      if (n.getAttribute('href')) return;   // plain links (e.g. Examples) navigate normally
      n.addEventListener('click', function () { activate(n.getAttribute('data-view')); });
    });

    // Footer link: "Sign in" when signed out, "Sign out" when signed in.
    document.getElementById('rail-auth').addEventListener('click', function (e) {
      e.preventDefault();
      if (currentUser) doLogout(); else showLogin(pendingView || 'Home');
    });

    // Dev convenience: the real served app injects window.__CXD_CONFIG__, so its
    // absence means we're the raw dev example (examples/serve.py), which seeds a
    // `demo` user. There, sign in automatically so the example opens straight
    // into the builder like before. The served app always shows the login screen.
    var IS_SERVED_APP = typeof window.__CXD_CONFIG__ !== 'undefined';

    // Deep link: ?open=<dashboard-id> loads that dashboard into the Builder
    // (used by the "Open in Builder" button on the full-page preview). Falls back
    // to the Dashboards view if the dashboard can't be loaded.
    var openId = new URLSearchParams(location.search).get('open');
    function openInBuilder(id) {
      return client.load(id).then(function (spec) {
        currentSpec = spec;
        currentOwner = null;
        activate('Builder');
      }, function () { activate('Dashboards'); });
    }
    function landing() {
      return openId ? openInBuilder(openId) : activate('Home');
    }

    // Boot: ask the server who we are. If a session cookie is already valid we
    // land on Home signed-in; otherwise the served app reads "Signed out" and
    // protected views bounce to Login — while the dev example auto-signs-in demo.
    refreshUser().catch(function () {}).then(function () {
      if (currentUser || IS_SERVED_APP) return landing();
      // dev example, not logged in → sign in as the seeded demo user (create on
      // first run), then continue. Falls through to Home if no server is present.
      return client.login(DEMO_USER, DEMO_PASS)
        .catch(function () { return client.signup(DEMO_USER, DEMO_PASS); })
        .then(function () { return refreshUser(); })
        .catch(function () {})
        .then(function () { landing(); });
    });
  </script>
</body>
</html>
