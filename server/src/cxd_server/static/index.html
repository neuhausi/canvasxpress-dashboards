      // Tabs: every pane stays in the DOM (all the wiring below finds its
      // elements); only the selected one is shown. The choice is remembered.
      function selectAdminTab(name) {
        adminTab = name;
        try { localStorage.setItem('cxd-admin-tab', name); } catch (e) { /* storage blocked */ }
        [].forEach.call(viewEl.querySelectorAll('.admin-pane'), function (pane) {
          pane.style.display = pane.getAttribute('data-pane') === name ? '' : 'none';
        });
        [].forEach.call(viewEl.querySelectorAll('.admin-tab'), function (tab) {
          var on = tab.getAttribute('data-tab') === name;
          tab.classList.toggle('active', on);
          tab.setAttribute('aria-selected', on ? 'true' : 'false');
        });
      }
      [].forEach.call(viewEl.querySelectorAll('.admin-tab'), function (tab) {
        tab.onclick = function () { selectAdminTab(tab.getAttribute('data-tab')); };
      });
      selectAdminTab(viewEl.querySelector('.admin-pane[data-pane="' + adminTab + '"]') ? adminTab : 'people');

      var errEl = document.getElementById('admin-err');
      function fail(err) { errEl.textContent = (err && err.message) || String(err); }

      function renderUsers(users) {
        var host = document.getElementById('admin-users');
        if (!host) return;
        if (!users || !users.length) { host.innerHTML = '<div class="placeholder">No users.</div>'; return; }
        host.innerHTML = '';
        users.forEach(function (u) {
          var row = document.createElement('div');
          row.className = 'data-item';
          row.style.display = 'flex';
          row.style.alignItems = 'center';
          row.style.gap = '10px';
          var badge = u.is_admin ? ' <span style="color:var(--accent);font-size:14px;font-weight:700">ADMIN</span>' : '';
          row.innerHTML =
            '<div style="flex:1">' +
              '<div class="data-item-title">' + esc(u.username) + badge + '</div>' +
              '<div class="data-item-meta">' + u.dashboards + ' dashboard' + (u.dashboards === 1 ? '' : 's') +
                (u.groups && u.groups.length ? ' · groups: ' + esc(u.groups.join(', ')) : '') +
                (!u.is_admin && u.roles ? ' · acts as ' + esc(u.roles.join(' + ')) : '') +
                ' · ' + (u.email ? esc(u.email) + (u.email_verified ? '' : ' (unconfirmed)') : 'no email') + '</div>' +
            '</div>';
          // The user's own role ('' = none: their groups' roles, else the default).
          if (!u.is_admin && govRoles.length) {
            var roleSel = document.createElement('select');
            roleSel.style.cssText = 'font-size:14px;padding:3px 28px 3px 6px';
            roleSel.title = 'Role';
            [''].concat(govRoles.map(function (r) { return r.name; })).forEach(function (name) {
              var o = document.createElement('option'); o.value = name;
              o.textContent = name ? 'Role: ' + name : 'Role: (groups / default)'; roleSel.appendChild(o);
            });
            roleSel.value = u.role || '';
            roleSel.onchange = function () {
              errEl.textContent = '';
              client.assignRole('user:' + u.username, roleSel.value || null).then(load, fail);
            };
            row.appendChild(roleSel);
          }
          // Grant/revoke admin — not for yourself, and not for config-admins
          // (those are governed by CXD_ADMINS, not the stored flag).
          if (!u.via_config && u.username !== currentUser) {
            var toggle = document.createElement('button');
            toggle.textContent = u.is_admin ? 'Revoke admin' : 'Make admin';
            toggle.className = 'cX-Button';
            toggle.style.cssText = 'font-size:14px;padding:4px 8px;cursor:pointer';
            toggle.onclick = function () {
              errEl.textContent = '';
              client.setUserAdmin(u.username, !u.is_admin).then(load, fail);
            };
            row.appendChild(toggle);
          } else if (u.via_config) {
            var tag = document.createElement('span');
            tag.textContent = 'via config';
            tag.style.cssText = 'font-size:14px;color:var(--muted)';
            row.appendChild(tag);
          }
          var mail = document.createElement('button');
          mail.textContent = 'Email…';
          mail.className = 'cX-Button';
          mail.title = 'The address alerts and subscriptions go to';
          mail.style.cssText = 'font-size:14px;padding:4px 8px;cursor:pointer';
          mail.onclick = function () {
            var next = window.prompt('Email address for "' + u.username + '" (empty clears it):', u.email || '');
            if (next === null) return;
            errEl.textContent = '';
            client.setUserEmail(u.username, next.trim()).then(load, fail);
          };
          row.appendChild(mail);
          var reset = document.createElement('button');
          reset.textContent = 'Reset password';
          reset.className = 'cX-Button';
          reset.style.cssText = 'font-size:14px;padding:4px 8px;cursor:pointer';
          reset.onclick = function () {
            var pw = window.prompt('New password for "' + u.username + '" (≥6 chars):');
            if (!pw) return;
            errEl.textContent = '';
            client.setUserPassword(u.username, pw).then(function () {
              errEl.style.color = 'var(--cx-ui-success)'; errEl.textContent = 'Password reset for ' + u.username + '.';
            }, fail);
          };
          row.appendChild(reset);
          if (!u.is_admin && u.username !== currentUser) {
            var del = document.createElement('button');
            del.textContent = 'Delete';
            del.className = 'cX-Button';
            del.style.cssText = 'font-size:14px;padding:4px 8px;cursor:pointer;color:var(--cx-ui-danger)';
            del.onclick = function () {
              if (!window.confirm('Delete "' + u.username + '" and all their dashboards?')) return;
              errEl.textContent = '';
              client.deleteUser(u.username).then(load, fail);
            };
            row.appendChild(del);
          }
          host.appendChild(row);
        });
      }

      // ---- Roles, groups and lineage -----------------------------------------
      var govRoles = [];
      var govUsers = [];
      // Checkbox rows inside .settings-form, undoing its uppercase block-label style.
      var CHECK_LABEL = 'display:flex;flex-direction:row;gap:8px;align-items:flex-start;margin:0;' +
        'font-weight:400;font-size:14px;text-transform:none;letter-spacing:0;color:inherit';
      // The shared CanvasXpress checkbox (body.cX-UI-Controls); an explicit size, since `auto` collapses
      // an appearance:none box (this used to undo a full-width input rule)
      var CHECK_INPUT = 'width:16px;height:16px;margin:2px 0 0;padding:0;flex:none';
      var govErr = document.getElementById('gov-err');
      function govFail(err) { govErr.textContent = (err && err.message) || String(err); }
      function renderRoles(gov) {
        var permsEl = document.getElementById('role-perms');
        permsEl.innerHTML = '';
        gov.permissions.forEach(function (p) {
          var lab = document.createElement('label');
          lab.style.cssText = CHECK_LABEL;
          lab.innerHTML = '<input type="checkbox" style="' + CHECK_INPUT + '" value="' + esc(p.name) + '"/><span>' + esc(p.description) + '</span>';
          permsEl.appendChild(lab);
        });
        var host = document.getElementById('gov-roles');
        host.innerHTML = '';
        gov.roles.forEach(function (r) {
          var row = document.createElement('div');
          row.className = 'data-item';
          row.style.cssText = 'display:flex;align-items:center;gap:10px';
          var perms = r.permissions.length
            ? r.permissions.map(function (n) { return esc(n); }).join(', ') : 'no permissions (view only)';
          row.innerHTML = '<div style="flex:1"><div class="data-item-title">' + esc(r.name) +
            (r.builtin ? ' <span style="font-size:13px;color:var(--muted)">built-in</span>' : '') +
            (r.name === gov.default_role ? ' <span style="font-size:13px;color:var(--accent)">default</span>' : '') +
            '</div><div class="data-item-meta">' + perms + '</div></div>';
          if (!r.builtin) {
            row.appendChild(smallButton('Edit', function () {
              document.getElementById('role-name').value = r.name;
              Array.prototype.forEach.call(permsEl.querySelectorAll('input'), function (cb) {
                cb.checked = r.permissions.indexOf(cb.value) !== -1;
              });
            }));
            row.appendChild(smallButton('Delete', function () {
              if (!window.confirm('Delete role "' + r.name + '"? Users and groups with it fall back to their other roles.')) return;
              client.deleteRole(r.name).then(loadGovernance, govFail);
            }, 'color:var(--cx-ui-danger)'));
          }
          host.appendChild(row);
        });
      }
      function renderGroups(gov) {
        var roleSel = document.getElementById('group-role');
        roleSel.innerHTML = '<option value="">(no role)</option>' + gov.roles.map(function (r) {
          return '<option value="' + esc(r.name) + '">' + esc(r.name) + '</option>';
        }).join('');
        var membersEl = document.getElementById('group-members');
        membersEl.innerHTML = govUsers.map(function (u) {
          return '<label style="' + CHECK_LABEL + '"><input type="checkbox" style="' + CHECK_INPUT + '" value="' + esc(u) + '"/><span>' + esc(u) + '</span></label>';
        }).join('') || '<span style="color:var(--muted)">No users.</span>';
        var host = document.getElementById('gov-groups');
        host.innerHTML = gov.groups.length ? '' : '<div class="placeholder">No groups yet.</div>';
        gov.groups.forEach(function (g) {
          var row = document.createElement('div');
          row.className = 'data-item';
          row.style.cssText = 'display:flex;align-items:center;gap:10px';
          row.innerHTML = '<div style="flex:1"><div class="data-item-title">👥 ' + esc(g.name) +
            (g.managed ? ' <span style="font-size:13px;color:var(--cx-ui-info-strong)" title="Members are set by the identity provider at each sign-in">SSO</span>' : '') +
            (g.role ? ' <span style="font-size:13px;color:var(--accent)">role: ' + esc(g.role) + '</span>' : '') + '</div>' +
            '<div class="data-item-meta">' + (g.description ? esc(g.description) + ' · ' : '') +
            (g.members.length ? esc(g.members.join(', ')) : 'no members') + '</div></div>';
          row.appendChild(smallButton('Edit', function () {
            document.getElementById('group-form-title').textContent = 'Edit group';
            document.getElementById('group-name').value = g.name;
            document.getElementById('group-desc').value = g.description;
            roleSel.value = g.role || '';
            Array.prototype.forEach.call(membersEl.querySelectorAll('input'), function (cb) {
              cb.checked = g.members.indexOf(cb.value) !== -1;
            });
          }));
          row.appendChild(smallButton('Delete', function () {
            if (!window.confirm('Delete group "' + g.name + '"? Its shares and role go with it.')) return;
            client.deleteGroup(g.name).then(loadGovernance, govFail);
          }, 'color:var(--cx-ui-danger)'));
          host.appendChild(row);
        });
      }
      function renderLineage(lin) {
        var host = document.getElementById('gov-lineage');
        var rows = lin.datasets.map(function (d) {
          return { what: '🗄️ ' + esc(d.id) + ' <span style="color:var(--muted)">(' + esc(d.owner) + (d.store ? ', ' + esc(d.store) : '') + ')</span>', used: d.used_by };
        }).concat(lin.connectors.map(function (c) {
          return { what: '🔌 <code>' + esc(c.url) + '</code>', used: c.used_by };
        }));
        if (!rows.length) { host.innerHTML = '<div class="placeholder">No dashboard reads a stored dataset or connector yet.</div>'; return; }
        host.innerHTML = '<table style="width:100%;border-collapse:collapse"><thead><tr style="text-align:left">' +
          '<th style="padding:5px 8px">Source</th><th style="padding:5px 8px">Used by</th></tr></thead><tbody>' +
          rows.map(function (r) {
            return '<tr><td style="padding:5px 8px;border-top:1px solid var(--rail-border);vertical-align:top">' + r.what + '</td>' +
              '<td style="padding:5px 8px;border-top:1px solid var(--rail-border)">' + r.used.map(function (u) {
                return esc(u.title) + ' <span style="color:var(--muted)">(' + esc(u.owner) + ')</span>';
              }).join('<br>') + '</td></tr>';
          }).join('') + '</tbody></table>';
      }
      function loadGovernance() {
        govErr.textContent = '';
        return Promise.all([client.governance(), client.listUsers()]).then(function (r) {
          var gov = r[0];
          govRoles = gov.roles;
          govUsers = (r[1] || []).map(function (u) { return u.username; });
          renderRoles(gov);
          renderGroups(gov);
          renderUsers(r[1]);
          client.lineage({ all: true }).then(renderLineage, govFail);
        }, govFail);
      }
      document.getElementById('role-save').onclick = function () {
        var perms = Array.prototype.filter.call(document.querySelectorAll('#role-perms input'), function (cb) { return cb.checked; })
          .map(function (cb) { return cb.value; });
        govErr.textContent = '';
        client.saveRole({ name: document.getElementById('role-name').value.trim(), permissions: perms }).then(function () {
          document.getElementById('role-name').value = '';
          loadGovernance();
        }, govFail);
      };
      document.getElementById('group-save').onclick = function () {
        var members = Array.prototype.filter.call(document.querySelectorAll('#group-members input'), function (cb) { return cb.checked; })
          .map(function (cb) { return cb.value; });
        govErr.textContent = '';
        client.saveGroup({
          name: document.getElementById('group-name').value.trim(),
          description: document.getElementById('group-desc').value.trim(),
          members: members,
          role: document.getElementById('group-role').value || null
        }).then(function () {
          document.getElementById('group-form-title').textContent = 'New group';
          document.getElementById('group-name').value = '';
          document.getElementById('group-desc').value = '';
          directoryCache = null;
          loadGovernance();
        }, govFail);
      };

      function load() {
        errEl.style.color = 'var(--cx-ui-danger)';
        client.listUsers().then(function (users) {
          govUsers = (users || []).map(function (u) { return u.username; });
          renderUsers(users);
        }, function (err) {
          document.getElementById('admin-users').innerHTML =
            '<div class="placeholder">' + esc((err && err.message) || 'Failed to load users.') + '</div>';
        });
      }

      document.getElementById('admin-create').onclick = function () {
        var u = document.getElementById('admin-new-user').value.trim();
        var p = document.getElementById('admin-new-pass').value;
        errEl.style.color = 'var(--cx-ui-danger)'; errEl.textContent = '';
        client.createUser(u, p).then(function () {
          document.getElementById('admin-new-user').value = '';
          document.getElementById('admin-new-pass').value = '';
          load();
        }, fail);
      };

      // ---- Audit log (read-only; the server records, the admin browses) -----
      var auditNext = null;
      var auditStatus = document.getElementById('audit-status');
      function auditFilters() {
        return {
          actor: document.getElementById('audit-actor').value.trim(),
          action: document.getElementById('audit-action').value,
          outcome: document.getElementById('audit-outcome').value
        };
      }
      function auditCell(text, extra) {
        return '<td style="padding:5px 8px;border-top:1px solid var(--rail-border);' + (extra || '') + '">' + text + '</td>';
      }
      function renderAudit(page, append) {
        var body = document.getElementById('audit-rows');
        if (!body) return;
        if (!append) body.innerHTML = '';
        if (!page.enabled) {
          body.innerHTML = '<tr><td colspan="6" style="padding:8px">Auditing is turned off on this server (CXD_AUDIT=off).</td></tr>';
        } else if (!page.events.length && !append) {
          body.innerHTML = '<tr><td colspan="6" style="padding:8px">No matching events.</td></tr>';
        }
        page.events.forEach(function (e) {
          var colour = e.outcome === 'denied' ? 'var(--cx-ui-warning-strong)' : e.outcome === 'error' ? 'var(--cx-ui-danger)' : 'inherit';
          var detail = e.detail ? esc(JSON.stringify(e.detail)) : '';
          var tr = document.createElement('tr');
          tr.innerHTML =
            auditCell(esc((e.ts || '').replace('T', ' ').replace(/\+00:00$/, '')), 'white-space:nowrap') +
            auditCell(esc(e.actor || '—')) +
            auditCell(esc(e.action)) +
            auditCell(esc(e.target || '') + (e.owner && e.owner !== e.actor ? ' <span style="color:var(--muted)">(' + esc(e.owner) + ')</span>' : '')) +
            auditCell(esc(e.outcome) + (e.status >= 400 ? ' ' + e.status : ''), 'color:' + colour) +
            auditCell('<code style="font-size:12px;word-break:break-all">' + detail + '</code>');
          body.appendChild(tr);
        });
        auditNext = page.next;
        document.getElementById('audit-more').style.display = auditNext ? '' : 'none';
        document.getElementById('audit-export').href = client.auditExportUrl(auditFilters(), 'csv');
      }
      function loadAudit(append) {
        var filters = auditFilters();
        if (append && auditNext) filters.before = auditNext;
        auditStatus.style.color = 'inherit';
        auditStatus.textContent = '';
        return client.auditLog(filters).then(function (page) {
          var select = document.getElementById('audit-action');
          if (select.options.length === 1 && page.actions) {
            var groups = {};
            page.actions.forEach(function (a) { groups[a.split('.')[0] + '.'] = true; });
            Object.keys(groups).sort().forEach(function (g) {
              var o = document.createElement('option'); o.value = g; o.textContent = g + '*'; select.appendChild(o);
            });
            page.actions.forEach(function (a) {
              var o = document.createElement('option'); o.value = a; o.textContent = a; select.appendChild(o);
            });
          }
          renderAudit(page, append);
        }, function (err) {
          auditStatus.style.color = 'var(--cx-ui-danger)';
          auditStatus.textContent = (err && err.message) || String(err);
        });
      }
      document.getElementById('audit-apply').onclick = function () { loadAudit(false); };
      document.getElementById('audit-more').onclick = function () { loadAudit(true); };
      document.getElementById('audit-verify').onclick = function () {
        auditStatus.style.color = 'inherit';
        auditStatus.textContent = 'Verifying…';
        client.auditVerify().then(function (r) {
          auditStatus.style.color = r.ok ? 'var(--cx-ui-success)' : 'var(--cx-ui-danger)';
          auditStatus.textContent = r.ok
            ? 'Chain intact: ' + r.checked + ' events verified' + (r.checked ? ' (#' + r.first_seq + '–#' + r.last_seq + ').' : '.')
            : 'Chain BROKEN at event #' + r.broken_at + ': an entry was edited or deleted.';
        }, function (err) {
          auditStatus.style.color = 'var(--cx-ui-danger)';
          auditStatus.textContent = (err && err.message) || String(err);
        });
      };
      loadAudit(false);

      // ---- Default examples (app-owned) maintenance -------------------------
      // These call the API directly (owner=app) so the admin can unlock/delete
      // the shared examples; the server enforces admin-only for these writes.
      var EX_OWNER = 'app';
      var exErr = document.getElementById('admin-ex-err');
      function exFail(err) { exErr.textContent = (err && err.message) || String(err); }
      function apiJSON(method, path, body) {
        var init = { method: method, credentials: 'include', headers: {} };
        if (body !== undefined) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(body); }
        return fetch(API_BASE + path, init).then(function (res) {
          return res.text().then(function (t) {
            var p = t ? JSON.parse(t) : null;
            if (!res.ok) throw new Error((p && p.detail) || ('HTTP ' + res.status));
            return p;
          });
        });
      }
      function exRow(host, item, kind) {
        var row = document.createElement('div');
        row.className = 'data-item';
        row.style.cssText = 'display:flex;align-items:center;gap:10px';
        var lockTag = item.locked ? ' <span title="protected" style="font-size:13px">🔒</span>' : '';
        row.innerHTML =
          '<div style="flex:1">' +
            '<div class="data-item-title">' + esc(item.title || item.id) + lockTag + '</div>' +
            '<div class="data-item-meta">' + esc(item.id) + (item.store ? ' · ' + esc(item.store) : '') + '</div>' +
          '</div>';
        var params = 'owner=' + encodeURIComponent(EX_OWNER) + (item.store ? '&store=' + encodeURIComponent(item.store) : '');
        var lockBtn = document.createElement('button');
        lockBtn.textContent = item.locked ? 'Unlock' : 'Lock';
        lockBtn.className = 'cX-Button';
        lockBtn.style.cssText = 'font-size:14px;padding:4px 8px;cursor:pointer';
        lockBtn.onclick = function () {
          exErr.textContent = '';
          apiJSON('POST', '/api/' + kind + '/' + encodeURIComponent(item.id) + '/lock?' + params,
                  { locked: !item.locked }).then(loadExamples, exFail);
        };
        row.appendChild(lockBtn);
        var del = document.createElement('button');
        del.textContent = 'Delete';
        del.className = 'cX-Button';
        del.style.cssText = 'font-size:14px;padding:4px 8px;cursor:pointer;color:var(--cx-ui-danger)';
        del.onclick = function () {
          if (!window.confirm('Delete example ' + kind.slice(0, -1) + ' "' + (item.title || item.id) + '"? This removes it for everyone.')) return;
          exErr.textContent = '';
          apiJSON('DELETE', '/api/' + kind + '/' + encodeURIComponent(item.id) + '?' + params).then(loadExamples, exFail);
        };

        host.appendChild(row);
      }
      function fillExamples(hostId, items, kind) {
        var host = document.getElementById(hostId);
        if (!host) return;
        var mine = (items || []).filter(function (it) { return it.owner === EX_OWNER || it.example; });
        if (!mine.length) { host.innerHTML = '<div class="placeholder">No example ' + kind + '.</div>'; return; }
        host.innerHTML = '';
        mine.forEach(function (it) { exRow(host, it, kind); });
      }
      function loadExamples() {
        exErr.style.color = 'var(--cx-ui-danger)';
        apiJSON('GET', '/api/dashboards').then(function (r) {
          fillExamples('admin-ex-dash', r.dashboards, 'dashboards');

        apiJSON('GET', '/api/datasets').then(function (r) {
          fillExamples('admin-ex-ds', r.datasets, 'datasets');

      loadGovernance();
