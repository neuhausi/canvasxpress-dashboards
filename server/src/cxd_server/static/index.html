<!doctype html>
<html lang="en" data-cx-ui-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/favicon.png" />
  <title>CanvasXpress Dashboards — no-code builder</title>

  <!-- Generated from examples/builder.html by scripts/build.mjs. Do not edit. -->
  <!--CXD_HEAD_START-->
  <link href="https://www.canvasxpress.org/dist/canvasXpress.css" rel="stylesheet" />
  <script src="https://www.canvasxpress.org/dist/canvasXpress.min.js"></script>
  <!--CXD_HEAD_END-->
  <script src="canvasxpress-dashboards.umd.js"></script>

  <!-- Follow the website's style preset (canvasxpress.org palette icon): site-themes.css is
       GENERATED from the site's tokens (canvas-ai/tools/site-theme/gen-dashboards-themes.py)
       and maps each preset onto the --cx-ui-* roles; site-theme.js applies the visitor's
       saved pick (same-origin localStorage) before paint. Outside the CX-LIB block on
       purpose so scripts/build.mjs carries both into the served app shell. App-root-relative
       names (not ../), for the same /dashboards/ subpath reason as the bundle above. -->
  <link rel="stylesheet" href="site-themes.css" />
  <script src="site-theme.js"></script>

  <style>
    /* The shell's own names default to the shared CanvasXpress UI roles (canvasXpress.css / the
       dashboards token fallback); <html data-cx-ui-theme> switches them to the dark roles. */
    :root { --rail-bg: var(--cx-ui-surface); --rail-border: var(--cx-ui-border-subtle); --muted: var(--cx-ui-text-muted); --accent: var(--cx-ui-accent-strong); }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--cx-font-sans); background: var(--cx-ui-surface-sunken); color: var(--cx-ui-text); }

    .app { display: flex; min-height: 100vh; }

    /* Left icon nav rail (Databox-style) */
    .rail { flex: 0 0 220px; width: 220px; background: var(--rail-bg);
      border-right: 1px solid var(--rail-border); display: flex; flex-direction: column;
      padding: 14px 10px; position: sticky; top: 0; height: 100vh; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 16px; text-decoration: none; color: inherit; }
    .brand img { width: 32px; height: 32px; }
    .brand span { font-weight: 700; font-size: 18px; letter-spacing: -0.01em; }
    .rail nav { display: flex; flex-direction: column; gap: 2px; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 10px; border-radius: var(--cx-radius-md);
      color: var(--cx-ui-text); font-size:16px; cursor: pointer; text-decoration: none; }
    .nav-item .ic { width: 24px; text-align: center; font-size: 21px; }
    .nav-item:hover { background: var(--cx-ui-surface-sunken); }
    .nav-item.active { background: var(--cx-ui-accent-tint-subtle); color: var(--cx-ui-accent-strong); font-weight: 600; }
    .rail-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px 8px;
      border-top: 1px solid var(--rail-border); color: var(--muted); font-size:16px; }
    .rail-foot .avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--cx-ui-accent-strong);
      color: var(--cx-ui-on-accent); display: flex; align-items: center; justify-content: center; font-size:14px; font-weight: 700; }

    /* Main content */
    .content { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
    /* min-height fits the Builder's two-row toolbar, so the strip is the
       same height on every view (Builder / Dashboards / Settings). */
    .topstrip { display: flex; align-items: center; gap: 12px; padding: 10px 20px; min-height: 102px;
      border-bottom: 1px solid var(--rail-border); background: var(--cx-ui-surface); }
    .toolbar-host { width: 100%; }
    .view-title { margin: 0; font-size:16px; font-weight: 600; }
    .view { padding: 16px 20px 32px; }
    /* Home is document-like content — cap it to the same width the examples use
       (1400px) and centre it, so the hero and how-to images don't balloon on a
       large screen. Other views (Builder canvas, etc.) stay full width. */
    .home { max-width: 1400px; margin: 0 auto; }

    /* Home view */
    .hero { background: linear-gradient(120deg, var(--cx-ui-accent-tint-subtle), var(--cx-ui-surface-sunken)); border-radius: var(--cx-radius-lg);
      padding: 28px; margin-bottom: 20px; position: relative; }
    .hero-gh { position: absolute; top: 20px; right: 20px; color: var(--muted);
      opacity: .75; transition: opacity .15s, color .15s; }
    .hero-gh:hover { opacity: 1; color: var(--accent); }
    .hero-gh svg { width: 26px; height: 26px; display: block; fill: currentColor; }
    .hero h1 { margin: 0 0 6px; font-size: 26px; }
    .hero p { margin: 0 0 16px; color: var(--muted); font-size:16px; }
    .cta { padding: 10px 18px; background: var(--cx-ui-accent-strong); color: var(--cx-ui-on-accent); border: none;
      border-radius: var(--cx-radius-md); font-size:16px; font-weight: 600; cursor: pointer; }
    .cta:hover { background: var(--cx-ui-accent-hover); }
    /* Editorial layout: a 6-col grid with cards of varied widths. */
    /* align-items: stretch makes every card in a row take the tallest card's
       height, so each row lines up cleanly regardless of how the text wraps. */
    /* Flex-wrap (not a fixed grid) so a card that ends up alone on a row grows to
       fill the whole width. flex-grow is the card's size weight (2/3/4/6 of the old
       6-col model), so cards that DO share a row keep the same proportions, while a
       lone card stretches to 100%. flex-basis is the share minus a gap allowance so
       the same number of cards still fit per row. n-feature always takes its own row. */
    .notices { display: flex; flex-wrap: wrap; gap: 14px; align-items: stretch; }
    .notice.n-sm { flex: 2 1 calc(33.333% - 14px); }
    .notice.n-md { flex: 3 1 calc(50% - 14px); }
    .notice.cxb-n-40 { flex: 2 1 calc(40% - 14px); }
    .notice.cxb-n-60 { flex: 3 1 calc(60% - 14px); }
    .notice.n-lg { flex: 4 1 calc(66.667% - 14px); }
    .notice.n-feature { flex: 1 1 100%; }
    @media (max-width: 900px) { .notices .notice { flex-basis: 100%; } }
    .howto { display: flex; gap: 8px; align-items: stretch; margin: 0 0 22px; }
    .howto-step { flex: 1; min-width: 0; background: var(--rail-bg); border: 1px solid var(--rail-border);
      border-radius: var(--cx-radius-lg); padding: 14px; cursor: pointer; transition: box-shadow .15s, transform .15s; }
    .howto-step:hover { box-shadow: var(--cx-shadow-2); transform: translateY(-1px); }
    .howto-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .howto-n { width: 22px; height: 22px; border-radius: 50%; background: var(--cx-ui-accent-strong); color: var(--cx-ui-on-accent);
      font-size:16px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; }
    .howto-step h4 { margin: 0; font-size:16px; }
    .howto-step img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; object-position: top;
      border: 1px solid var(--rail-border); border-radius: var(--cx-radius-lg); background: var(--cx-ui-surface); }
    .howto-step p { margin: 10px 0 0; font-size:16px; color: var(--muted); line-height: 1.5; }
    .howto-arrow { align-self: center; font-size: 20px; color: var(--muted); flex: none; }
    @media (max-width: 1000px) { .howto { flex-direction: column; } .howto-arrow { transform: rotate(90deg); align-self: flex-start; margin-left: 24px; } }
    .notice { display: flex; gap: 12px; background: var(--cx-ui-surface); border: 1px solid var(--rail-border);
      border-radius: var(--cx-radius-lg); padding: 16px; }
    .notice .ni { font-size: 22px; line-height: 1; }
    .notice h3 { margin: 0 0 4px; font-size:16px; }
    .notice p { margin: 0; color: var(--muted); font-size:16px; line-height: 1.5; }
    /* Connector tags inside the "Live data" card — compact, monochrome, with icon. */
    .conn-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .conn-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px;
      font-weight: 500; letter-spacing: .1px; padding: 3px 9px; border: 1px solid var(--rail-border);
      border-radius: var(--cx-radius-md); background: transparent; color: var(--muted); white-space: nowrap; }
    .conn-chip .ci { font-size: 19px; line-height: 1; }
    .placeholder { padding: 60px 20px; text-align: center; color: var(--muted); }

    /* One side-panel width for every page with a left column (Builder, Dashboards,
       Data, Settings); the .cxd-left-resizer handle drags it, the app remembers it. */
    :root { --cxd-left-w: 320px; }
    .cxd-left-resizer { flex: none; align-self: stretch; width: 10px; margin: 0 -5px; position: relative;
      cursor: col-resize; touch-action: none; z-index: var(--cx-z-raised); }
    .cxd-left-resizer::after { content: ''; position: absolute; top: 0; bottom: 0; left: 4px; width: 2px;
      border-radius: var(--cx-radius-sm); background: transparent; transition: background .15s; }
    .cxd-left-resizer:hover::after, .cxd-left-resizer.cxd-dragging::after { background: var(--cx-ui-accent); }
    body.cxd-col-resizing { cursor: col-resize; user-select: none; }
    /* Settings view */
    .settings { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
    /* An outer panel (like the Dashboards list) holding one card per
       category. */
    .settings-form { flex: 0 0 var(--cxd-left-w); min-width: 0; box-sizing: border-box;
      background: var(--cx-ui-surface); border: 1px solid var(--rail-border); border-radius: var(--cx-radius-lg);
      padding: 10px; display: flex; flex-direction: column; gap: 12px; }
    .settings-form h3 { margin: 0 0 4px; font-size:16px; }
    /* Category cards get a slightly darker border than the inputs inside
       them, so the grouping reads at a glance. */
    .settings-card { background: var(--cx-ui-surface); border: 1px solid var(--cx-ui-border); border-radius: var(--cx-radius-lg);
      padding: 12px; display: flex; flex-direction: column; gap: 12px; }
    .settings-cat { margin: 0; font-size: 15px; font-weight: 700; }
    .settings-form label { display: flex; flex-direction: column; gap: 4px; font-size:14px;
      font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
    .settings-form input:not(:where([type=checkbox], [type=radio])), .settings-form select { padding: 6px 8px; border: 1px solid var(--rail-border);
      border-radius: var(--cx-radius-md); font: inherit; font-weight: 400; text-transform: none; color: inherit; background: var(--cx-ui-surface); }
    .settings-form input[type=color] { padding: 2px; height: 34px; }
    .settings-form .settings-field { display: flex; flex-direction: column; gap: 4px; }
    .settings-form .settings-lbl { font-size: 14px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .03em; color: var(--muted); }
    .settings-form .settings-inline { display: flex; align-items: center; gap: 10px; }
    .settings-form .settings-inline select { flex: 1 1 auto; min-width: 0; }
    .settings-form label.settings-check { flex-direction: row; align-items: center; gap: 6px;
      text-transform: none; letter-spacing: 0; font-weight: 400; color: inherit; white-space: nowrap; }
    .settings-form input:disabled { opacity: .5; cursor: not-allowed; }
    .settings-preview { flex: 1 1 380px; min-width: 320px; }
    .settings-preview #s-preview { border: 1px dashed var(--rail-border); border-radius: var(--cx-radius-lg); padding: 0 12px 12px; }

    /* Data view: dataset list + CanvasXpress table preview */
    .data-view { display: flex; gap: 16px; align-items: stretch; }
    /* Data page source sections (File / Database / Databricks): the header toggles the section. */
    .cxd-src-head { display: flex; align-items: center; gap: 6px; width: 100%; margin: 0 0 6px; padding: 3px 4px;
      border: none; background: none; color: var(--muted); font: inherit; font-size: 13px; font-weight: 600;
      text-transform: uppercase; text-align: left; cursor: pointer; }
    .cxd-src-head:hover { color: var(--cx-ui-text); background: var(--cx-ui-surface-sunken); border-radius: var(--cx-radius-md); }
    .cxd-src-chev { display: inline-flex; flex: none; color: var(--cx-ui-text); transition: transform .15s; }
    .cxd-src-collapsed .cxd-src-head { margin-bottom: 0; }
    .cxd-src-collapsed .cxd-src-chev { transform: rotate(-90deg); }
    .data-list { flex: 0 0 260px; width: 260px; box-sizing: border-box; align-self: flex-start; background: var(--cx-ui-surface);
      border: 1px solid var(--rail-border); border-radius: var(--cx-radius-lg); overflow: hidden; }
    /* Cards: breathing room on all sides instead of edge-to-edge rows. */
    .data-item { padding: 10px 12px; margin: 10px; border: 1px solid var(--rail-border);
      border-radius: var(--cx-radius-md); cursor: pointer; }
    .data-item + .data-item { margin-top: 0; }
    .data-item:hover { background: var(--cx-ui-surface-sunken); }
    .data-item.active { background: var(--cx-ui-accent-tint-subtle); border-color: var(--accent);
      /* muted text on the accent tint is below AA (dark 3.8:1): a selected card's secondary lines use the text colour */
      --muted: var(--cx-ui-text); }
    .data-item-title { font-weight: 600; font-size:16px; }
    .data-item-meta { color: var(--muted); font-size:14px; margin-top: 2px; }
    .data-preview { flex: 1 1 auto; min-width: 320px; background: var(--cx-ui-surface);
      border: 1px solid var(--rail-border); border-radius: var(--cx-radius-lg); padding: 12px; }
    .data-preview-title { font-weight: 600; margin-bottom: 10px; color: var(--cx-ui-text); }
    #data-canvas-host { height: calc(100vh - 220px); min-height: 460px; overflow: hidden; }
    .data-preview.drop-active { outline: 2px dashed var(--accent); outline-offset: -6px;
      background: var(--cx-ui-accent-tint-subtle); }
    .data-dropzone { border: 2px dashed var(--rail-border); border-radius: var(--cx-radius-lg);
      padding: 18px 14px; margin-top: 12px; text-align: center; color: var(--muted);
      font-size:16px; line-height: 1.5; background: transparent; }
    .data-dropzone .dz-icon { font-size: 22px; display: block; margin-bottom: 6px; }
    .data-dropzone strong { color: inherit; }
    .data-dropzone.drop-active { border-color: var(--accent); color: var(--accent);
      background: var(--cx-ui-accent-tint-subtle); }

    /* Dashboards view: bound the two columns to the viewport so the card list and
       the preview each scroll INDEPENDENTLY (like File Sources on the Data page).
       Selecting a dashboard low in the list no longer pushes the preview out of
       view — the preview stays put and keeps its own scroll. */
    .cxd-dash-view { height: calc(100vh - 170px); min-height: 460px; align-items: stretch; }
    .cxd-dash-view .cxd-dash-col { min-height: 0; }
    .cxd-dash-view #dash-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
    .cxd-dash-view #dash-preview { min-height: 0; overflow: auto; }

    /* Dark: <html data-cx-ui-theme="auto"> (follows the OS) swaps the --cx-ui-* roles these read; a
       dashboard sets its own theme on its container, and builder modals copy it. */
      .access-icon { font-size: 14px; cursor: help; vertical-align: middle; margin-left: 2px; }
      .admin-tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--rail-border); margin: 0 0 16px; }
    .admin-tab { padding: 8px 14px; border: none; border-bottom: 2px solid transparent; margin-bottom: -1px;
      background: none; color: var(--muted); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
    .admin-tab:hover { color: inherit; }
    .admin-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    /* The inline share box reads as a self-contained panel (a lighter surface
       sitting on the selected card's accent tint), with the same field styling
       as the rest of the app so it looks finished, not bolted on. */
    .cxd-share-box { background: var(--cx-ui-surface); border: 1px solid var(--rail-border);
      border-radius: var(--cx-radius-lg); padding: 12px; box-shadow: var(--cx-shadow-1); }
    .cxd-share-head { display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-bottom: 8px; font-size: 14px; }
    .cxd-share-head b { font-size: 14px; }
    .cxd-share-close { display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; padding: 0; font-size: 14px; line-height: 1; border-radius: var(--cx-radius-md);
      background: transparent; border: 1px solid var(--rail-border); color: var(--cx-ui-text-muted); cursor: pointer; }
    .cxd-share-close:hover { background: var(--cx-ui-surface-sunken); color: inherit; }
    /* Link row: a polished field + aligned action buttons (shared control height). */
    .cxd-share-link { width: 100%; box-sizing: border-box; height: 36px; padding: 0 10px;
      font: 13px/1.4 var(--cx-font-mono); color: inherit; background: var(--cx-ui-surface);
      border: 1px solid var(--rail-border); border-radius: var(--cx-radius-md); }
    .cxd-share-actions { display: flex; gap: 8px; margin-top: 8px; }
    .cxd-share-actions .cta { height: 34px; padding: 0 14px; font-size: 14px; border-radius: var(--cx-radius-md); }
    /* Publish & embed codes */
    .cxd-embed-codes { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--rail-border);
      font-size: 13px; max-width: 100%; }
    .cxd-embed-head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .cxd-embed-head b { font-size: 14px; }
    /* Match the app's field look (height, padding, surface, radius); the global
       select rule adds the chevron and its right-hand room. */
    .cxd-embed-pick { flex: 1; min-width: 0; max-width: 100%; height: 36px; box-sizing: border-box;
      padding: 0 32px 0 10px; font: 14px/1.4 var(--cx-font-sans); color: inherit;
      background-color: var(--cx-ui-surface); border: 1px solid var(--rail-border); border-radius: var(--cx-radius-md); }
    .cxd-embed-row { display: flex; gap: 8px; margin-top: 8px; align-items: stretch; }
    /* min-width:0 lets the textarea shrink inside the flex row instead of
       overflowing the card (flex items default to min-width:auto); box-sizing
       keeps padding inside the 100% width. */
    .cxd-embed-code { flex: 1; min-width: 0; max-width: 100%; box-sizing: border-box; resize: vertical;
      font: 12px/1.5 var(--cx-font-mono); color: inherit; background: var(--cx-ui-surface-sunken, var(--cx-ui-surface));
      border: 1px solid var(--rail-border); border-radius: var(--cx-radius-md); padding: 8px; }
    .cxd-embed-copy { align-self: flex-start; padding: 0 12px; height: 34px; font-size: 12px;
      white-space: nowrap; flex: none; border-radius: var(--cx-radius-md); }

    /* Shared filter-bar controls (Audit log, Schedules): one 36px height, one
       field look (surface, border, radius) and one button look, so these toolbars
       read like the rest of the app instead of raw native inputs/buttons. */
    .cxd-filterbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
    .cxd-control { height: 36px; box-sizing: border-box; padding: 0 10px; font: inherit; font-size: 14px;
      line-height: 1.4; color: inherit; background: var(--cx-ui-surface); border: 1px solid var(--rail-border);
      border-radius: var(--cx-radius-md); vertical-align: middle; }
    select.cxd-control { padding-right: 32px; }                 /* room for the chevron */
    textarea.cxd-control { height: auto; min-height: 36px; padding: 8px 10px; }
    .cxd-btn { display: inline-flex; align-items: center; justify-content: center; height: 36px; box-sizing: border-box;
      padding: 0 16px; font: inherit; font-size: 14px; font-weight: 600; line-height: 1; white-space: nowrap;
      border: 1px solid transparent; border-radius: var(--cx-radius-md); cursor: pointer; text-decoration: none;
      background: var(--cx-ui-accent-strong); color: var(--cx-ui-on-accent); }
    .cxd-btn:hover { background: var(--cx-ui-accent-hover); }
    .cxd-btn--ghost { background: transparent; border-color: var(--rail-border); color: inherit; }
    .cxd-btn--ghost:hover { background: var(--cx-ui-surface-sunken); }
    .cxd-btn:disabled { opacity: .55; cursor: not-allowed; }
    /* Every dropdown in the app draws the engine's chevron (two currentColor diagonals: it follows
       the text colour in light and dark), inset from the right border instead of on it, with room
       so the text never runs under it. The engine's own selects (customizer, data filter, its classed
       dropdowns) keep their styling; body.cX-UI-Controls is not one of them. */
    select:not([multiple]):not([size]):not([class*="cX-"]):not([class*="CanvasXpress"]):not(:where([class*="cX-Customizer"], [class*="cX-DataFilter"]) select) { -webkit-appearance: none; -moz-appearance: none; appearance: none;
      padding-right: 30px; cursor: pointer;
      background-image: linear-gradient(45deg, transparent 40%, currentColor 40%, currentColor 60%, transparent 60%), linear-gradient(-45deg, transparent 40%, currentColor 40%, currentColor 60%, transparent 60%);
      background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
    @media (forced-colors: active) { select { -webkit-appearance: auto; appearance: auto; background-image: none; } }
    /* Data-first wizard: Upload -> Check -> Visualize -> Publish */
    .cxd-wizard-steps { display: flex; gap: 6px; margin-bottom: 12px; font-size: 13px; }
    .cxd-wizard-step { padding: 3px 10px; border-radius: var(--cx-radius-lg); color: var(--cx-ui-text-muted); border: 1px solid var(--rail-border); }
    .cxd-wizard-step.cxd-wizard-step--active { color: var(--cx-ui-on-accent); background: var(--cx-ui-accent); border-color: var(--cx-ui-accent); }
    .cxd-wizard-field { display: block; margin: 0 0 12px; font-size: 14px; }
    /* Inputs and dropdowns share one box (same padding, border, font: same height), 6px under their label. */
    .cxd-wizard-field input[type=text], .cxd-wizard-field input[type=url], .cxd-wizard-field select, .cxd-wizard-field textarea { display: block; width: 100%; box-sizing: border-box; margin-top: 6px; padding: 8px 10px; font: 14px/1.4 var(--cx-font-sans); color: inherit; background-color: var(--cx-ui-surface); border: 1px solid var(--rail-border); border-radius: var(--cx-radius-md); }
    .cxd-wizard-field select { padding-right: 32px; }
    .cxd-wizard-field input[type=text], .cxd-wizard-field input[type=url], .cxd-wizard-field select { height: 38px; }
    .cxd-wizard-field br { display: none; }
    .cxd-wizard-field textarea { font: 13px var(--cx-font-mono); }
    .cxd-wizard-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
    .cxd-wizard-msg { min-height: 18px; font-size: 13px; color: var(--cx-ui-danger); }
    .cxd-wizard-note { font-size: 13px; color: var(--cx-ui-text-muted); }
    .cxd-wizard-profile { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 8px; }
    .cxd-wizard-profile th, .cxd-wizard-profile td { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--rail-border); }
    .cxd-wizard-bad { color: var(--cx-ui-danger); }
    .cxd-wizard-host { height: 220px; overflow: auto; }
    .cxd-wizard-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .cxd-wizard-card { border: 1px solid var(--rail-border); border-radius: var(--cx-radius-md); padding: 6px; cursor: pointer; font-size: 13px; }
    .cxd-wizard-card.cxd-wizard-card--chosen { border-color: var(--cx-ui-accent); box-shadow: var(--cx-shadow-sm); }
    .cxd-wizard-card-host { height: 150px; }
    .cxd-dbsrc-cols { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; max-height: 150px; overflow-y: auto; font-size: 13px; }
    .cxd-dbsrc-col { font: 13px var(--cx-font-mono); padding: 3px 8px; border: 1px solid var(--rail-border); border-radius: var(--cx-radius-md); background-color: var(--cx-ui-surface); color: inherit; cursor: pointer; }
    .cxd-dbsrc-col small { color: var(--cx-ui-text-muted); font-family: var(--cx-font-sans); }
    .cxd-dbsrc-col--on { border-color: var(--cx-ui-accent); box-shadow: inset 0 0 0 1px var(--cx-ui-accent); }
    .cxd-dbsrc-templates { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .cxd-dbsrc-params { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); column-gap: 12px; }
    .cxd-dbsrc-params > .cxd-wizard-note { grid-column: 1 / -1; margin-bottom: 6px; }
    .cxd-dbsrc-host { min-height: 40px; margin-top: 8px; }
    .cxd-dbwizard-cols { display: flex; gap: 18px; align-items: flex-start; }
    .cxd-dbwizard-fields { flex: 0 0 300px; min-width: 0; }
    .cxd-dbwizard-preview { flex: 1 1 auto; min-width: 0; min-height: 420px; }
    @media (max-width: 800px) { .cxd-dbwizard-cols { flex-direction: column; } .cxd-dbwizard-fields { flex-basis: auto; width: 100%; } }
    /* Databricks browser (Data page): same controls as the rest of the app, a quiet tree. */
    .cxd-dbx-top { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
    .cxd-dbx-top select { width: 100%; text-overflow: ellipsis; }
    .cxd-dbx-state { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); min-height: 16px; }
    .cxd-dbx-dot { width: 8px; height: 8px; border-radius: var(--cx-radius-round); background: var(--muted); flex: none; }
    .cxd-dbx-dot--on { background: var(--cx-ui-success); }
    .cxd-dbx-filter { width: 100%; height: 32px; margin: 6px 0 2px; font-size: 13px; }
    .cxd-dbx-count { font-size: 12px; color: var(--muted); margin: 0 2px 4px; }
    .cxd-dbx-row { display: flex; align-items: center; gap: 7px; padding: 5px 8px; border-radius: var(--cx-radius-md);
      cursor: pointer; font-size: 14px; min-width: 0; }
    .cxd-dbx-row:hover { background: var(--cx-ui-surface-sunken); }
    .cxd-dbx-row.active { background: var(--cx-ui-accent-tint-subtle); color: var(--accent); font-weight: 600; }
    .cxd-dbx-row svg { flex: none; width: 15px; height: 15px; color: var(--muted); fill: none; stroke: currentColor;
      stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .cxd-dbx-row.active svg { color: inherit; }
    .cxd-dbx-chev { flex: none; width: 10px; font-size: 9px; color: var(--muted); transition: transform .12s; }
    .cxd-dbx-row.cxd-is-open > .cxd-dbx-chev { transform: rotate(90deg); }
    .cxd-dbx-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cxd-dbx-tag { flex: none; font-size: 11px; font-weight: 400; color: var(--muted); border: 1px solid var(--rail-border);
      border-radius: var(--cx-radius-pill); padding: 0 7px; }
    .cxd-dbx-kids { margin-left: 13px; padding-left: 4px; border-left: 1px solid var(--rail-border); }
    .cxd-dbx-bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; align-items: center; }
    .cxd-db-card-btn { flex: 1; padding: 4px 10px; font-size: 14px; background: transparent; border: 1px solid var(--rail-border); color: var(--accent); }
    /* Dashboards page: search box + "what a dashboard uses" filter chips (tokens, no inline styles) */
    .cxb-dash-search-wrap { position: relative; flex: none; margin-bottom: 8px; }
    #dash-search { width: 100%; box-sizing: border-box; padding: 9px 40px 9px 10px; font: inherit; font-size: 15px; border: 1px solid var(--rail-border); border-radius: var(--cx-radius-md); }
    #dash-filter-btn { display: none; position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; padding: 0; border: 0; background: transparent; color: inherit; cursor: pointer; border-radius: var(--cx-radius-md); line-height: 1; }
    #dash-filter-btn.cxb-is-shown { display: block; }
    #dash-filter-badge { display: none; position: absolute; top: 0; right: 0; min-width: 15px; height: 15px; border-radius: var(--cx-radius-pill); background: var(--cx-ui-accent-strong); color: var(--cx-ui-on-accent); font-size: 10px; line-height: 15px; text-align: center; }
    #dash-filter-badge.cxb-is-shown { display: block; }
    #dash-chips { display: none; position: absolute; left: 100%; top: 0; margin-left: 10px; width: 260px; z-index: var(--cx-z-popover); flex-wrap: wrap; gap: 6px; padding: 10px; box-sizing: border-box; background: var(--cx-ui-surface); border: 1px solid var(--rail-border); border-radius: var(--cx-radius-md); box-shadow: var(--cx-shadow-2); }
    #dash-chips.cxb-is-open { display: flex; }
    .cxb-dash-chip { padding: 3px 10px; font-size: 13px; border-radius: var(--cx-radius-pill); border: 1px solid var(--rail-border); }
    .cxb-dash-chip.cxb-is-off { background: transparent; color: inherit; }
  </style>
</head>
<body class="cX-UI-Controls">
  <div class="app">
    <aside class="rail">
      <a class="brand" href="/" title="CanvasXpress home">
        <img src="https://www.canvasxpress.org/favicon.png" alt="CanvasXpress" />
        <span>CanvasXpress</span>
      </a>
      <nav>
        <a class="nav-item active" data-view="Home"><span class="ic">🏠</span> Home</a>
        <a class="nav-item" data-view="Builder"><span class="ic">🧩</span> Builder</a>
        <a class="nav-item" data-view="Dashboards"><span class="ic">📊</span> Dashboards</a>
        <a class="nav-item" data-view="Data"><span class="ic">🗂️</span> Data</a>
        <a class="nav-item" data-view="Schedules"><span class="ic">⏰</span> Schedules</a>
        <a class="nav-item" data-view="Settings"><span class="ic">⚙️</span> Settings</a>

        <a class="nav-item" data-view="Logs" id="nav-logs" style="display:none"><span class="ic">🧾</span> Logs</a>
        <a class="nav-item" href="/examples/index.html" id="nav-examples"><span class="ic">🧭</span> Examples</a>
      </nav>
      <div class="rail-foot" id="rail-foot">
        <span class="avatar" id="rail-avatar">?</span>
        <span id="rail-user" style="flex:1">Signed out</span>
        <a id="rail-auth" href="#" style="font-size:14px;color:var(--muted);text-decoration:none">Sign in</a>
      </div>
    </aside>

    <main class="content">
      <div class="topstrip">
        <div id="toolbar" class="toolbar-host"></div>
      </div>
      <div id="view" class="view"></div>
    </main>
  </div>

  <script>
    // A persistence client is optional: if the cxd_server isn't running on this
    // origin, Save will just report an error and everything else still works.
    //
    // The API base defaults to this page's own origin. If you serve builder.html
    // from a DIFFERENT origin than cxd_server (e.g. VS Code Live Server, or
    // `python -m http.server`, or file://), point it at the server explicitly
    // with `?api=` — e.g. builder.html?api=http://localhost:8000 — otherwise
    // /api/* requests hit the static server and 404.
    // Default the API base to the path prefix the app is mounted under, so the
    // same page works at / (dev server) and behind a reverse-proxy subpath
    // like /dashboards/ (e.g. canvasxpress.org).
    // The shell styles itself with the shared CanvasXpress UI roles (--cx-ui-*): inject the
    // dashboards stylesheet now, whose generated token fallback covers a page served with an
    // older canvasXpress.css (Home and other views never render a dashboard).
    if (window.CanvasXpressDashboards && CanvasXpressDashboards.injectStyles) {
      CanvasXpressDashboards.injectStyles(document);
    }
    var API_BASE = new URLSearchParams(location.search).get('api') ||
      location.pathname.replace(/\/(examples\/)?[^/]*$/, '');
    // Static markup can't embed API_BASE — fix up absolute links here.
    document.getElementById('nav-examples').href = API_BASE + '/examples/index.html';
    var client = CanvasXpressDashboards.createDashboardClient({ baseUrl: API_BASE });

    // Server-wide default data-function runtime (CXD_FUNCTIONS_RUNTIME_URL),
    // injected by the served app. A function source's own `runtime` still wins;
    // when neither is set, the local cxd_server endpoint is used.
    var FUNCTIONS_RUNTIME = (window.__CXD_CONFIG__ && window.__CXD_CONFIG__.functionsRuntime) || '';

    var CXD = CanvasXpressDashboards;

    // The working dashboard, shared across views (Builder edits it, Settings
    // tweaks its presentation). It starts EMPTY — no panels and no data
    // sources: the Assistant's "Datasets to use" checklist is the single
    // roster, and ticking a dataset there (or binding one via the Data view)
    // declares it as a spec source for panels to bind to.
    var currentSpec = CXD.blankSpec('my-dashboard', 'My Dashboard');

    // --- app shell: left-rail views drive the toolbar + canvas ---
    var toolbarEl = document.getElementById('toolbar');
    var viewEl = document.getElementById('view');
    var navItems = [].slice.call(document.querySelectorAll('.nav-item'));

    // --- Shared side-panel width. Every page with a left column (Builder,
    // Dashboards, Data, Settings) sizes it from --cxd-left-w; dragging any
    // .cxd-left-resizer sets it for all of them and remembers it in this browser.
    // Double-click resets. One delegated handler covers every page.
    var LEFT_W_KEY = 'cxd.leftPanelWidth';
    var LEFT_W_DEFAULT = 320;
    function clampLeftWidth(px) {
      var max = Math.max(260, Math.min(640, Math.round(window.innerWidth * 0.5)));
      return Math.max(240, Math.min(max, Math.round(px)));
    }
    function setLeftWidth(px, save) {
      var w = clampLeftWidth(px);
      document.documentElement.style.setProperty('--cxd-left-w', w + 'px');
      if (save) {
        try { localStorage.setItem(LEFT_W_KEY, String(w)); } catch (e) { /* not remembered */ }
      }
      return w;
    }
    (function restoreLeftWidth() {
      var saved = null;
      try { saved = parseInt(localStorage.getItem(LEFT_W_KEY), 10); } catch (e) { saved = null; }
      if (saved) setLeftWidth(saved, false);
    })();
    function leftWidthChanged() {
      // Charts and the builder stage re-fit to the new space.
      try { window.dispatchEvent(new Event('resize')); } catch (e) { /* old browser */ }
    }
    document.addEventListener('pointerdown', function (ev) {
      var handle = ev.target && ev.target.closest && ev.target.closest('.cxd-left-resizer');
      if (!handle || ev.button !== 0) return;
      var panel = handle.previousElementSibling;
      if (!panel) return;
      ev.preventDefault();
      var startX = ev.clientX;
      var startW = panel.getBoundingClientRect().width;
      handle.classList.add('cxd-dragging');
      document.body.classList.add('cxd-col-resizing');
      function move(e) { setLeftWidth(startW + (e.clientX - startX), false); }
      function up(e) {
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
        handle.classList.remove('cxd-dragging');
        document.body.classList.remove('cxd-col-resizing');
        setLeftWidth(startW + (e.clientX - startX), true);
        leftWidthChanged();
      }
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
    });
    document.addEventListener('dblclick', function (ev) {
      if (!(ev.target && ev.target.closest && ev.target.closest('.cxd-left-resizer'))) return;
      setLeftWidth(LEFT_W_DEFAULT, true);
      leftWidthChanged();
    });
    var currentBuilder = null;
    var currentPreview = null;
    var previewCollab = null;       // [comments, ask] handles for the inline View pane

    // The Comments / Ask pills default to the window's bottom-left; the inline
    // View has the nav + dashboard list there, so put them over the preview pane,
    // centered vertically in the strip between the pane and the window's bottom
    // (--cxd-pill-bottom, which the Reset cross-filter chip and Ask popup follow too).
    // Re-run on resize: the side-panel handle moves the pane.
    function placeCollabPills() {
      if (!previewCollab) return;
      var pane = document.getElementById('dash-preview');
      var ct = document.querySelector('.cxd-comments-toggle');
      var at = document.querySelector('.cxd-ask-toggle');
      var ap = document.querySelector('.cxd-ask-panel');
      var left = pane ? Math.round(pane.getBoundingClientRect().left) + 8 : 16;
      var bottom = 16;
      var pill = ct || at;
      if (pane && pill) {
        var strip = window.innerHeight - pane.getBoundingClientRect().bottom;
        var h = pill.getBoundingClientRect().height || 34;
        if (strip >= h + 8) bottom = Math.round((strip - h) / 2);
      }
      document.documentElement.style.setProperty('--cxd-pill-bottom', bottom + 'px');
      if (ct) ct.style.left = left + 'px';
      // Fixed offset clears the Comments pill with a small gap (its width
      // varies with the count badge, which loads async, so measuring is unreliable).
      if (at) at.style.left = (left + 150) + 'px';
      if (ap) ap.style.left = left + 'px';
      positionExportPill(left);
    }

    // Sit the "Export bundle" pill in the same bottom strip, to the right of the
    // Comments / Ask pills (or at the start when neither is present).
    function positionExportPill(left) {
      var eb = document.getElementById('dash-export-bundle');
      if (!eb || eb.style.display === 'none') return;
      if (left == null) {
        var pane = document.getElementById('dash-preview');
        left = pane ? Math.round(pane.getBoundingClientRect().left) + 8 : 16;
      }
      var hasComments = !!document.querySelector('.cxd-comments-toggle');
      var hasAsk = !!document.querySelector('.cxd-ask-toggle');
      var offset = hasAsk ? 300 : (hasComments ? 150 : 0);
      eb.style.left = (left + offset) + 'px';
    }
    window.addEventListener('resize', function () { positionExportPill(); });
    window.addEventListener('resize', function () { placeCollabPills(); });
    var directoryUsers = null;      // cached /api/directory users (for @mention highlighting)

    // Tear down the comments/Ask controls mounted for the inline View.
    function destroyPreviewCollab() {
      if (previewCollab) {
        previewCollab.forEach(function (h) { try { if (h && h.destroy) h.destroy(); } catch (e) {} });
        previewCollab = null;
        document.documentElement.style.removeProperty('--cxd-pill-bottom');
      }
      var eb = document.getElementById('dash-export-bundle');
      if (eb) { eb.style.display = 'none'; eb.onclick = null; }
    }

    // Mount the comments rail + Ask box for the dashboard shown in the inline
    // View pane (not the full-page Preview tab, which stays clean).
    function mountPreviewCollab(spec, summary) {
      destroyPreviewCollab();
      if (!currentUser || !CXD.mountComments) return;
      var owner = (summary && (summary.shared || summary.example)) ? summary.owner : null;
      var panels = Object.keys(spec.panels || {}).map(function (pid) {
        return { id: pid, title: (spec.panels[pid] || {}).title || pid };
      });
      function mount(users) {
        previewCollab = [];
        previewCollab.push(CXD.mountComments({
          baseUrl: API_BASE, dashboardId: spec.id, owner: owner,
          currentUser: currentUser, users: users || [], panels: panels
        }));
        if (CXD.mountAsk && currentPermissions.indexOf('llm.use') !== -1) {
          previewCollab.push(CXD.mountAsk({ baseUrl: API_BASE, dashboardId: spec.id, owner: owner }));
        }
        setTimeout(placeCollabPills, 0);
      }
      if (directoryUsers) { mount(directoryUsers); return; }
      fetch(API_BASE + '/api/directory', { credentials: 'include' })
        .then(function (r) { return r.ok ? r.json() : { users: [] }; })
        .then(function (d) { directoryUsers = (d && d.users) || []; mount(directoryUsers); })
        .catch(function () { mount([]); });
    }

    function teardown() {
      destroyPreviewCollab();
      if (currentBuilder) {
        // Capture the builder's latest spec (folds in live ⚙-customizer edits)
        // before destroying it, so other views see the current state.
        try { currentSpec = currentBuilder.getSpec(); } catch (e) {}
        try { currentBuilder.destroy(); } catch (e) {}
        currentBuilder = null;
      }
      if (currentPreview) { try { currentPreview.then(function (h) { if (h && h.destroy) h.destroy(); }); } catch (e) {} currentPreview = null; }
      destroyDataPreview();
      toolbarEl.innerHTML = '';
      toolbarEl.className = 'toolbar-host';   // strip any builder toolbar classes
      viewEl.innerHTML = '';
    }

    function notice(icon, title, bodyHtml, cls) {
      return '<div class="notice' + (cls ? ' ' + cls : '') + '"><div class="ni">' + icon +
             '</div><div><h3>' + title + '</h3><p>' + bodyHtml + '</p></div></div>';
    }

    function showHome() {
      teardown();
      toolbarEl.innerHTML = '<h2 class="view-title">Home</h2>';
      function step(n, img, title, body) {
        return '<div class="howto-step" data-goto="Builder">' +
          '<div class="howto-head"><span class="howto-n">' + n + '</span><h4>' + title + '</h4></div>' +
          '<img src="' + API_BASE + '/examples/assets/' + img + '?v=4" alt="' + title + '"/>' +
          '<p>' + body + '</p></div>';
      }
      // The connectors available through canvasxpress-connectors, as compact
      // monochrome tags with an icon. Keep in sync with cx_connectors/sources/*.
      var connectors = [
        ['🗄️', 'SQL databases'],
        ['🧱', 'Databricks'],
        ['❄️', 'Snowflake'],
        ['🔷', 'BigQuery'],
        ['📗', 'Google Sheets'],
        ['☁️', 'Salesforce'],
        ['🛎️', 'ServiceNow'],
        ['📈', 'Google Analytics'],
        ['💹', 'Finance feeds'],
        ['📌', 'Pins']
      ];
      var connChips = '<div class="conn-chips">' + connectors.map(function (c) {
        return '<span class="conn-chip"><span class="ci">' + c[0] + '</span>' + c[1] + '</span>';
      }).join('') + '</div>';

      viewEl.innerHTML =
        '<div class="home">' +
        '<div class="hero">' +
          '<a class="hero-gh" href="https://github.com/neuhausi/canvasxpress-dashboards" target="_blank" rel="noopener" title="View on GitHub" aria-label="View on GitHub">' +
            '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>' +
          '</a>' +
          '<h1>Welcome to CanvasXpress Dashboards</h1>' +
          '<p>Pick your data, say what you want, get a live dashboard — then refine it by hand or by chat, and share it.</p>' +
          '<button class="cta" id="home-create">+ Create a dashboard</button>' +
        '</div>' +
        '<div class="howto">' +
          step(1, 'home-step1-datasets.png', 'Pick your datasets',
               'Search and tick the data to use — here, the bench cohort’s survival table.') +
          '<div class="howto-arrow">➜</div>' +
          step(2, 'home-step2-chat.png', 'Describe what you want',
               '“Make a Kaplan–Meier plot — time and event, split by cluster.” It knows your columns.') +
          '<div class="howto-arrow">➜</div>' +
          step(3, 'home-step3-dashboard.png', 'Get a live dashboard',
               'The KM curves land on the canvas — coordinated, editable (⚙), saveable, shareable.') +
        '</div>' +
        '<div class="notices">' +
          notice('🎨', 'Edit every panel', 'Every panel opens the native CanvasXpress customizer — click the ⚙ to change chart type, colors, grouping and axes. Drag panels to reorder or resize them, and every change is saved with the dashboard. Prefer to describe it? Ask the chat assistant and it applies the tweak for you. Swap a panel’s dataset on the fly and the chart updates in place — no reload.', 'n-md') +
          notice('🔌', 'Connect your data', 'Bind panels to your own sources through <b>canvasxpress-connectors</b> — SQL warehouses, spreadsheets, business apps and finance feeds:' + connChips, 'n-md') +
          notice('🗄', 'Dashboard from database', 'Turn a database into an explorer like <b>GTEx Gene Explorer</b>: pick a connection, name the column whose values a Control lists, write the query that runs for the picked value (<code>WHERE gene = :gene</code>, always a bound parameter) and choose a chart from a live sample. Both queries are saved as your database sources, so they stay editable in <b>Data</b>; in the Builder, selecting the Control shows how it is wired, SQL included. <a href="#" class="home-dbwizard">Start the wizard</a>.', 'n-feature') +
          '<div id="home-dbx-notice" style="display:none">' +
            notice('🧱', 'Browse Databricks', 'Explore Unity Catalog from <b>Data → Databricks</b>: pick a SQL warehouse, open catalogs, schemas and tables, and preview a table’s columns and first 50 rows. <b>Save as source</b> or start a <b>Dashboard from this table</b>. On Posit Connect it reads Databricks as you, with your own grants; elsewhere it uses the server’s shared token. <a href="#" class="home-dbx">Open Data</a>.', 'n-feature') +
          '</div>' +
          notice('📡', 'Real-time streams', 'A panel can follow a stream as it happens: pick a 📡 stream in the panel’s <b>Data</b> list, set how many samples to keep and how often to update, and the chart slides forward with each new reading — no reload, one redraw per frame however fast data arrives. The browser never holds a credential, and every subscription is recorded in the audit log. <a href="' + API_BASE + '/examples/live-ops.html">See it in Live Ops</a> · <a href="https://github.com/neuhausi/canvasxpress-dashboards/blob/main/docs/live-streaming.md" target="_blank" rel="noopener">How it works</a>.', 'n-feature') +
          notice('🧩', 'Blend and link sources', 'Link related sources in <b>🔗 Links</b>: pick each source and its key, and selecting an order marks its customer everywhere. Join two sources from <b>+ Data → Join two sources</b>. Filter the whole board from one <b>Filters</b> panel with saved schemes. No JSON needed. <a href="' + API_BASE + '/examples/cohort-explorer.html">See it in the Cohort Explorer</a>.', 'n-md') +

    function refitDataPreview() {

      host.style.width = want + 'px';   // the preview functions measure the host
      previewWidth = want;              // later previews use the new width too
      if (lastDataPreview) lastDataPreview();
      else {
        var canvas = document.getElementById(dataPreviewInstance.target);
        CXD.resizeInstance(dataPreviewInstance, want, canvas ? canvas.getBoundingClientRect().height || 460 : 460);
      }

    // Data page: each source section (File / Database / Databricks) collapses to
    // its header. A collapsed card keeps only the header (its own height and flex
    // are saved and restored); the File/Database splitter hides while either of
    // them is collapsed. Remembered per browser (a per-viewer convenience).
    var SRC_COLLAPSE_KEY = 'cxd.data.collapsedSources';
    function wireSourceCollapse() {
      var saved = {};
      try { saved = JSON.parse(localStorage.getItem(SRC_COLLAPSE_KEY) || '{}') || {}; } catch (e) { saved = {}; }
      function remember(id, collapsed) {
        try {
          if (collapsed) saved[id] = true; else delete saved[id];
          localStorage.setItem(SRC_COLLAPSE_KEY, JSON.stringify(saved));
        } catch (e) { /* storage unavailable: still toggles */ }
      }
      function syncSplitter() {
        var splitter = document.getElementById('data-splitter');
        var files = document.getElementById('file-sources');
        var db = document.getElementById('db-sources');
        if (!splitter || !files || !db) return;
        var either = files.classList.contains('cxd-src-collapsed') || db.classList.contains('cxd-src-collapsed');
        // Keep its space (it is also the gap between the two cards); just hide it.
        splitter.style.visibility = either ? 'hidden' : '';
      }
      function setCollapsed(card, collapsed) {
        var head = card.querySelector('.cxd-src-head');
        if (collapsed === card.classList.contains('cxd-src-collapsed')) return;
        if (collapsed) {
          // Keep whatever size the card has now (the splitter may have resized it).
          card.setAttribute('data-size', JSON.stringify({ height: card.style.height, minHeight: card.style.minHeight, flex: card.style.flex }));
          card.style.height = 'auto';
          card.style.minHeight = '0';
          card.style.flex = 'none';
        } else {
          var size = {};
          try { size = JSON.parse(card.getAttribute('data-size') || '{}'); } catch (e) { size = {}; }
          card.style.height = size.height || '';
          card.style.minHeight = size.minHeight || '';
          card.style.flex = size.flex || '';
        }
        card.classList.toggle('cxd-src-collapsed', collapsed);
        [].forEach.call(card.children, function (child) {
          if (child === head) return;
          if (collapsed) {
            child.setAttribute('data-display', child.style.display);   // e.g. a flex row
            child.style.display = 'none';
          } else {
            child.style.display = child.getAttribute('data-display') || '';
            child.removeAttribute('data-display');
          }
        });
        if (head) head.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
        syncSplitter();
      }
      ['file-sources', 'db-sources', 'dbx-sources'].forEach(function (id) {
        var card = document.getElementById(id);
        var head = card && card.querySelector('.cxd-src-head');
        if (!head) return;
        head.title = 'Collapse or expand';
        head.onclick = function () {
          var collapsed = !card.classList.contains('cxd-src-collapsed');
          setCollapsed(card, collapsed);
          remember(id, collapsed);
        };
        if (saved[id]) setCollapsed(card, true);
      });
    }

    // Dialog to import a dataset into the store from a file, pasted text, or an
    // external URL / connector (restores the old "+ Data" dialog capabilities).
    function openAddDataDialog() {
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:var(--cx-ui-backdrop);display:flex;' +
        'align-items:center;justify-content:center;z-index:var(--cx-z-modal)';

        '<label style="display:block;font-size:14px;font-weight:700;text-transform:uppercase;color:var(--muted);margin:4px 0 2px">Name</label>' +
        '<input id="ad-name" style="width:100%;padding:8px;box-sizing:border-box" placeholder="e.g. my-data"/>' +
        '<label style="display:block;font-size:14px;font-weight:700;text-transform:uppercase;color:var(--muted);margin:12px 0 2px">Source</label>' +
        '<select id="ad-type" style="width:100%;padding:8px;padding-right:32px;box-sizing:border-box">' +
          '<option value="file">Upload CSV / JSON file</option>' +
          '<option value="csv">Paste CSV</option>' +
          '<option value="url">External URL / connector</option>' +
        '</select>' +
        '<div id="ad-body" style="margin-top:10px"></div>' +
        '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">' +
          '<button class="cta" id="ad-cancel" style="background:transparent;border:1px solid var(--rail-border);color:inherit">Cancel</button>' +
          '<button class="cta" id="ad-add">Add</button>' +
        '</div>';
      document.body.appendChild(overlay);
      overlay.appendChild(modal);

      var nameEl = modal.querySelector('#ad-name');
      var typeEl = modal.querySelector('#ad-type');
      var bodyEl = modal.querySelector('#ad-body');
      var errEl = modal.querySelector('#ad-err');
      var addEl = modal.querySelector('#ad-add');
      function fail(m) { errEl.textContent = m; addEl.disabled = false; addEl.textContent = 'Add'; }

        url:  '<input id="ad-url" type="text" placeholder="https://host/api/data?source=… (sent with your session cookie)" style="' + INPUT + '">'
      };

      modal.querySelector('#ad-cancel').onclick = close;
      overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });

      addEl.onclick = function () {
        var name = (nameEl.value || '').trim();
        var type = typeEl.value;

          close(); loadDataList();

        };

        } else if (type === 'csv' || type === 'json') {

            return r.json();

    // Make a container a drop target: dropping a valid CanvasXpress input
    // (CSV / TSV / CanvasXpress JSON) imports it into the store and previews it.
    function setupDropZone(pane) {
      if (!pane) return;
      function stop(e) { e.preventDefault(); e.stopPropagation(); }
      // Capture phase so we intercept before any CanvasXpress canvas handler.
      pane.addEventListener('dragenter', function (e) { stop(e); pane.classList.add('drop-active'); }, true);
      pane.addEventListener('dragover', function (e) {
        stop(e); if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy'; pane.classList.add('drop-active');
      }, true);
      pane.addEventListener('dragleave', function (e) {
        stop(e); if (!pane.contains(e.relatedTarget)) pane.classList.remove('drop-active');
      }, true);
      pane.addEventListener('drop', function (e) {
        stop(e); pane.classList.remove('drop-active');
        var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (!f) return;
        // Delimited text (CSV/TSV) ALWAYS uploads directly: the server stores it
        // as a raw 2D array, so CanvasXpress's own ingest (arrayToCX) runs on
        // every render and content auto-detection — e.g. an oncoprint gene ×
        // sample alteration matrix — keeps working. Routing it through the live
        // preview instance's loadFile instead made the engine interpret the file
        // RELATIVE to the currently previewed dataset (metadata merge / "not a
        // valid file" alerts) and stored a flattened {y} object that bypasses
        // auto-detection. Only PNGs (engine-encoded) and CanvasXpress JSON
        // ({data, config} exports) still need the engine to decode them.
        if (/\.(csv|tsv|tab|txt)$/i.test(f.name || '')) {
          importDataFile(f);
        } else if (dataPreviewInstance && typeof dataPreviewInstance.loadFile === 'function') {
          loadDroppedFileViaCanvasXpress(e.dataTransfer, f);
        } else if (/\.png$/i.test(f.name || '')) {
          bootstrapPreviewInstance(function () {
            loadDroppedFileViaCanvasXpress(e.dataTransfer, f);
          });
        } else {
          importDataFile(f);
        }
      }, true);
    }

    // Create a minimal hidden table instance so CanvasXpress's loadFile can
    // decode a dropped file (needed for CanvasXpress PNGs, which embed their
    // data/config in metadata only CanvasXpress can read).
    function bootstrapPreviewInstance(cb) {
      var host = document.getElementById('data-canvas-host');
      if (!host || !window.CanvasXpress) return;
      host.innerHTML = '';
      var canvas = document.createElement('canvas');
      canvas.id = 'data-preview-bootstrap-' + Date.now();
      var width = Math.max(320, host.clientWidth || 640);
      canvas.setAttribute('width', width);
      canvas.setAttribute('height', 460);
      canvas.style.width = width + 'px';
      canvas.style.height = '460px';
      host.appendChild(canvas);
      dataPreviewInstance = new window.CanvasXpress(canvas.id,
        { y: { vars: ['-'], smps: ['-'], data: [[0]] } },
        { view: 'table', resizable: false }, {});
      cb();
    }

    // Hand a dropped file to CanvasXpress: it parses + updates the visible table,
    // then its callback gives us the loaded data, which we persist to the store
    // and re-preview cleanly from there.
    function loadDroppedFileViaCanvasXpress(dataTransfer, file) {
      var titleEl = document.getElementById('data-title');
      if (titleEl) titleEl.textContent = 'Reading “' + (file.name || 'file') + '” …';
      var title = (file.name || 'dataset').replace(/\.[^.]+$/, '');
      // Read the file's own config first (a CanvasXpress JSON is {data, config});
      // a File stays valid across the async read, so it's passed to loadFile below.
      readFileConfig(file, function (fileConfig) {
        // loadFile(event, isFlag, callback, providedFile, asTable): asTable forces
        // a table view; the callback receives the new instance.
        dataPreviewInstance.loadFile(dataTransfer, false, function (newInstance) {
          dataPreviewInstance = newInstance;   // track for cleanup on the next preview
          var data = newInstance && newInstance.data;
          if (!data || !data.y) {
            if (titleEl) titleEl.textContent = 'That file isn’t a dataset CanvasXpress can load.';
            return;
          }
          // Associate any graph config the file carried (a CanvasXpress JSON's
          // graphType/etc.) so panels bound to this dataset adopt it as their
          // first state. Prefer the file's config; else the parsed instance's.
          var config = fileConfig ||
            cleanConfig(typeof newInstance.getConfig === 'function' ? newInstance.getConfig() : null);
          var opts = { format: 'cx', title: title };
          if (config && Object.keys(config).length) opts.config = config;
          client.uploadDataset({ y: data.y, x: data.x }, opts).then(function (summary) {
            loadDataList(summary && summary.id);   // list + select + clean re-render
          }, function (err) {
            window.alert('Loaded into the table but couldn’t store it: ' + (err && err.message || err));
          });
        }, file, true);
      });
    }

    // Read a dropped CanvasXpress JSON's own `config` ({data, config}); non-JSON
    // files resolve to null (their config, if any, comes from the parsed instance).
    function readFileConfig(file, doneCb) {
      var name = (file.name || '').toLowerCase();
      var looksJson = /\.(json|cx)$/.test(name) || (file.type || '').indexOf('json') >= 0;
      if (!looksJson || typeof FileReader === 'undefined') { doneCb(null); return; }
      var reader = new FileReader();
      reader.onload = function () {
        var cfg = null;
        try {
          var obj = JSON.parse(reader.result);
          if (obj && obj.config && typeof obj.config === 'object') cfg = cleanConfig(obj.config);
        } catch (e) { cfg = null; }
        doneCb(cfg);
      };
      reader.onerror = function () { doneCb(null); };
      reader.readAsText(file);
    }

    // Drop config values carrying CanvasXpress's internal "__FACTOR__" sentinel
    // (derived grouping state that breaks a re-render with fresh data).
    function cleanConfig(config) {
      if (!config || typeof config !== 'object') return null;
      var out = {};
      Object.keys(config).forEach(function (k) {
        try {
          if (JSON.stringify(config[k]).indexOf('__FACTOR__') < 0) out[k] = config[k];
        } catch (e) { /* skip unserializable */ }
      });
      return out;
    }

    // Convert tab-delimited text to CSV (quoting cells with commas/quotes).
    function tsvToCsv(text) {
      return text.split(/\r?\n/).map(function (line) {
        return line.split('\t').map(function (c) {
          return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c;
        }).join(',');
      }).join('\n');
    }

    // Import a dropped file into the store, detecting the format from its
    // extension (falling back to content sniffing), then refresh + preview it.
    function importDataFile(file) {
      var name = (file.name || '').toLowerCase();
      var title = (file.name || 'dataset').replace(/\.[^.]+$/, '');
      var titleEl = document.getElementById('data-title');
      if (titleEl) titleEl.textContent = 'Importing “' + (file.name || 'dataset') + '” …';
      function done(summary) { loadDataList(); if (summary && summary.id) previewDataset(summary); }
      function failMsg(e) {
        window.alert('Import failed: ' + (e && e.message || e));
        if (titleEl) titleEl.textContent = 'Select a dataset to preview it — or drop a file here to import.';
      }

      if (/\.png$/.test(name)) {
        return failMsg(new Error('PNG import isn’t supported here yet — use CSV, TSV, or CanvasXpress JSON.'));
      }
      if (/\.csv$/.test(name)) {
        return client.uploadDataset(file, { format: 'csv', title: title }).then(done, failMsg);
      }
      if (/\.(tsv|tab)$/.test(name)) {
        return file.text().then(function (t) {
          return client.uploadDataset(tsvToCsv(t), { format: 'csv', title: title });
        }).then(done, failMsg);
      }
      if (/\.(json|cx)$/.test(name)) {
        return client.uploadDataset(file, { format: 'json', title: title }).then(done, failMsg);
      }
      // Unknown/no extension → sniff the content.
      file.text().then(function (t) {
        var s = t.replace(/^\uFEFF/, '').trim();
        if (s.charAt(0) === '{' || s.charAt(0) === '[') {
          return client.uploadDataset(t, { format: 'json', title: title });
        }
        var firstLine = s.split(/\r?\n/)[0] || '';
        if (firstLine.indexOf('\t') >= 0 && firstLine.indexOf(',') < 0) {
          return client.uploadDataset(tsvToCsv(t), { format: 'csv', title: title });
        }
        return client.uploadDataset(t, { format: 'csv', title: title });
      }).then(done, failMsg);
    }

    // ---- authentication -------------------------------------------------------
    // The dashboard/dataset APIs are per-user (session cookie). currentUser holds
    // the signed-in username (null when signed out) and drives the footer + guards.
    var currentUser = null;
    var isAdmin = false;
    var currentPermissions = [];   // from /auth/me (the server enforces them)
    var currentBrand = null;       // organisation brand (CXD_BRAND), from /auth/me
    var brandLocked = false;       // true when the server forces the brand on your saves
    var currentOwner = null;       // owner of a shared dashboard open for editing
    var DEMO_USER = 'demo', DEMO_PASS = 'demo1234';

    // Sync the sidebar footer + admin nav to the current auth state.
    function renderUserChip() {
      var avatar = document.getElementById('rail-avatar');
      var label = document.getElementById('rail-user');
      var link = document.getElementById('rail-auth');
      var adminNav = document.getElementById('nav-admin');
      if (currentUser) {
        avatar.textContent = currentUser.slice(0, 2).toUpperCase();
        label.textContent = currentUser;
        link.textContent = 'Sign out';
      } else {
        avatar.textContent = '?';
        label.textContent = 'Signed out';
        link.textContent = 'Sign in';
      }
      // The Admin view is only reachable when the server marks you an admin
      // (CXD_ADMINS). Hiding the nav is cosmetic — the API enforces it too.
      if (adminNav) adminNav.style.display = isAdmin ? '' : 'none';
      // The Logs view (chart-engine request/response log) is server-gated via
      // CXD_LOGS_PANEL + CXD_MCP_LOG, and additionally admin-only in the UI.
      if (currentUser && isAdmin) {
        fetch(API_BASE + '/api/llm/status', { credentials: 'include' })
          .then(function (r) { return r.json(); })
          .then(function (st) {
            var nav = document.getElementById('nav-logs');
            if (nav) nav.style.display = st.logsPanel ? '' : 'none';
          }).catch(function () {});
      } else {
        var logsNav = document.getElementById('nav-logs');
        if (logsNav) logsNav.style.display = 'none';
      }
    }

    // Ask the server who we are and reflect it in the UI. Safe with no server.
    function refreshUser() {
      return client.me().then(function (r) {
        currentUser = (r && r.user) || null;
        isAdmin = !!(r && r.is_admin);
        currentPermissions = (r && r.permissions) || [];
        currentBrand = (r && r.brand) || null;
        brandLocked = !!(r && r.brandLocked);
        directoryCache = null;
        renderUserChip();
        return currentUser;
      }, function () { currentUser = null; isAdmin = false; renderUserChip(); return null; });
    }

    function doLogout() {
      client.logout().catch(function () {}).then(function (r) {
        currentUser = null; isAdmin = false; renderUserChip();
        // Signed in with single sign-on: end the provider's session too.
        if (r && r.logout_url) { location.href = r.logout_url; return; }
        activate('Home');
      });
    }

    // The Login view: sign in, create an account, or one-click demo login. The
    // demo button is the "fake" login — it signs in `demo/demo1234`, creating the
    // user on first run (works out of the box when the server allows signup).
    function showLogin(nextView) {
      teardown();
      toolbarEl.innerHTML = '<h2 class="view-title">Sign in</h2>';
      viewEl.innerHTML =

          '<div id="login-sso-or" style="display:none;text-align:center;color:var(--muted);font-size:14px;margin-bottom:6px">or with a password</div>' +
          '<div id="login-password">' +

          '</div>' +

          '</div>' +
          '<a href="#" id="login-breakglass" style="display:none;font-size:13px;color:var(--muted)">Administrator password sign-in</a>' +
        '</div>';
      // Single sign-on and the password form follow the server's /auth/config.
      fetch(API_BASE + '/auth/config', { credentials: 'include' }).then(function (r) { return r.json(); }).then(function (cfg) {
        var sso = document.getElementById('login-sso');
        if (cfg.oidc && cfg.oidc.enabled) {

          link.onclick = function (e) { e.preventDefault(); form.style.display = ''; link.style.display = 'none'; };
        }
      }).catch(function () { /* older server: password only */ });

      var userEl = document.getElementById('login-user');
      var passEl = document.getElementById('login-pass');
      var errEl = document.getElementById('login-err');
      function fail(err) { errEl.textContent = (err && err.message) || String(err) || 'Sign-in failed.'; }
      function done() {
        var target = nextView && nextView !== 'Home' ? nextView : (pendingView || 'Home');
        pendingView = null;
        activate(target);
      }
      function afterAuth(promise) {
        errEl.textContent = '';
        return promise.then(function (r) {
          currentUser = (r && r.user) || null;
          if (!currentUser) return fail('Sign-in failed.');
          // login/signup don't return is_admin — refresh to pick it up, then go.
          return refreshUser().then(done);
        }, fail);
      }
      document.getElementById('login-go').onclick = function () {
        afterAuth(client.login(userEl.value.trim(), passEl.value));
      };
      document.getElementById('login-signup').onclick = function () {
        afterAuth(client.signup(userEl.value.trim(), passEl.value));
      };
      document.getElementById('login-demo').onclick = function () {
        afterAuth(client.login(DEMO_USER, DEMO_PASS).catch(function () {
          return client.signup(DEMO_USER, DEMO_PASS);
        }));
      };
      passEl.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') document.getElementById('login-go').click();
      });
    }

          '<table class="audit-table" style="width:100%;border-collapse:collapse;font-size:13px">' +
            '<thead><tr style="text-align:left;position:sticky;top:0;background:var(--cx-ui-surface-sunken)">' +
              '<th style="padding:6px 8px">Time (UTC)</th><th style="padding:6px 8px">User</th>' +
              '<th style="padding:6px 8px">Action</th><th style="padding:6px 8px">Target</th>' +
              '<th style="padding:6px 8px">Outcome</th><th style="padding:6px 8px">Details</th></tr></thead>' +
