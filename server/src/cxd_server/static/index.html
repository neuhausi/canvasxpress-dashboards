    // List the datasets and auto-select one so a table is always visible: the
    // requested `selectId`, else the previously-selected dataset, else the first.
    // Filter a card list (Data / Dashboards) by its items' data-search text —
    // same behavior as the Builder's dataset search box.
    function wireListSearch(inputId, listId) {
      var input = document.getElementById(inputId);
      var listEl = document.getElementById(listId);
      if (!input || !listEl) return;
      input.oninput = function () {
        var q = input.value.trim().toLowerCase();
        listEl.querySelectorAll('.data-item').forEach(function (row) {
          var hay = row.getAttribute('data-search') || '';
          row.style.display = ((!q || hay.indexOf(q) !== -1) && !row.getAttribute('data-chip-hide')) ? '' : 'none';
        });
      };
      if (input.value) input.oninput();   // re-apply after a list reload
    }

    // --- Database sources: the canvasxpress-connectors BYO app mounted at
    // /connectors, with a BRIDGED session — the user signs in once (to this
    // app); we fetch a derived credential and log into the connectors app
    // behind the scenes. Connection strings are stored server-side, encrypted.
    var connectorsBridge = null;   // Promise: resolves once cxc_session is set

    function ensureConnectorsSession() {
      if (connectorsBridge) return connectorsBridge;
      connectorsBridge = fetch(API_BASE + '/api/connectors/credentials', { credentials: 'include' })
        .then(function (r) { if (!r.ok) throw new Error('bridge: HTTP ' + r.status); return r.json(); })
        .then(function (cred) {
          return fetch(API_BASE + '/connectors/auth/login', {
            method: 'POST', credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(cred)
          });
        })
        .then(function (r) { if (!r.ok) throw new Error('login: HTTP ' + r.status); });
      connectorsBridge.catch(function () { connectorsBridge = null; });  // retry next time
      return connectorsBridge;
    }

    function connectorsApi(path, opts) {
      return ensureConnectorsSession().then(function () {
        return fetch(API_BASE + '/connectors' + path, Object.assign({ credentials: 'include' }, opts || {}));
      }).then(function (r) {
        return r.json().then(function (body) {
          if (!r.ok) throw new Error(body && body.detail || ('HTTP ' + r.status));
          return body;
        });
      });
    }

    function loadDbSources() {
      var listEl = document.getElementById('db-source-list');
      if (!listEl) return;
      // The bridged meta endpoint carries updated_at + a credential-free
      // location; fall back to the plain names list if it's unavailable.
      ensureConnectorsSession().then(function () {
        return fetch(API_BASE + '/api/connectors/sources-meta', { credentials: 'include' })
          .then(function (r) { return r.json().then(function (body) { if (!r.ok) throw new Error(body.detail || r.status); return body; }); });
      }).catch(function () { return connectorsApi('/api/sources').then(function (res) {
          return { sources: (res.sources || []).map(function (n) { return { name: n }; }) }; });
      }).then(function (res) {
        if (document.getElementById('db-source-list') !== listEl) return;
        var sources = res.sources || [];
        listEl.innerHTML = '';
        if (!sources.length) {
          listEl.innerHTML = '<div class="placeholder" style="padding:4px 0">No sources yet — click “+ Database”.</div>';
          return;
        }
        sources.forEach(function (src) {
          var name = src.name;
          var row = document.createElement('div');
          row.style.cssText = 'display:flex;align-items:flex-start;gap:6px;padding:6px 8px;' +
            'border:1px solid var(--rail-border);border-radius:var(--cx-radius-md);cursor:pointer';
          // Same presentation as the dataset cards: bold title, muted meta
          // line underneath (rows×cols · location · date).
          var bits = [];
          if (src.location) bits.push(esc(src.location));
          if (src.updated_at) bits.push(esc(String(src.updated_at).slice(0, 10)));
          var label = document.createElement('span');
          label.style.cssText = 'flex:1;min-width:0;overflow:hidden';
          label.innerHTML =
            '<div class="data-item-title">🗄 ' + esc(name) + '</div>' +
            '<div class="data-item-meta"><span data-dims="1" data-sep="' + (bits.length ? ' · ' : '') + '"></span>' + bits.join(' · ') + '</div>';
          fillDbSourceDims(name, label.querySelector('[data-dims]'));
          var edit = document.createElement('button');
          edit.textContent = '✎';
          edit.className = 'cX-Button cX-Button--icon';
          edit.title = 'Edit source';
          edit.style.cssText = 'border:none;background:transparent;color:var(--muted);font-size:15px;cursor:pointer;padding:0 2px';
          edit.onclick = function (ev) { ev.stopPropagation(); editDbSource(name); };
          var del = document.createElement('button');
          del.textContent = '×';
          del.className = 'cX-Button cX-Button--icon';
          del.title = 'Delete source';
          del.style.cssText = 'border:none;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;padding:0 2px';
          del.onclick = function (ev) {
            ev.stopPropagation();
            if (!window.confirm('Delete database source “' + name + '”?')) return;
            connectorsApi('/api/sources/' + encodeURIComponent(name), { method: 'DELETE' })
              .then(loadDbSources, function (e) { window.alert('Delete failed: ' + e.message); });
          };
          row.appendChild(label);
          row.appendChild(edit);
          row.appendChild(del);
          row.onclick = function () { previewConnectorSource(name); };
          listEl.appendChild(row);
        });
      }, function (err) {
        listEl.innerHTML = '<div class="placeholder" style="padding:4px 0">Database sources unavailable.<br><small>' + esc(err.message) + '</small></div>';
      });
    }

    // --- Databricks catalog browser (Data page). Hidden unless the server has
    // CXD_DATABRICKS_HOST. Every call runs as the viewer (Posit Connect) or the
    // shared token, decided server-side; nothing about the token reaches here.
    var DBX = '/api/connectors/databricks/';
    var dbxViewerOauth = true;   // false off Posit Connect: saved sources carry a token placeholder
    function dbxApi(path, params, body) {
      var qs = Object.keys(params || {}).map(function (k) { return k + '=' + encodeURIComponent(params[k]); }).join('&');
      return ensureConnectorsSession().then(function () {
        return fetch(API_BASE + DBX + path + (qs ? '?' + qs : ''), body === undefined ? { credentials: 'include' } : {
          method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      }).then(function (r) {
        return r.json().then(function (b) { if (!r.ok) throw new Error(b && b.detail || ('HTTP ' + r.status)); return b; });
      });
    }

    function setupDatabricks() {
      var card = document.getElementById('dbx-sources');
      var pick = document.getElementById('dbx-warehouse');
      var tree = document.getElementById('dbx-tree');
      if (!card) return;
      var storeKey = 'cxd-dbx-warehouse:' + (currentUser || '');
      dbxApi('config').then(function (cfg) {
        if (!cfg.enabled) return;
        dbxViewerOauth = !!cfg.viewer_oauth;
        card.style.display = 'flex';
        return dbxApi('warehouses').then(function (res) {
          var list = res.warehouses || [];
          pick.innerHTML = '';
          list.forEach(function (w) {
            var o = document.createElement('option');
            o.value = w.id;
            o.textContent = w.name;
            pick.appendChild(o);
          });
          function showState() {
            var w = list.filter(function (x) { return x.id === pick.value; })[0];
            var stateEl = document.getElementById('dbx-state');
            if (!w || !stateEl) return;
            var on = w.state === 'RUNNING';
            stateEl.innerHTML = '<span class="cxd-dbx-dot' + (on ? ' cxd-dbx-dot--on' : '') + '"></span>' +
              esc(on ? 'Running' : w.state.charAt(0) + w.state.slice(1).toLowerCase() + ' — starts on first query');
            pick.title = w.name;
          }
          if (!list.length) { tree.innerHTML = '<div class="placeholder">No SQL warehouses available to you.</div>'; return; }
          var saved = ''; try { saved = localStorage.getItem(storeKey) || ''; } catch (e) { /* storage blocked */ }
          if (saved && list.some(function (w) { return w.id === saved; })) pick.value = saved;
          pick.onchange = function () {
            try { localStorage.setItem(storeKey, pick.value); } catch (e) { /* storage blocked */ }
            showState();
            drawCatalogs();
          };
          showState();
          drawCatalogs();
        });
      }).catch(function (e) {
        // Hidden only when not configured; an auth/Databricks problem is shown, not swallowed.
        if (/not configured/i.test(e.message)) return;
        card.style.display = 'flex';
        tree.innerHTML = '<div class="placeholder">Databricks unavailable.<br><small>' + esc(e.message) + '</small></div>';
      });

      function drawCatalogs() {
        tree.innerHTML = '';
        dbxLevel(tree, 'catalogs', function () { return { warehouse: pick.value }; }, function (cat, kids) {
          dbxLevel(kids, 'schemas', function () { return { warehouse: pick.value, catalog: cat.name }; }, function (sch, kids2) {
            dbxLevel(kids2, 'tables', function () { return { warehouse: pick.value, catalog: cat.name, schema: sch.name }; }, null, function (tbl) {
              showDbxTable({ warehouse: pick.value, catalog: cat.name, schema: sch.name, table: tbl.name });
            });
          });
        });
      }
    }

    var DBX_ICONS = {
      catalog: '<svg viewBox="0 0 16 16" aria-hidden="true"><ellipse cx="8" cy="3.5" rx="5.5" ry="2"/><path d="M2.5 3.5v9c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2v-9M2.5 8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2"/></svg>',
      schema: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 4.5a1 1 0 0 1 1-1h3.2l1.5 1.7h6.3a1 1 0 0 1 1 1v6.3a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/></svg>',
      table: '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.8" y="2.5" width="12.4" height="11" rx="1.5"/><path d="M1.8 6.2h12.4M1.8 9.8h12.4M6 6.2v7.3"/></svg>',
      view: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 8s2.6-4.5 7-4.5S15 8 15 8s-2.6 4.5-7 4.5S1 8 1 8z"/><circle cx="8" cy="8" r="2"/></svg>'
    };

    /**
     * One lazily-loaded level of the catalog tree with its own filter box and count.
     * The filter is instant over the loaded names; when the list was capped (or a
     * server-side filter is active) it re-queries the server so a name past the cap
     * can still be found.
     * @param {Element} host - Container to draw into.
     * @param {string} route - 'catalogs' | 'schemas' | 'tables'.
     * @param {function} params - Returns the route's query params.
     * @param {function|null} onExpand - (item, childHost) for a row that opens a deeper level.
     * @param {function} [onLeaf] - (item) for a row that has no deeper level.
     */
    function dbxLevel(host, route, params, onExpand, onLeaf) {
      var singular = route.slice(0, -1);
      var filter = document.createElement('input');
      filter.type = 'search'; filter.className = 'cxd-control cxd-dbx-filter';
      filter.placeholder = 'Filter ' + route + '…';
      filter.setAttribute('aria-label', 'Filter ' + route);
      var info = document.createElement('div');
      info.className = 'cxd-dbx-count';
      var list = document.createElement('div');
      host.appendChild(filter); host.appendChild(info); host.appendChild(list);
      var items = [], truncated = false, serverQ = '', timer = null;

      function paint() {
        var q = filter.value.trim().toLowerCase();
        var shown = items.filter(function (it) { return !q || it.name.toLowerCase().indexOf(q) !== -1; });
        list.innerHTML = '';
        shown.forEach(function (it) {
          var row = document.createElement('div');
          row.className = 'cxd-dbx-row';
          row.title = it.name;
          row.innerHTML = (onExpand ? '<span class="cxd-dbx-chev">▶</span>' : '') +
            (DBX_ICONS[it.kind === 'view' ? 'view' : singular] || '') +
            '<span class="cxd-dbx-name">' + esc(it.name) + '</span>' +
            (it.kind === 'view' ? '<span class="cxd-dbx-tag">view</span>' : '');
          var kids = document.createElement('div');
          kids.className = 'cxd-dbx-kids';
          kids.style.display = 'none';
          row.onclick = function () {
            if (!onExpand) {
              var tree = document.getElementById('dbx-tree');
              if (tree) [].forEach.call(tree.querySelectorAll('.cxd-dbx-row.active'), function (r) { r.classList.remove('active'); });
              row.classList.add('active');
              if (onLeaf) onLeaf(it);
              return;
            }
            var open = kids.style.display === 'none';
            kids.style.display = open ? '' : 'none';
            row.classList.toggle('cxd-is-open', open);
            if (open && !kids.firstChild) onExpand(it, kids);
          };
          list.appendChild(row); list.appendChild(kids);
        });
        var n = q && !serverQ ? shown.length + ' of ' + items.length : String(items.length);
        info.textContent = n + ' ' + (items.length === 1 && !q ? singular : route) +
          (truncated ? ' · showing the first 1000, type to search all' : '');
      }
      function load(q) {
        info.textContent = 'Loading…';
        var p = params(); p.q = q;
        dbxApi(route, p).then(function (res) {
          if (filter.value.trim() !== q) return;   // superseded by more typing
          serverQ = q;
          items = (res[route] || []).map(function (x) { return typeof x === 'string' ? { name: x } : x; });
          truncated = !!res.truncated;
          paint();
        }, function (e) { info.textContent = e.message; });
      }
      filter.oninput = function () {
        paint();
        var q = filter.value.trim();
        if (truncated || serverQ) { clearTimeout(timer); timer = setTimeout(function () { load(q); }, 350); }
      };
      load('');
    }

    // The right-hand pane for a selected table: the two actions, then the first rows
    // in a CanvasXpress data table, the same as any other database source.
    function showDbxTable(ref) {
      lastDataPreview = function () { showDbxTable(ref); };   // redrawn by refitDataPreview
      var titleEl = document.getElementById('data-title');
      var host = document.getElementById('data-canvas-host');
      if (!host) return;
      var label = ref.catalog + '.' + ref.schema + '.' + ref.table;
      if (titleEl) { titleEl.style.display = ''; titleEl.textContent = label + '  ·  Databricks'; }
      destroyDataPreview();
      host.innerHTML = '<div class="cxd-dbx-bar"></div><div id="dbx-msg" class="cxd-wizard-msg"></div>' +
        '<div id="dbx-grid"><div class="placeholder">Loading…</div></div>';
      var bar = host.firstChild, msg = document.getElementById('dbx-msg'), grid = document.getElementById('dbx-grid');
      function save(then) {
        msg.textContent = '';
        return dbxApi('save-source', {}, ref).then(function (s) { loadDbSources(); return then(s); },
          function (e) { msg.textContent = e.message; });
      }
      bar.appendChild(smallButton('Save as source', function () {
        // The new source opens in the normal editor so its SELECT (and, off Posit Connect, its token) can be edited.
        save(function (s) { editDbSource(s.name); });
      }));
      if (dbxViewerOauth) {
        var dash = smallButton('Dashboard from this table', function () {
          save(function (s) { showDbWizard({ source: s.name, table: ref.table }); });
        });
        dash.className = 'cX-Button cX-Button--primary';
        bar.appendChild(dash);
      } else {
        var note = document.createElement('span');
        note.className = 'cxd-wizard-note';
        note.textContent = 'Not on Posit Connect: save the source, put your token in its URL, then use + Dashboard.';
        bar.appendChild(note);
      }
      dbxApi('table', ref).then(function (d) {
        if (document.getElementById('dbx-grid') !== grid) return;   // navigated away
        if (!d.data) { grid.innerHTML = '<div class="placeholder">This table has no rows.</div>'; return; }
        if (titleEl) titleEl.textContent = label + '  ·  Databricks (first ' + d.rows + ' rows)';
        grid.innerHTML = '';
        requestAnimationFrame(function () {
          if (document.getElementById('dbx-grid') !== grid) return;
          // Size from the preview pane: the canvas shrink-wraps its direct parent, so the grid itself is no guide.
          var pane = document.getElementById('data-preview');
          var width = Math.max(320, (pane ? pane.clientWidth - 30 : 0) || previewWidth || 640);
          var height = Math.max(420, window.innerHeight - 330);
          var canvas = document.createElement('canvas');
          canvas.id = 'dbx-preview-' + Date.now();
          canvas.setAttribute('width', width);
          canvas.setAttribute('height', height);
          canvas.style.width = width + 'px';
          canvas.style.height = height + 'px';
          grid.appendChild(canvas);
          dataPreviewInstance = new window.CanvasXpress(canvas.id, d.data,
            { view: 'table', title: label, resizable: false }, {});
        });
      }, function (e) { grid.innerHTML = '<div class="placeholder">' + esc(e.message) + '</div>'; });
    }

    // Add/edit a database source: the connection, a table browser (tables →
    // columns, click a column to insert it), query templates (all rows /
    // values for a Control / rows for a :param), the SQL with its :params
    // detected, and Test — runs the UNSAVED query (read-only, capped in the
    // database) with sample values. Resolves with {name, sql} once saved, or
    // null when cancelled; the "Dashboard from database" wizard opens it with
    // opts {title, intro, name, fromSource, template, hint}.
    var DB_TEST_ROWS = 200;
    function openDbSourceDialog(prefill, opts) {
      opts = opts || {};
      var editing = !!(prefill && prefill.name);
      var resolveResult;
      var result = new Promise(function (resolve) { resolveResult = resolve; });
      var instances = [];
      var done = null;
      function destroyAll() {
        instances.forEach(function (inst) { try { inst.destroy(); } catch (e) { /* gone */ } });
        instances = [];
      }
      var body = openModal(opts.title || (editing ? 'Edit database source' : 'Add database source'), function () {
        destroyAll();
        resolveResult(done);
      }, { wide: true });
      var state = { names: [], fromSource: opts.fromSource || '', connUrl: prefill && prefill.conn_url || '',
        tables: null, params: {}, lastTest: null };

      function el(tag, cls, text) {
        var node = document.createElement(tag);
        if (cls) node.className = cls;
        if (text != null) node.textContent = text;
        return node;
      }
      function labeledField(text, control) {
        var label = el('label', 'cxd-wizard-field');
        label.appendChild(document.createTextNode(text));
        label.appendChild(control);
        return label;
      }
      function textInput(value, placeholder) {
        var i = el('input'); i.type = 'text'; i.value = value || ''; i.placeholder = placeholder || ''; return i;
      }

      if (opts.intro) { var intro = el('div', 'cxd-wizard-note'); intro.innerHTML = opts.intro; intro.style.marginBottom = '10px'; body.appendChild(intro); }
      var msg = el('div', 'cxd-wizard-msg');
      body.appendChild(msg);
      var cols = el('div', 'cxd-dbwizard-cols');
      var left = el('div', 'cxd-dbwizard-fields');
      var right = el('div', 'cxd-dbwizard-preview');
      cols.appendChild(left); cols.appendChild(right);
      body.appendChild(cols);

      // ---- left: name, connection, table browser, templates
      var name = textInput(prefill && prefill.name || opts.name || '', 'e.g. sales-by-region');
      left.appendChild(labeledField('Name', name));
      var dbPick = el('select');
      dbPick.innerHTML = '<option value="">Loading…</option>';
      left.appendChild(labeledField('Database', dbPick));
      var url = textInput(state.connUrl, 'sqlite:///path.db · postgresql+psycopg://user:pw@host/db');
      var urlField = labeledField('Connection URL', url);
      left.appendChild(urlField);
      // A stored password or token is never shown again: the server sends it as "********" and
      // puts the stored one back on save (or on Test), as long as the server is unchanged.
      if (editing && state.connUrl.indexOf('********') !== -1) {
        var secretNote = el('div', 'cxd-wizard-note');
        secretNote.textContent = 'The password is stored encrypted and never shown. Leave ******** to keep it, or type a new one.';
        left.appendChild(secretNote);
      }
      var tableSel = el('select');
      tableSel.innerHTML = '<option value="">—</option>';
      left.appendChild(labeledField('Table', tableSel));
      var colList = el('div', 'cxd-dbsrc-cols');
      var colField = labeledField('Columns (click to insert)', colList);
      left.appendChild(colField);
      var param = textInput(opts.param || '', 'e.g. region');
      left.appendChild(labeledField('Parameter (for templates)', param));
      var templates = el('div', 'cxd-dbsrc-templates');
      left.appendChild(labeledField('Start from', templates));

      // ---- right: SQL, parameters, test + preview
      var sql = el('textarea');
      sql.rows = 7; sql.spellcheck = false; sql.value = prefill && prefill.sql || opts.sql || '';
      sql.placeholder = 'SELECT … FROM … WHERE column = :param';
      right.appendChild(labeledField('Read-only SQL', sql));
      var paramsBox = el('div', 'cxd-dbsrc-params');
      right.appendChild(paramsBox);
      var testRow = el('div', 'cxd-wizard-actions');
      testRow.style.justifyContent = 'flex-start';
      testRow.style.marginTop = '0';
      var testBtn = smallButton('▶ Test', function () { runTest(); });
      var testNote = el('span', 'cxd-wizard-note');
      testRow.appendChild(testBtn); testRow.appendChild(testNote);
      right.appendChild(testRow);
      var host = el('div', 'cxd-dbsrc-host');
      right.appendChild(host);
      if (opts.hint) { var hint = el('div', 'cxd-wizard-note'); hint.innerHTML = opts.hint; right.appendChild(hint); }

      function connBody() {
        // secret_from: the saved source whose hidden password a "********" in the URL stands for.
        return state.fromSource ? { source: state.fromSource }
          : { conn_url: url.value.trim(), secret_from: editing ? prefill.name : '' };
      }
      function postJson(path, payload) {
        return ensureConnectorsSession().then(function () {
          return fetch(API_BASE + path, { method: 'POST', credentials: 'include',
            headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        }).then(function (r) {
          return r.json().then(function (b) { if (!r.ok) throw new Error(b.detail || ('HTTP ' + r.status)); return b; });
        });
      }
      function selectedColumn() {
        var on = colList.querySelector('.cxd-dbsrc-col--on');
        return on ? on.getAttribute('data-col') : '';
      }

      // Templates write the SQL from the picked table / column / parameter.
      function template(kind) {
        var t = tableSel.value, c = selectedColumn(), p = param.value.trim() || CXD.paramNameFor(c);
        msg.textContent = '';
        if (!t) { msg.textContent = 'Pick a table first.'; return; }
        if (kind !== 'all' && !c) { msg.textContent = 'Pick a column first (click it in Columns).'; return; }
        if (kind !== 'all' && !param.value.trim()) param.value = p;
        sql.value = kind === 'all' ? 'SELECT * FROM ' + t
          : kind === 'choices' ? CXD.choicesSql(t, c, p) : CXD.detailSql(t, c, p);
        syncParams();
      }
      [['all', 'All rows'], ['choices', 'Values for a Control'], ['detail', 'Rows for a :parameter']].forEach(function (t) {
        var b = smallButton(t[1], function () { template(t[0]); });
        b.setAttribute('data-template', t[0]);
        if (opts.template === t[0]) b.className = 'cX-Button cX-Button--primary';
        templates.appendChild(b);
      });

      // :params in the SQL → one sample-value box each (kept across edits).
      function syncParams() {
        var names = CXD.sqlParamNames(sql.value);
        paramsBox.innerHTML = '';
        if (!names.length) return;
        var head = el('div', 'cxd-wizard-note', 'Parameters — sample values for Test (a dashboard Control fills them):');
        paramsBox.appendChild(head);
        names.forEach(function (n) {
          var i = textInput(state.params[n] || '', 'sample value');
          i.setAttribute('data-param', n);
          i.oninput = function () { state.params[n] = i.value; };
          paramsBox.appendChild(labeledField(':' + n, i));
        });
      }
      var paramTimer = null;
      sql.oninput = function () { sql.removeAttribute('data-auto'); clearTimeout(paramTimer); paramTimer = setTimeout(syncParams, 300); };

      function fillColumns(table) {
        colList.innerHTML = '';
        if (!table) return;
        colList.textContent = 'Loading…';
        var req = connBody(); req.table = table;
        postJson('/api/connectors/schema', req).then(function (res) {
          if (tableSel.value !== table) return;
          colList.innerHTML = '';
          (res.columns || []).forEach(function (c) {
            var chip = el('button', 'cxd-dbsrc-col', c.name);
            chip.type = 'button';
            chip.title = (c.type || c.kind) + ' — click to insert';
            chip.setAttribute('data-col', c.name);
            var kind = el('small', null, ' ' + (c.type || c.kind).toLowerCase());
            chip.appendChild(kind);
            chip.onclick = function () {
              [].forEach.call(colList.children, function (x) { x.classList.remove('cxd-dbsrc-col--on'); });
              chip.classList.add('cxd-dbsrc-col--on');
              if (!opts.param && (!param.value.trim() || param.getAttribute('data-auto'))) {
                param.value = CXD.paramNameFor(c.name);
                param.setAttribute('data-auto', '1');
              }
              // A guided step (the wizard) writes its template on the first column pick.
              if (opts.template && (!sql.value.trim() || sql.getAttribute('data-auto'))) {
                template(opts.template);
                sql.setAttribute('data-auto', '1');
                return;
              }
              insertAtCursor(c.name);
            };
            colList.appendChild(chip);
          });
        }, function (e) { colList.textContent = e.message; });
      }
      param.oninput = function () { param.removeAttribute('data-auto'); };
      // Insert only into a query the user is writing; an empty box waits for a template.
      function insertAtCursor(text) {
        if (!sql.value.trim()) return;
        var start = sql.selectionStart, end = sql.selectionEnd;
        if (document.activeElement !== sql && start === sql.value.length && end === start) { start = end = sql.value.length; }
        sql.value = sql.value.slice(0, start) + text + sql.value.slice(end);
        sql.selectionStart = sql.selectionEnd = start + text.length;
        syncParams();
      }
      function loadTables() {
        tableSel.innerHTML = '<option value="">Loading tables…</option>';
        colList.innerHTML = '';
        if (!state.fromSource && !url.value.trim()) { tableSel.innerHTML = '<option value="">Enter a connection URL</option>'; return; }
        postJson('/api/connectors/schema', connBody()).then(function (res) {
          tableSel.innerHTML = '<option value="">— pick a table —</option>';
          (res.tables || []).forEach(function (t) {
            var o = el('option', null, t.name + (t.kind === 'view' ? '  (view)' : ''));
            o.value = t.name;
            tableSel.appendChild(o);
          });
          if (opts.table && !tableSel.value && (res.tables || []).some(function (t) { return t.name === opts.table; })) {
            tableSel.value = opts.table;    // a table picked elsewhere (Databricks browser)
            fillColumns(opts.table);
          }
        }, function (e) { tableSel.innerHTML = '<option value="">Tables unavailable</option>'; colList.textContent = e.message; });
      }
      tableSel.onchange = function () { fillColumns(tableSel.value); };
      dbPick.onchange = function () {
        state.fromSource = dbPick.value;
        urlField.style.display = state.fromSource ? 'none' : '';
        loadTables();
      };
      var urlTimer = null;
      url.oninput = function () { clearTimeout(urlTimer); urlTimer = setTimeout(loadTables, 600); };

      // Databases: every saved source (its connection, by reference), or a URL.
      ensureConnectorsSession().then(function () {
        return fetch(API_BASE + '/api/connectors/sources-meta', { credentials: 'include' })
          .then(function (r) { return r.json().then(function (b) { if (!r.ok) throw new Error(b.detail || r.status); return b; }); });
      }).then(function (res) {
        var sources = res.sources || [];
        state.names = sources.map(function (s) { return s.name; });
        // A suggested name (the wizard's) never replaces an existing source.
        if (!editing && opts.name && name.value === opts.name && state.names.indexOf(opts.name) !== -1) {
          var n = 2;
          while (state.names.indexOf(opts.name + '-' + n) !== -1) n++;
          name.value = opts.name + '-' + n;
        }
        dbPick.innerHTML = '';
        // Salesforce, ServiceNow, pins and packed-matrix sources have no database to reuse.
        var notDatabase = { salesforce: 1, servicenow: 1, pins: 1, packed: 1 };
        var databases = sources.filter(function (s) { return !(s.type && notDatabase[s.type]); });
        databases.forEach(function (s) {
          if (editing && s.name === prefill.name) return;   // its own URL is in the box
          var o = el('option', null, 'Same database as “' + s.name + '”' + (s.location ? ' (' + s.location + ')' : ''));
          o.value = s.name;
          dbPick.appendChild(o);
        });
        var other = el('option', null, editing ? 'This source’s connection URL' : 'A new connection URL…');
        other.value = '';
        dbPick.appendChild(other);
        dbPick.value = editing ? '' : (state.fromSource && state.names.indexOf(state.fromSource) !== -1 ? state.fromSource
          : (databases[0] ? databases[0].name : ''));
        dbPick.onchange();
      }, function (e) {
        dbPick.innerHTML = '<option value="">A connection URL</option>';
        dbPick.onchange();
        msg.textContent = 'Database sources are unavailable on this server (' + e.message + ').';
      });
      syncParams();

      function runTest() {
        msg.textContent = '';
        var text = sql.value.trim();
        if (!text) { msg.textContent = 'Write a query (or start from a template).'; return; }
        var req = connBody();
        req.sql = text; req.limit = DB_TEST_ROWS; req.params = {};
        CXD.sqlParamNames(text).forEach(function (n) { req.params[n] = state.params[n] || null; });
        testNote.textContent = 'Running…';
        destroyAll();
        host.innerHTML = '';
        postJson('/api/connectors/test', req).then(function (res) {
          state.lastTest = res;
          testNote.textContent = res.rows ? res.rows + ' row(s)' + (res.truncated ? ' (first ' + DB_TEST_ROWS + ')' : '') +
            ' · ' + res.columns.length + ' column(s): ' + res.columns.join(', ')
            : 'No rows' + (CXD.sqlParamNames(text).length ? ' — try other sample values.' : '.');
          if (!res.data) return;
          var canvas = el('canvas');
          canvas.id = 'cxd-dbsrc-' + Date.now();
          canvas.setAttribute('width', Math.max(320, host.clientWidth || 600));
          canvas.setAttribute('height', 260);
          host.appendChild(canvas);
          try { instances.push(new window.CanvasXpress(canvas.id, res.data, { view: 'table', resizable: false }, {})); }
          catch (e) { host.textContent = 'Preview unavailable.'; }
        }, function (e) { testNote.textContent = ''; msg.textContent = e.message; });
      }

      function save() {
        msg.textContent = '';
        var n = name.value.trim(), text = sql.value.trim();
        if (!n) { msg.textContent = 'Give the source a name.'; return; }
        if (!text) { msg.textContent = 'Write a query (or start from a template).'; return; }
        if ((!editing || n !== prefill.name) && state.names.indexOf(n) !== -1 &&
            !window.confirm('A database source named “' + n + '” exists. Replace it?')) return;
        var connPromise = state.fromSource
          ? fetch(API_BASE + '/api/connectors/source?name=' + encodeURIComponent(state.fromSource), { credentials: 'include' })
              .then(function (r) { return r.json().then(function (b) {
                if (!r.ok) throw new Error(b.detail || r.status);
                // A Salesforce / ServiceNow / pins source has no database connection to reuse
                // (the server returns its settings with every secret masked).
                if (b.kind && b.kind !== 'sql') throw new Error('“' + state.fromSource + '” is a ' + b.kind + ' source, not a database.');
                return b.conn_url;
              }); })
          : Promise.resolve(url.value.trim());
        saveBtn.disabled = true;
        connPromise.then(function (connUrl) {
          if (!connUrl) throw new Error('Enter a connection URL or pick a database.');
          return connectorsApi('/api/sources', { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: n, conn_url: connUrl, sql: text,
              secret_from: state.fromSource || (editing ? prefill.name : '') }) });
        }).then(function () {
          delete dbSourceDims[n];
          done = { name: n, sql: text, params: CXD.sqlParamNames(text), sample: state.lastTest };
          body.close();
        }, function (e) { saveBtn.disabled = false; msg.textContent = e.message; });
      }
      var saveBtn = smallButton(opts.saveLabel || (editing ? 'Save' : 'Add source'), save);
      saveBtn.className = 'cX-Button cX-Button--primary';
      var footer = el('div', 'cxd-wizard-actions');
      footer.appendChild(smallButton('Cancel', function () { body.close(); }));
      footer.appendChild(saveBtn);
      body.appendChild(footer);
      setTimeout(function () { (editing ? sql : name).focus(); }, 0);
      return result;
    }

    // Data page: a saved source shows up in the list and opens in the preview.
    function afterDbSourceSaved(saved) {
      if (!saved) return;
      loadDbSources();
      previewConnectorSource(saved.name);
    }

    // Edit = fetch the source (owner-only endpoint) and open the dialog
    // prefilled; saving upserts by name (renaming creates a new source).
    function editDbSource(name) {
      fetch(API_BASE + '/api/connectors/source?name=' + encodeURIComponent(name), { credentials: 'include' })
        .then(function (r) { return r.json().then(function (b) { if (!r.ok) throw new Error(b.detail || r.status); return b; }); })
        .then(function (src) {
          // Salesforce / ServiceNow / pins logins are stored encrypted and never shown again,
          // so there is nothing to prefill; saving the masked copy would break the source.
          if (src.kind && src.kind !== 'sql') {
            window.alert('“' + name + '” is a ' + src.kind + ' source. Its login is stored encrypted on the server ' +
              'and is never shown; to change it, register the source again.');
            return;
          }
          return openDbSourceDialog(src).then(afterDbSourceSaved);
        },
          function (e) { window.alert('Could not load source: ' + e.message); });
    }

    // Dimensions badge for a database source (rows×cols, like the dataset
    // cards). Requires running the query, so results are cached per session.
    var dbSourceDims = {};
    function fillDbSourceDims(name, el) {
      function show(text) {
        // No isConnected guard: the cached path runs synchronously while the
        // row is still being built (attached a moment later) — writing to a
        // momentarily-detached span is harmless, skipping it loses the size.
        if (!el) return;
        el.textContent = text && el.getAttribute('data-paren') ? '(' + text + ')' : text;
      }
      if (dbSourceDims[name]) { show(dbSourceDims[name] + (el && el.getAttribute('data-sep') || '')); return; }
      // (data-paren rows carry no data-sep, so the suffix logic stays inert.)
      connectorsApi('/api/data?source=' + encodeURIComponent(name)).then(function (data) {
        var rows, cols;
        if (Array.isArray(data)) {
          rows = Math.max(0, data.length - 1);
          cols = data[0] ? data[0].length : 0;
        } else {
          var y = data && data.y || {};
          rows = (y.smps || []).length;
          cols = 1 + (y.vars || []).length + Object.keys(data && data.x || {}).length;
        }
        dbSourceDims[name] = Math.max(rows, cols) + '×' + Math.min(rows, cols);
        show(dbSourceDims[name] + (el && el.getAttribute('data-sep') || ''));
      }, function () { show(''); });
    }

    // Drag the splitter between the FILE SOURCES and DATABASE SOURCES cards
    // to trade height between them (the file list scrolls internally).
    function wireDataSplitter() {
      var splitter = document.getElementById('data-splitter');
      var filesCard = document.getElementById('file-sources');
      if (!splitter || !filesCard) return;
      splitter.onpointerdown = function (ev) {
        ev.preventDefault();
        var db = document.getElementById('db-sources');
        var startY = ev.clientY;
        var startH = filesCard.getBoundingClientRect().height;
        // Same clamp AND minimums as the Builder's chat splitter: growth
        // budget = the other card's spare height at drag start; both cards
        // keep >= 250px, and the viewport-pinned column can never overflow.
        var maxH = startH + (db ? db.getBoundingClientRect().height : 0) - 250;
        function move(e) {
          filesCard.style.height = Math.max(250, Math.min(maxH, startH + (e.clientY - startY))) + 'px';
        }
        function up() {
          document.removeEventListener('pointermove', move);
          document.removeEventListener('pointerup', up);
        }
        document.addEventListener('pointermove', move);
        document.addEventListener('pointerup', up);
      };
    }

    function wireDbSourceForm() {
      var addBtn = document.getElementById('db-source-add');
      if (addBtn) addBtn.onclick = function () { openDbSourceDialog(null).then(afterDbSourceSaved); };
      var dashBtn = document.getElementById('db-dashboard-add');
      if (dashBtn) dashBtn.onclick = showDbWizard;
    }

    // Preview a database source: query it LIVE through the connectors app and
    // show the result as a table — same presentation as a stored dataset.
    function previewConnectorSource(name) {
      lastDataPreview = function () { previewConnectorSource(name); };   // redrawn by refitDataPreview
      var titleEl = document.getElementById('data-title');
      var host = document.getElementById('data-canvas-host');
      if (!host) return;
      if (titleEl) { titleEl.style.display = ''; titleEl.textContent = name + '  ·  live database query'; }
      destroyDataPreview();
      host.innerHTML = '<div class="placeholder">Querying database…</div>';
      // Cap the preview IN THE DATABASE (pushdown limit) so a large table is
      // never pulled whole into the browser just to show a sample of it.
      var PREVIEW_DB_ROWS = 500;
      if (titleEl) titleEl.textContent = name + '  ·  live database query (first ' + PREVIEW_DB_ROWS + ' rows)';
      connectorsApi('/api/data?source=' + encodeURIComponent(name) +
          '&_q=' + encodeURIComponent(JSON.stringify({ limit: PREVIEW_DB_ROWS }))).then(function (data) {
        host.innerHTML = '';
        requestAnimationFrame(function () {
          if (document.getElementById('data-title') == null) return;
          var measured = host.clientWidth || 0;
          if (measured > 320) previewWidth = measured;
          var width = Math.max(320, previewWidth || measured || 640);
          var height = Math.max(460, host.clientHeight || 0);
          var canvas = document.createElement('canvas');
          canvas.id = 'db-preview-' + name.replace(/[^A-Za-z0-9_-]/g, '_');
          canvas.setAttribute('width', width);
          canvas.setAttribute('height', height);
          canvas.style.width = width + 'px';
          canvas.style.height = height + 'px';
          host.appendChild(canvas);
          dataPreviewInstance = new window.CanvasXpress(canvas.id, data,
            { view: 'table', title: name, resizable: false }, {});
        });
      }, function (err) {
        host.innerHTML = '<div class="placeholder">Query failed.<br><small>' + esc(err.message) + '</small></div>';
      });
    }

    function loadDataList(selectId) {
      var listEl = document.getElementById('data-list');
      if (!listEl) return;
      listEl.innerHTML = '<div class="placeholder">Loading…</div>';
      // Data is a PROTECTED view, so a session already exists by the time we list.
      Promise.resolve().then(function () {
      client.listDatasets().then(function (datasets) {
        if (!datasets || !datasets.length) {
          listEl.innerHTML = '<div class="placeholder">No datasets yet.<br>' +
            'Click “+ Data”, or drop a CSV / TSV / CanvasXpress JSON file on the panel.</div>';
          return;
        }
        listEl.innerHTML = '';
        function selectItem(item, d) {
          var active = listEl.querySelector('.data-item.active');
          if (active) active.classList.remove('active');
          item.classList.add('active');
          selectedDatasetId = d.id;
          previewDataset(d);
        }
        var built = [];
        datasets.forEach(function (d) {
          var meta = [];
          if (d.rows != null && d.cols != null) meta.push(Math.max(d.rows, d.cols) + '×' + Math.min(d.rows, d.cols));
          else if (d.rows != null) meta.push(d.rows + '×?');
          if (d.store) meta.push(d.store);
          if (d.shared) meta.push('from ' + d.owner);
          if (d.updated_at) meta.push(String(d.updated_at).slice(0, 10));
          var item = document.createElement('div');
          item.className = 'data-item';
          item.setAttribute('data-search', ((d.title || '') + ' ' + d.id + ' ' + (d.store || '')).toLowerCase());
          item.style.display = 'flex';
          item.style.alignItems = 'center';
          item.style.gap = '8px';
          item.innerHTML = '<div style="flex:1;min-width:0">' +
            '<div class="data-item-title">' + esc(d.title || d.id) + '</div>' +
            '<div class="data-item-meta">' + esc(meta.join(' · ')) + '</div></div>';
          item.addEventListener('click', function () { selectItem(item, d); });
          // Your own datasets can be shared and secured (admins: every dataset).
          var ownsIt = !d.shared && (!d.example || isAdmin);
          if (ownsIt && hasPerm('share.grant')) {
            var people = smallButton('👥', function () {
              showPeople({ kind: 'dataset', id: d.id, title: d.title, store: d.store, owner: d.owner });
            }, 'border:none;background:transparent;padding:0 2px');
            people.title = 'Share with people and groups';
            item.appendChild(people);
          }
          if (!d.shared && !d.example && hasPerm('schedule.create')) {
            var timer = smallButton('⏱', function () {
              pendingSchedule = { kind: 'refresh', name: 'Refresh ' + (d.title || d.id),
                config: { dataset: d.id, store: d.store || null } };
              activate('Schedules');
            }, 'border:none;background:transparent;padding:0 2px');
            timer.title = 'Refresh on a schedule';
            item.appendChild(timer);
          }
          if (ownsIt) {
            var lock = smallButton('🔒', function () {
              showSecurity({ id: d.id, title: d.title, store: d.store, owner: d.owner });
            }, 'border:none;background:transparent;padding:0 2px');
            lock.title = 'Row and column security';
            item.appendChild(lock);
          }
          // Uploaded datasets can be deleted; the seeded sample ones are protected.
          if (!SAMPLE_IDS[d.id] && !d.shared) {
            var del = document.createElement('button');
            del.textContent = '×';
            del.className = 'cX-Button cX-Button--icon';
            del.title = 'Delete dataset';
            del.style.cssText = 'border:none;background:transparent;color:var(--muted);' +
              'font-size:20px;line-height:1;cursor:pointer;padding:0 4px';
            del.addEventListener('click', function (ev) {
              ev.stopPropagation();
              if (!window.confirm('Delete “' + (d.title || d.id) + '”? This cannot be undone.')) return;
              del.disabled = true;
              client.deleteDataset(d.id, { store: d.store }).then(function () {
                if (selectedDatasetId === d.id) selectedDatasetId = null;  // re-select another
                loadDataList();
              }, function (err) {
                del.disabled = false;
                window.alert('Delete failed: ' + (err && err.message || err));
              });
            });
            item.appendChild(del);
          }
          listEl.appendChild(item);
          built.push({ item: item, d: d });
        });
        wireListSearch('data-search', 'data-list');
        var want = selectId || selectedDatasetId;
        var target = null;
        if (want) { for (var i = 0; i < built.length; i++) { if (built[i].d.id === want) { target = built[i]; break; } } }
        if (!target) target = built[0];   // default to the first dataset
        if (target) selectItem(target.item, target.d);
      }, function (err) {
        listEl.innerHTML = '<div class="placeholder">' + esc(datasetErrorHint(err)) +
          '<br><small>' + esc(err && err.message || err) + '</small></div>';
      });
      });
    }

    // Turn a fetch failure into an actionable hint. A 404 on the LIST endpoint
    // means /api/datasets isn't on the server we hit (wrong origin, or a stale
    // server started before the dataset routes existed); 401 means not logged in;
    // no status usually means the server is down / blocked by CORS.
    function datasetErrorHint(err) {
      var status = err && err.status;
      if (status === 404) {
        return 'No /api/datasets on ' + (API_BASE || location.origin) + '. ' +
          'Serve builder.html from cxd_server, pass ?api=<server-url>, or restart a stale server.';
      }
      if (status === 401) return 'Not logged in — sign in to the cxd_server first.';
      if (status == null) return 'Couldn’t reach the cxd_server — is it running (and CORS-allowed)?';
      return 'Couldn’t load datasets (HTTP ' + status + ').';
    }

    function previewDataset(d) {
      lastDataPreview = function () { previewDataset(d); };   // redrawn by refitDataPreview
      var titleEl = document.getElementById('data-title');
      var host = document.getElementById('data-canvas-host');
      if (!host) return;
      if (titleEl) titleEl.textContent = (d.title || d.id) + (d.store ? '  ·  ' + d.store : '');
      destroyDataPreview();
      host.innerHTML = '<div class="placeholder">Loading…</div>';
      client.getDataset(d.id, { store: d.store, owner: d.shared ? d.owner : undefined }).then(function (data) {
        host.innerHTML = '';
        requestAnimationFrame(function () {
          if (document.getElementById('data-title') == null) return;  // navigated away
          // Per-render measurement was returning different values (so each table
          // rendered at a different size). Measure the pane ONCE and reuse that
          // width for every dataset, so all previews are identically sized.
          var measured = host.clientWidth || 0;
          if (measured > 320) previewWidth = measured;   // cache the first good width
          var width = Math.max(320, previewWidth || measured || 640);
          var height = Math.max(460, host.clientHeight || 0);
          var canvas = document.createElement('canvas');
          canvas.id = 'data-preview-' + String(d.id).replace(/[^A-Za-z0-9_-]/g, '_');
          // Buffer + display box both pinned to the shared width (buffer defaults
          // to 500×500 otherwise).
          canvas.setAttribute('width', width);
          canvas.setAttribute('height', height);
          canvas.style.width = width + 'px';
          canvas.style.height = height + 'px';
          host.appendChild(canvas);
          // view:'table' renders the data as a scrollable grid — same as the
          // dashboard's "table" control; resizable:false pins it to the canvas.
          // When a dataset is stored wider than tall, transpose the table so
          // the larger dimension always runs down the rows (tall beats wide).
          // Tabular 2D arrays are already row-oriented; only pre-shaped
          // {y} objects may need the display transpose.
          var wideways = false;
          if (!Array.isArray(data)) {
            var y = data && data.y ? data.y : {};
            wideways = (y.vars || []).length > (y.smps || []).length;
          }
          dataPreviewInstance = new window.CanvasXpress(canvas.id, data,
            { view: 'table', title: d.title || d.id, resizable: false,
              transposeData: wideways }, {});
        });
      }, function (err) {
        host.innerHTML = '<div class="placeholder">Couldn’t load “' + esc(d.id) + '”.' +
          '<br><small>' + esc(err && err.message || err) + '</small></div>';
      });
    }

    function esc(v) {
      return String(v == null ? '' : v).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }

    // ---- governance: sharing with people/groups and dataset security ----------
    // The server enforces every rule; these panels only edit grants and policies.
    var directoryCache = null;
    function loadDirectory() {
      if (!directoryCache) {
        directoryCache = client.directory().catch(function () { directoryCache = null; return { users: [], groups: [] }; });
      }
      return directoryCache;
    }
    function hasPerm(permission) { return isAdmin || currentPermissions.indexOf(permission) !== -1; }
    function principalLabel(p) {
      if (p === '*') return 'Everyone signed in';
      if (p === 'anonymous') return 'Share-link viewers (not signed in)';
      if (p.indexOf('group:') === 0) return '👥 ' + p.slice(6);
      if (p.indexOf('user:') === 0) return '👤 ' + p.slice(5);
      return p;
    }
    // A <select> of principals: users, groups, everyone (and optionally anonymous).
    function principalSelect(dir, opts) {
      opts = opts || {};
      var sel = document.createElement('select');
      sel.style.cssText = 'font-size:14px;padding:3px 28px 3px 6px;max-width:220px';
      var add = function (value, label) {
        var o = document.createElement('option'); o.value = value; o.textContent = label; sel.appendChild(o);
      };
      if (opts.placeholder) add('', opts.placeholder);
      (dir.groups || []).forEach(function (g) { add('group:' + g, principalLabel('group:' + g)); });
      (dir.users || []).forEach(function (u) {
        if (u !== opts.exclude) add('user:' + u, principalLabel('user:' + u));
      });
      add('*', principalLabel('*'));
      if (opts.anonymous) add('anonymous', principalLabel('anonymous'));
      if (opts.value != null) sel.value = opts.value;
      return sel;
    }
    function smallButton(text, onclick, extra) {
      var b = document.createElement('button');
      b.textContent = text;
      // The shared button primitive (light and dark); the shell's compact size stays inline
      b.className = 'cX-Button';
      b.style.cssText = 'font-size:14px;padding:3px 10px;cursor:pointer;' + (extra || '');
      b.onclick = function (e) { e.stopPropagation(); onclick(e); };
      return b;
    }
    // A simple modal; returns its body element. Esc or the ✕ closes it.
    // Built on the shared CanvasXpress modal primitive (.cX-Modal*: tokens, light and dark);
    // only the shell's own layout stays inline (top-aligned, wider, a block-flow body).
    // opts.wide: a larger card (wizards with a live preview).
    function openModal(title, onClose, opts) {
      var overlay = document.createElement('div');
      overlay.className = 'cX-Modal-Overlay';
      overlay.style.cssText = 'align-items:flex-start;padding-top:8vh';
      var card = document.createElement('div');
      card.className = 'cX-Modal';
      card.style.cssText = opts && opts.wide ? 'width:min(1120px,95vw);max-width:none;max-height:92vh'
        : 'width:min(720px,92vw);max-width:none;max-height:80vh';
      var head = document.createElement('div');
      head.className = 'cX-Modal-Head';
      head.innerHTML = '<h3 class="cX-Modal-Title" style="font-size:17px;flex:1">' + esc(title) + '</h3>';
      var body = document.createElement('div');
      body.className = 'cX-Modal-Body';
      body.style.cssText = 'display:block;padding:14px 16px;font-size:15px';
      function close() {
        document.removeEventListener('keydown', onKey);
        if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
        if (onClose) onClose();
      }
      function onKey(e) { if (e.key === 'Escape') close(); }
      var x = smallButton('✕', close, 'font-size:18px');
      x.className = 'cX-Button cX-Button--icon';
      x.setAttribute('aria-label', 'Close');
      head.appendChild(x);
      card.appendChild(head); card.appendChild(body); overlay.appendChild(card);
      // Close on a backdrop click only when the press also STARTED on the backdrop.
      // A drag that starts inside the card (selecting text, dragging a chart) and
      // is released outside it fires `click` on the overlay and used to dismiss
      // the whole dialog.
      var pressedOnOverlay = false;
      overlay.addEventListener('mousedown', function (e) { pressedOnOverlay = (e.target === overlay); });
      overlay.addEventListener('click', function (e) { if (e.target === overlay && pressedOnOverlay) close(); });
      document.addEventListener('keydown', onKey);
      document.body.appendChild(overlay);
      body.close = close;
      return body;
    }

    // ---- data-first wizard: Upload → Check → Visualize → Publish -------------
    // Parsing is the CanvasXpress engine's own (loadFile: CSV/TSV/TXT/JSON/PNG/
    // Parquet/…) — never a dashboards parser. CXD wizard helpers only inspect
    // and reshape the parsed data; the chart ranking is the canvasxpress-mcp
    // selector (/api/wizard/suggest); publishing reuses save + share + embed.
    var WIZARD_STEPS = ['Upload', 'Check', 'Visualize', 'Publish'];
    var WIZARD_FALLBACK_TYPES = ['Bar', 'Line', 'Area', 'Stacked', 'Scatter2D', 'Boxplot', 'Dotplot', 'Dumbbell', 'Pie', 'Heatmap'];
    var NOOP_EVENT = { preventDefault: function () {}, stopPropagation: function () {} };

    function showWizard() {
      var state = { data: null, title: '', intent: '', config: null, editorial: true };
      var instances = [];
      var body = openModal('New chart from data', function () { destroyAll(); });

      function destroyAll() {
        instances.forEach(function (inst) { try { inst.destroy(); } catch (e) { /* gone */ } });
        instances = [];
      }
      function newCanvas(host, height) {
        var canvas = document.createElement('canvas');
        canvas.id = 'cxd-wizard-' + Date.now() + '-' + Math.floor(Math.random() * 1e6);
        var width = Math.max(240, host.clientWidth || 560);
        canvas.setAttribute('width', width);
        canvas.setAttribute('height', height);
        host.appendChild(canvas);
        return canvas.id;
      }
      function frame(stepIndex) {
        destroyAll();
        body.innerHTML = '';
        var steps = document.createElement('div');
        steps.className = 'cxd-wizard-steps';
        WIZARD_STEPS.forEach(function (name, i) {
          var chip = document.createElement('span');
          chip.className = 'cxd-wizard-step' + (i === stepIndex ? ' cxd-wizard-step--active' : '');
          chip.textContent = (i + 1) + ' ' + name;
          steps.appendChild(chip);
        });
        body.appendChild(steps);
        var msg = document.createElement('div');
        msg.className = 'cxd-wizard-msg';
        body.appendChild(msg);
        return msg;
      }
      function actions(buttons) {
        var row = document.createElement('div');
        row.className = 'cxd-wizard-actions';
        buttons.forEach(function (b) { if (b) row.appendChild(b); });
        body.appendChild(row);
      }
      function labeled(text, control) {
        var label = document.createElement('label');
        label.className = 'cxd-wizard-field';
        label.appendChild(document.createTextNode(text));
        label.appendChild(document.createElement('br'));
        label.appendChild(control);
        return label;
      }

      // Hand any file to the engine; the callback gets the parsed data object.
      function parseWithEngine(file, done, fail) {
        var host = document.createElement('div');
        host.className = 'cxd-wizard-host';
        body.appendChild(host);
        var id = newCanvas(host, 200);
        var inst = new window.CanvasXpress(id, { y: { vars: ['-'], smps: ['-'], data: [[0]] } },
          { view: 'table', resizable: false }, {});
        instances.push(inst);
        // The CanvasXpress constructor is asynchronous: its methods (loadFile)
        // attach after it returns, so wait for them (bounded) before parsing.
        var waited = 0;
        (function whenReady() {
          if (typeof inst.loadFile !== 'function') {
            waited += 50;
            if (waited > 10000) { fail('CanvasXpress did not finish loading.'); return; }
            setTimeout(whenReady, 50);
            return;
          }
          try {
            inst.loadFile(NOOP_EVENT, false, function (parsed) {
              if (parsed && parsed !== inst) instances.push(parsed);
              var d = parsed && parsed.data;
              if (!d || !d.y || !(d.y.vars || []).length) { fail('That isn’t a dataset CanvasXpress can read.'); return; }
              done(JSON.parse(JSON.stringify({ y: d.y, x: d.x || undefined, z: d.z || undefined })));
            }, file, true);
          } catch (e) { fail('Could not read it: ' + (e && e.message || e)); }
        })();
      }
      function textToFile(text, hint) {
        var trimmed = String(text || '').replace(/^﻿/, '').trim();
        var json = trimmed.charAt(0) === '{' || trimmed.charAt(0) === '[';
        var name = (hint || 'pasted') + (json ? '.json' : '.txt');
        return new File([trimmed], name, { type: json ? 'application/json' : 'text/plain' });
      }

      // ---- 1 Upload ----
      function stepUpload() {
        var msg = frame(0);
        var title = document.createElement('input');
        title.type = 'text'; title.value = state.title || ''; title.placeholder = 'e.g. Life expectancy 2024';
        var file = document.createElement('input');
        file.type = 'file'; file.accept = '.csv,.tsv,.tab,.txt,.json,.png,.parquet';
        var paste = document.createElement('textarea');
        paste.rows = 5; paste.placeholder = 'Paste a table (comma-, tab- or semicolon-separated), first row = headers';
        var url = document.createElement('input');
        url.type = 'url'; url.placeholder = 'https://… (CSV, TSV or JSON)';
        body.appendChild(labeled('Chart title', title));
        body.appendChild(labeled('Upload a file', file));
        body.appendChild(labeled('…or paste data', paste));
        body.appendChild(labeled('…or load from a URL', url));
        var note = document.createElement('div');
        note.className = 'cxd-wizard-note';
        note.textContent = 'Databases and Google Sheets: add them with “+ Database” in Data, then build from the dataset.';
        body.appendChild(note);
        var next = smallButton('Next: check data', function () {
          msg.textContent = '';
          state.title = title.value.trim();
          function parsed(data) { state.data = data; stepCheck(); }
          function fail(text) { msg.textContent = text; }
          if (file.files && file.files[0]) {
            if (!state.title) state.title = file.files[0].name.replace(/\.[^.]+$/, '');
            parseWithEngine(file.files[0], parsed, fail);
          } else if (paste.value.trim()) {
            parseWithEngine(textToFile(paste.value, 'pasted'), parsed, fail);
          } else if (url.value.trim()) {
            msg.textContent = '';
            fetch(url.value.trim()).then(function (r) {
              if (!r.ok) throw new Error('HTTP ' + r.status);
              return r.text();
            }).then(function (text) {
              var base = (url.value.split('/').pop() || 'data').replace(/[?#].*$/, '').replace(/\.[^.]+$/, '') || 'data';
              if (!state.title) state.title = base;
              parseWithEngine(textToFile(text, base), parsed, fail);
            }, function (e) { fail('Could not load the URL: ' + e.message + ' (it must allow cross-origin requests)'); });
          } else {
            fail('Choose a file, paste data or enter a URL.');
          }
        });
        next.className = 'cX-Button cX-Button--primary';
        actions([next]);
      }

      // ---- 2 Check ----
      function stepCheck() {
        var msg = frame(1);
        var table = CXD.tableFromData(state.data);
        var profile = CXD.profileColumns(table);
        var rows = table.length - 1;
        var summary = document.createElement('div');
        summary.className = 'cxd-wizard-note';
        var badTotal = profile.reduce(function (n, c) { return n + c.bad; }, 0);
        summary.textContent = rows + ' rows × ' + (profile.length - 1) + ' columns' +
          (badTotal ? ' · ' + badTotal + ' cell(s) don’t match their column type' : ' · every cell matches its column type');
        body.appendChild(summary);
        var grid = document.createElement('table');
        grid.className = 'cxd-wizard-profile';
        grid.innerHTML = '<thead><tr><th>Column</th><th>Type</th><th>Missing</th><th>Problems</th></tr></thead>';
        var tb = document.createElement('tbody');
        profile.slice(1).forEach(function (c) {
          var tr = document.createElement('tr');
          tr.innerHTML = '<td>' + esc(c.name) + '</td><td>' + esc(c.type) + '</td><td>' + c.missing + '</td>' +
            '<td' + (c.bad ? ' class="cxd-wizard-bad"' : '') + '>' +
            (c.bad ? c.bad + ' (row ' + c.badRows.join(', ') + (c.bad > c.badRows.length ? ', …' : '') + ')' : '–') + '</td>';
          tb.appendChild(tr);
        });
        grid.appendChild(tb);
        body.appendChild(grid);
        var host = document.createElement('div');
        host.className = 'cxd-wizard-host';
        body.appendChild(host);
        instances.push(new window.CanvasXpress(newCanvas(host, 210), state.data, { view: 'table', resizable: false }, {}));

        var transpose = smallButton('Transpose', function () {
          state.data = CXD.transposeCxData(state.data);
          stepCheck();
        });
        var comma = smallButton('Decimal comma → numbers', function () {
          var out = CXD.applyDecimalComma(state.data);
          state.data = out.data;
          stepCheck();
          body.querySelector('.cxd-wizard-msg').textContent = out.converted
            ? 'Converted ' + out.converted + ' cell(s) like “1.234,5” to numbers.' : 'No comma-decimal numbers found.';
        });
        var back = smallButton('Back', stepUpload);
        var next = smallButton('Next: pick a chart', stepVisualize);
        next.className = 'cX-Button cX-Button--primary';
        actions([transpose, comma, back, next]);
      }

      // ---- 3 Visualize ----
      function stepVisualize() {
        var msg = frame(2);
        var table = CXD.tableFromData(state.data);
        var intent = document.createElement('input');
        intent.type = 'text'; intent.value = state.intent; intent.placeholder = 'Optional: what should the chart show? e.g. compare regions over time';
        body.appendChild(labeled('Goal', intent));
        var editorial = document.createElement('input');
        editorial.type = 'checkbox'; editorial.checked = state.editorial;
        editorial.onchange = function () { state.editorial = editorial.checked; drawCards(lastSuggestions); };
        var editorialLabel = document.createElement('label');
        editorialLabel.className = 'cxd-wizard-field';
        editorialLabel.appendChild(editorial);
        editorialLabel.appendChild(document.createTextNode(' Editorial (publication) theme'));
        body.appendChild(editorialLabel);

        // Manual override: always let the user pick any chart type, not only the
        // suggested ones. "Suggested charts" (the default) re-runs the selector.
        var typeSel = document.createElement('select');
        var optSuggested = document.createElement('option');
        optSuggested.value = ''; optSuggested.textContent = 'Suggested charts';
        typeSel.appendChild(optSuggested);
        WIZARD_FALLBACK_TYPES.forEach(function (t) {
          var o = document.createElement('option'); o.value = t; o.textContent = t; typeSel.appendChild(o);
        });
        typeSel.onchange = function () {
          if (!typeSel.value) { suggest(); return; }
          drawCards([{ graphType: typeSel.value, reason: 'You chose this type.', config: { graphType: typeSel.value } }]);
          state.config = CXD.orientConfig({ graphType: typeSel.value }, state.data);
        };
        body.appendChild(labeled('Chart type', typeSel));

        var cards = document.createElement('div');
        cards.className = 'cxd-wizard-cards';
        body.appendChild(cards);
        var lastSuggestions = [];

        function withTheme(config) {
          var c = JSON.parse(JSON.stringify(config || {}));
          if (state.editorial) c.theme = 'editorial';
          return c;
        }
        function drawCards(suggestions) {
          // Scatter-family charts over row-per-sample data need transposeData.
          suggestions = suggestions.map(function (s) {
            return { graphType: s.graphType, reason: s.reason, config: CXD.orientConfig(s.config, state.data) };
          });
          destroyAll();
          cards.innerHTML = '';
          lastSuggestions = suggestions;
          suggestions.forEach(function (s) {
            var card = document.createElement('div');
            card.className = 'cxd-wizard-card' + (state.config && state.config.graphType === s.config.graphType ? ' cxd-wizard-card--chosen' : '');
            card.innerHTML = '<b>' + esc(s.graphType) + '</b>' + (s.reason ? ' — <span class="cxd-wizard-note">' + esc(s.reason) + '</span>' : '');
            var host = document.createElement('div');
            host.className = 'cxd-wizard-card-host';
            card.appendChild(host);
            // Capture phase: a click on the preview chart is the chart's own
            // (CanvasXpress stops it there), so the card must see it first.
            card.addEventListener('click', function () {
              state.config = s.config;
              Array.prototype.forEach.call(cards.children, function (el) { el.classList.remove('cxd-wizard-card--chosen'); });
              card.classList.add('cxd-wizard-card--chosen');
            }, true);
            cards.appendChild(card);
            try {
              instances.push(new window.CanvasXpress(newCanvas(host, 150), state.data,
                Object.assign(withTheme(s.config), { resizable: false, showLegend: false }), {}));
            } catch (e) { host.textContent = 'Preview unavailable for this data.'; }
          });
          if (!state.config && suggestions[0]) {
            state.config = suggestions[0].config;
            cards.firstChild.classList.add('cxd-wizard-card--chosen');
          }
        }
        function fallback(reason) {
          msg.textContent = '';
          var note = document.createElement('div');
          note.className = 'cxd-wizard-note';
          note.textContent = reason + ' Pick a chart type:';
          cards.parentNode.insertBefore(note, cards);
          drawCards(WIZARD_FALLBACK_TYPES.slice(0, 4).map(function (t) {
            return { graphType: t, reason: '', config: { graphType: t } };
          }));
          // The always-present "Chart type" picker above covers manual selection.
        }
        function suggest() {
          state.intent = intent.value.trim();
          state.config = null;
          cards.textContent = 'Asking the chart selector…';
          client.wizardSuggest(table, state.intent).then(function (r) {
            if (r && r.suggestions && r.suggestions.length) { cards.textContent = ''; drawCards(r.suggestions); }
            else { cards.textContent = ''; fallback('Chart suggestions are unavailable (the canvasxpress-mcp service is off).'); }
          }, function (e) { cards.textContent = ''; fallback('Chart suggestions failed: ' + e.message + '.'); });
        }
        intent.onchange = suggest;
        var back = smallButton('Back', stepCheck);
        var next = smallButton('Next: publish', function () {
          if (!state.config) { msg.textContent = 'Pick a chart first.'; return; }
          stepPublish();
        });
        next.className = 'cX-Button cX-Button--primary';
        actions([back, next]);
        suggest();
      }

      // ---- 4 Publish ----
      function stepPublish() {
        var msg = frame(3);
        var status = document.createElement('div');
        status.className = 'cxd-wizard-note';
        status.textContent = 'Saves the data as a dataset, creates a one-chart dashboard, and publishes it (anyone with the link can view).';
        body.appendChild(status);
        var box = document.createElement('div');
        body.appendChild(box);
        var back = smallButton('Back', stepVisualize);
        var publish = smallButton('Save & publish', function () {
          publish.disabled = true;
          msg.textContent = '';
          status.textContent = 'Saving the dataset…';
          var title = state.title || 'Chart';
          var config = JSON.parse(JSON.stringify(state.config));
          var slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'chart';
          client.uploadDataset(state.data, { format: 'cx', title: title }).then(function (dataset) {
            var spec = CXD.wizardSpec({ id: slug + '-' + Date.now().toString(36), title: title,
              datasetId: dataset.id, store: dataset.store, config: config });
            if (state.editorial) spec.theme = 'editorial';
            status.textContent = 'Saving the dashboard…';
            return client.save(spec).then(function () {
              status.textContent = 'Publishing…';
              return client.share(spec.id, 'public').then(function (summary) {
                return { spec: spec, summary: summary };
              }, function (e) {
                // Saved but not shareable (e.g. the role lacks share.public): still openable.
                return { spec: spec, summary: null, shareError: e };
              });
            });
          }).then(function (result) {
            status.textContent = result.summary ? 'Published.' : 'Saved — but not published: ' + result.shareError.message;
            var open = smallButton('Open in builder', function () {
              body.close();
              currentSpec = result.spec; currentOwner = null;
              activate('Builder');
            });
            back.style.display = 'none';
            publish.style.display = 'none';
            if (result.summary) {
              var url = result.summary.share_url || (location.origin + '/shared.html?token=' + result.summary.share_token);
              var link = document.createElement('input');
              link.type = 'text'; link.readOnly = true; link.value = url;
              box.appendChild(labeled('Share link', link));
              renderEmbedCodes(box, result.summary.share_token);
            }
            box.appendChild(open);
          }, function (e) {
            publish.disabled = false;
            status.textContent = '';
            msg.textContent = 'Publishing failed: ' + e.message;
          });
        });
        publish.className = 'cX-Button cX-Button--primary';
        actions([back, publish]);
      }

      stepUpload();
    }

    // "People" panel: who a dashboard/dataset is shared with, and at what level.
    // res = {kind: 'dashboard'|'dataset', id, title, store?, owner?}
    function showPeople(res, onChanged) {
      var body = openModal('Share “' + (res.title || res.id) + '” with people and groups', onChanged);
      var opts = { store: res.store, owner: res.owner !== currentUser ? res.owner : undefined };
      var levels = res.kind === 'dataset' ? ['view'] : ['view', 'edit'];
      function levelSelect(value) {
        var sel = document.createElement('select');
        sel.style.cssText = 'font-size:14px;padding:3px 28px 3px 6px';
        levels.forEach(function (l) {
          var o = document.createElement('option'); o.value = l;
          o.textContent = l === 'edit' ? 'Can edit' : 'Can view'; sel.appendChild(o);
        });
        sel.value = value || 'view';
        return sel;
      }
      function draw(grants, dir) {
        body.innerHTML =
          '<p style="margin:0 0 10px;color:var(--muted);font-size:14px">' +
          (res.kind === 'dashboard'
            ? 'People you share with see it under Dashboards. They read its stored datasets through it, subject to each dataset’s security policy.'
            : 'People you share with see it under Data, subject to its security policy.') + '</p>';
        var err = document.createElement('div');
        err.style.cssText = 'color:var(--cx-ui-danger);min-height:18px;font-size:14px';
        var list = document.createElement('div');
        function apply(principal, level) {
          err.textContent = '';
          client.setGrant(res.kind, res.id, principal, level, opts).then(function (g) { draw(g, dir); },
            function (e) { err.textContent = e.message; });
        }
        if (!grants.length) list.innerHTML = '<div class="placeholder" style="padding:6px 0">Only you (and admins) can open it.</div>';
        grants.forEach(function (g) {
          var row = document.createElement('div');
          row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--rail-border)';
          row.innerHTML = '<div style="flex:1">' + esc(principalLabel(g.principal)) + '</div>';
          var lvl = levelSelect(g.level);
          lvl.onchange = function () { apply(g.principal, lvl.value); };
          row.appendChild(lvl);
          row.appendChild(smallButton('Remove', function () { apply(g.principal, null); }));
          list.appendChild(row);
        });
        var addRow = document.createElement('div');
        addRow.style.cssText = 'display:flex;gap:8px;align-items:center;margin-top:12px';
        var who = principalSelect(dir, { exclude: res.owner || currentUser, placeholder: 'Add a person or group…' });
        var lvl = levelSelect('view');
        addRow.appendChild(who); addRow.appendChild(lvl);
        addRow.appendChild(smallButton('Share', function () {
          if (!who.value) { err.textContent = 'Pick a person or group.'; return; }
          apply(who.value, lvl.value);
        }, 'background:var(--cx-ui-accent-strong);color:var(--cx-ui-on-accent);border:none;border-radius:var(--cx-radius-md)'));
        body.appendChild(list); body.appendChild(addRow); body.appendChild(err);
      }
      body.textContent = 'Loading…';
      Promise.all([client.grants(res.kind, res.id, opts), loadDirectory()]).then(function (r) { draw(r[0], r[1]); },
        function (e) { body.textContent = 'Could not load sharing: ' + e.message; });
    }

    // The column names a dataset exposes (2D table header, or CX vars + annotations).
    function datasetColumns(data) {
      if (Array.isArray(data) && Array.isArray(data[0])) return data[0].map(String);
      var cols = [];

    }
