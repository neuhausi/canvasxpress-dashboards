<!doctype html>
<html lang="en" data-cx-ui-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/favicon.png" />
  <title>Dashboard · CanvasXpress Dashboards</title>

  <link href="https://www.canvasxpress.org/dist/canvasXpress.css" rel="stylesheet" />
  <script src="https://www.canvasxpress.org/dist/canvasXpress.min.js"></script>
  <script src="./canvasxpress-dashboards.umd.js"></script>
  <!-- Export deps (PNG/PDF rasterization). Local to the dashboards repo only. -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

  <style>
    body { margin: 0; font-family: var(--cx-font-sans); background: var(--cx-ui-surface-sunken); color: var(--cx-ui-text); }
    #dashboard { padding: 16px 24px 32px; }
    #message { padding: 32px 24px; color: var(--cx-ui-text-muted); }
    #cxd-toolbar {
      display: none; align-items: center; justify-content: flex-end;
      gap: 4px; padding: 7px 18px; background: var(--cx-ui-surface-alt);
      border-bottom: 1px solid var(--cx-ui-border-subtle);
    }
  </style>
</head>
<body class="cX-UI-Controls">
  <!-- Full-page dashboard preview: renders one saved dashboard, name-free,
       exactly as the renderer draws it everywhere else. Opened from the
       Dashboards page's "Preview" button (?id=<dashboard-id>); uses the
       viewer's own session, so it needs no share token. -->
  <div id="message">Loading…</div>
  <div id="cxd-toolbar">
    <div class="cxd-tb-menu">
      <button type="button" class="cxd-tb-btn" id="cxd-download-btn" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 11l5 4 5-4"/><path d="M4 20h16"/></svg>
        <span>Download</span>
        <svg class="cxd-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="cxd-tb-dropdown" id="cxd-download-menu" hidden>
        <button type="button" class="cxd-tb-item" data-act="html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8.5 9.5L6 12l2.5 2.5"/><path d="M15.5 9.5L18 12l-2.5 2.5"/></svg>
          <span><b>HTML</b><small>Self-contained page</small></span>
        </button>
        <button type="button" class="cxd-tb-item" data-act="png">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 16l-5-5-6 6"/></svg>
          <span><b>PNG</b><small>Image snapshot</small></span>
        </button>
        <button type="button" class="cxd-tb-item" data-act="pdf">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l3 3v15H6z"/><path d="M9 12h1.5a1.5 1.5 0 0 0 0-3H9v7"/></svg>
          <span><b>PDF</b><small>Print-ready</small></span>
        </button>
      </div>
    </div>
  </div>
  <div id="dashboard"></div>

  <script>
    // The dashboards UMD bundle path differs per page; buildDashboardHtml inlines
    // it, so it must be handed the same path this page loads it from.
    var UMD_URL = './canvasxpress-dashboards.umd.js';

    // The toolbar CSS lives in the dashboards stylesheet (one copy for both viewer pages): inject it
    // now so the toolbar is styled before the first render.
    if (CanvasXpressDashboards.injectStyles) { CanvasXpressDashboards.injectStyles(document); }
    var id = new URLSearchParams(location.search).get('id');
    // ?owner= opens a dashboard someone shared with you (e.g. from an emailed link).
    var owner = new URLSearchParams(location.search).get('owner');
    var base = location.pathname.replace(/\/(examples\/)?[^/]*$/, '');
    var client = CanvasXpressDashboards.createDashboardClient({ baseUrl: base });

    function fail(msg) {
      var m = document.getElementById('message');
      m.style.display = '';
      m.textContent = msg;
    }

    // Wire the export toolbar once the dashboard is rendered. HTML export bakes
    // in the data + libraries (self-contained); PNG/PDF rasterize the live board.
    function wireToolbar(spec, handle) {
      var bar = document.getElementById('cxd-toolbar');
      var trigger = document.getElementById('cxd-download-btn');
      var menu = document.getElementById('cxd-download-menu');
      var X = CanvasXpressDashboards;
      var slug = (spec.id || spec.title || 'dashboard');
      bar.style.display = 'flex';

      function closeMenu() { menu.hidden = true; trigger.setAttribute('aria-expanded', 'false'); }
      function openMenu() { menu.hidden = false; trigger.setAttribute('aria-expanded', 'true'); }

      trigger.addEventListener('click', function (e) {
        e.stopPropagation();
        if (menu.hidden) openMenu(); else closeMenu();
      });
      document.addEventListener('click', function (e) {
        if (!menu.hidden && !menu.contains(e.target) && e.target !== trigger) closeMenu();
      });

      menu.addEventListener('click', function (e) {
        var btn = e.target.closest ? e.target.closest('button[data-act]') : null;
        if (!btn) return;
        var act = btn.getAttribute('data-act');
        var done = function () { btn.disabled = false; closeMenu(); };
        var oops = function (err) { btn.disabled = false; alert('Export failed: ' + (err && err.message || err)); };
        btn.disabled = true;
        // Wrap in try/catch so a synchronous failure (e.g. a missing library)
        // surfaces as an alert instead of silently doing nothing.
        try {
          var task = null;
          if (act === 'html') {
            var liveParams = handle && typeof handle.getParams === 'function' ? handle.getParams() : undefined;
            task = X.exportDashboardHtml(spec, { baseUrl: base, umdUrl: UMD_URL, dashboardUrl: location.href, filename: slug + '.html', params: liveParams });
          } else if (act === 'png') {
            task = X.exportDashboardPng(handle.container, { filename: slug + '.png' });
          } else if (act === 'pdf') {
            task = X.exportDashboardPdf(handle.container, { filename: slug + '.pdf' });
          }
          Promise.resolve(task).then(done, oops);
        } catch (err) {
          oops(err);
        }
      });
    }

    if (!id) {
      fail('No dashboard id in the URL (expected ?id=…).');
    } else {
      client.load(id, owner ? { owner: owner } : undefined).then(function (spec) {
        document.title = (spec.title || spec.id) + ' · CanvasXpress Dashboards';
        document.getElementById('message').style.display = 'none';
        return CanvasXpressDashboards.renderDashboard(spec, 'dashboard', { baseUrl: base })
          .then(function (handle) {
            // The page chrome (toolbar) follows the dashboard's light/dark theme, not only the OS
            document.documentElement.setAttribute('data-cx-ui-theme',
              document.getElementById('dashboard').getAttribute('data-cx-ui-theme') || 'auto');
            wireToolbar(spec, handle);
          });
      }).catch(function (err) {
        if (err && err.status === 401) fail('Sign in to view this dashboard.');
        else if (err && err.status === 404) fail('Dashboard "' + id + '" not found.');
        else fail('Could not load the dashboard: ' + (err && err.message || err));
      });
    }
  </script>
</body>
</html>
