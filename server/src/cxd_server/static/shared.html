<!doctype html>
<html lang="en" data-cx-ui-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/favicon.png" />
  <title>Shared dashboard · CanvasXpress Dashboards</title>

  <link href="https://www.canvasxpress.org/dist/canvasXpress.css" rel="stylesheet" />
  <script src="https://www.canvasxpress.org/dist/canvasXpress.min.js"></script>
  <script src="./canvasxpress-dashboards.umd.js"></script>

  <style>
    body { margin: 0; font-family: var(--cx-font-sans); background: var(--cx-ui-surface-sunken); color: var(--cx-ui-text); }
    header { padding: 16px 24px 8px; display: flex; align-items: baseline; gap: 12px; }
    header h1 { margin: 0; font-size: 18px; }
    header .badge { font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
      color: var(--cx-ui-on-accent); background: var(--cx-ui-text-muted); padding: 2px 8px; border-radius: var(--cx-radius-lg); }
    header .owner { color: var(--cx-ui-text-muted); font-size: 13px; }
    #dashboard { padding: 8px 24px 32px; }
    #message { padding: 32px 24px; color: var(--cx-ui-text-muted); }
  </style>
</head>
<body class="cX-UI-Controls">
  <!-- No dashboard name: the dashboard renders name-free everywhere (builder,
       dashboards page, share view) — only a read-only badge + owner remain. -->
  <header>
    <span class="badge">read-only</span>
    <span class="owner" id="owner"></span>
  </header>
  <div id="message">Loading…</div>
  <div id="dashboard"></div>

  <script>
    // Read-only viewer: resolve ?token=… to its spec via the persistence client,
    // then render with the standard renderer. Data still resolves through the
    // connectors endpoint with the *viewer's* own session/permissions.
    var token = new URLSearchParams(location.search).get('token');
    // Base the client on the path prefix this page is served under, so share
    // links work both at / and behind a reverse-proxy subpath (e.g. /dashboards/).
    var client = CanvasXpressDashboards.createDashboardClient({
      baseUrl: location.pathname.replace(/\/[^/]*$/, '')
    });

    function fail(msg) {
      document.getElementById('message').textContent = msg;
    }

    if (!token) {
      fail('No share token in the URL (expected ?token=…).');
    } else {
      client.loadShared(token).then(function (result) {
        var spec = result.spec;
        document.getElementById('message').style.display = 'none';
        if (result.owner) document.getElementById('owner').textContent = 'shared by ' + result.owner;
        return CanvasXpressDashboards.renderDashboard(spec, 'dashboard').then(function () {
          // The page chrome follows the dashboard's light/dark theme, not only the OS
          document.documentElement.setAttribute('data-cx-ui-theme',
            document.getElementById('dashboard').getAttribute('data-cx-ui-theme') || 'auto');
        });
      }).catch(function (err) {
        if (err.status === 401) fail('This dashboard requires you to be logged in to view it.');
        else if (err.status === 404) fail('Share link not found or no longer shared.');
        else fail('Could not load dashboard: ' + err.message);
      });
    }
  </script>
</body>
</html>
